name: Deploy to GitHub Pages

# Jeder Push auf den Default-Branch veröffentlicht den aktuellen Stand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (aktiviert Pages beim ersten Lauf)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r signum _site/signum

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
