<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU Data Act — Ableitung von Rechtsfolgen</title>
<meta name="description" content="Bewertungsgegenstand + Anknüpfungspunkt + Sachverhalt = Rechtsfolge. Läuft vollständig offline.">
<style>

:root {
  --tinte:   #14181C;
  --grau:    #5B6369;
  --linie:   #D8DBDE;
  --flaeche: #F5F6F7;
  --papier:  #FFFFFF;
  --akzent:  #0F6152;
  --warn:    #8A5A12;

  --schrift: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --tabellar: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
              "Liberation Mono", monospace;

  --a1: .25rem; --a2: .5rem; --a3: .75rem; --a4: 1rem;
  --a5: 1.5rem; --a6: 2rem;

  --t-mini:  .6875rem;
  --t-meta:  .75rem;
  --t-klein: .8125rem;
  --t-text:  .9375rem;
  --t-gross: 1.375rem;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papier); color: var(--tinte);
  font-family: var(--schrift); font-size: var(--t-text); line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.25; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
.verborgen {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

.seite { max-width: 76rem; margin: 0 auto; padding: var(--a5) var(--a5) var(--a6); }

/* --------------------------------------------------------------- Kopf */
.kopf { border-bottom: 2px solid var(--tinte); padding-bottom: var(--a3);
        margin-bottom: var(--a4); }
.kopf h1 { font-size: var(--t-gross); letter-spacing: -.012em; }
.kopf__zeile { font-size: var(--t-klein); color: var(--grau); margin-top: var(--a1); }
.kopf__hinweis { font-size: var(--t-mini); color: var(--grau); margin-top: var(--a2); }

/* ------------------------------------------------------------- Formel */
/* Der Kern der Folie: die Gleichung füllt sich beim Klicken. */
.formel {
  display: grid; align-items: stretch; gap: var(--a2);
  grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
  margin-bottom: var(--a5);
}
.formel__feld {
  border: 1px solid var(--linie); border-radius: 2px;
  background: var(--flaeche); padding: var(--a2) var(--a3); min-width: 0;
  text-align: left; font: inherit; color: inherit;
}
button.formel__feld { cursor: pointer; }
button.formel__feld:hover { border-color: var(--grau); }
.formel__feld--voll { background: var(--papier); border-color: var(--tinte); }
.formel__feld--ziel { background: var(--akzent); border-color: var(--akzent);
                      color: var(--papier); }
.formel__marke {
  font-family: var(--tabellar); font-size: var(--t-mini);
  text-transform: uppercase; letter-spacing: .05em; opacity: .75;
}
.formel__wert { font-size: var(--t-klein); font-weight: 600; margin-top: var(--a1);
                min-height: 1.3em; }
.formel__wert--leer { font-weight: 400; opacity: .45; }
.formel__op { align-self: center; font-size: var(--t-gross); color: var(--grau); }

/* ------------------------------------------------------------- Spalten */
/* Jede Ebene neben der vorigen: der ganze Weg bleibt sichtbar. */
.spalten {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--a3); align-items: start; margin-bottom: var(--a5);
}
.spalte { border: 1px solid var(--linie); border-radius: 2px; min-width: 0; }
.spalte--leer { border-style: dashed; background: var(--flaeche); }
.spalte__kopf {
  display: flex; gap: var(--a2); align-items: center;
  background: var(--tinte); color: var(--papier);
  padding: var(--a2) var(--a3); font-size: var(--t-mini);
  text-transform: uppercase; letter-spacing: .05em;
}
.spalte--leer .spalte__kopf { background: var(--grau); }
.spalte__nr {
  display: inline-grid; place-items: center; width: 1.2rem; height: 1.2rem;
  border-radius: 2px; background: rgba(255,255,255,.2);
  font-family: var(--tabellar); font-weight: 600;
}
.spalte__leer { padding: var(--a3); font-size: var(--t-meta); color: var(--grau); }

.knoten {
  display: grid; gap: var(--a1); width: 100%; text-align: left;
  background: none; border: 0; border-left: 3px solid transparent;
  padding: var(--a3); cursor: pointer;
  transition: background-color .12s ease-out, border-color .12s ease-out;
}
.knoten + .knoten { border-top: 1px solid var(--linie); }
.knoten:hover { background: var(--flaeche); border-left-color: var(--grau); }
.knoten--an { background: var(--flaeche); border-left-color: var(--akzent); }
.knoten__name { font-size: var(--t-klein); }
.knoten--an .knoten__name { font-weight: 600; }
.knoten__erg { color: var(--akzent); font-weight: 600; }
.knoten__kurz { font-size: var(--t-mini); color: var(--grau); }
.knoten__kap {
  justify-self: start; font-family: var(--tabellar); font-size: var(--t-mini);
  background: var(--tinte); color: var(--papier);
  padding: .1rem var(--a2); border-radius: 2px;
}
.knoten--an .knoten__kap { background: var(--akzent); }
.knoten__marke { font-size: var(--t-mini); color: var(--grau); }
.knoten__marke--offen { color: var(--warn); }

/* ------------------------------------------------------------ Ergebnis */
.ergebnis { margin-top: var(--a5); border-top: 2px solid var(--tinte);
            padding-top: var(--a4); }
.ergebnis__leer { color: var(--grau); font-size: var(--t-klein); }
.ergebnis__kopf {
  display: flex; flex-wrap: wrap; gap: var(--a2) var(--a4); align-items: baseline;
  margin-bottom: var(--a3);
}
.ergebnis__kopf h2 { font-size: var(--t-text); }
.ergebnis__zahl {
  font-family: var(--tabellar); font-size: var(--t-klein); color: var(--grau);
}
.ergebnis__artikel {
  font-family: var(--tabellar); font-size: var(--t-mini); color: var(--grau);
  margin-left: auto;
}
.ergebnis__hinweis {
  font-size: var(--t-meta); color: var(--grau); margin-bottom: var(--a3);
  max-width: 62rem;
}
.ergebnis__hinweis--warn {
  border-left: 3px solid var(--warn); padding-left: var(--a3); color: var(--tinte);
}

.liste { display: grid; gap: 1px; background: var(--linie);
         border: 1px solid var(--linie); }
.req {
  display: grid; grid-template-columns: 6.5rem 10.5rem minmax(0, 1fr) 11rem 5.5rem;
  gap: var(--a3); align-items: baseline; background: var(--papier);
  padding: var(--a2) var(--a3); font-size: var(--t-klein);
}
/* Richtet sich die Anforderung an jemand anderen, ist sie für die gewählte
   Rolle keine eigene Pflicht - entweder ein durchsetzbarer Anspruch oder eine
   Pflicht der Gegenseite. Beides gehört sichtbar unterschieden. */
.req--fremd { background: var(--flaeche); }
.req--fremd .req__titel { color: var(--grau); }
.req--anspruch { border-left: 3px solid var(--akzent); }
.req__id, .req__stelle {
  font-family: var(--tabellar); font-size: var(--t-mini); color: var(--grau);
}
.req__adressat { font-size: var(--t-mini); color: var(--grau); font-style: italic; }
.req__typ { font-size: var(--t-mini); color: var(--grau); white-space: nowrap; }

/* --------------------------------------------------------------- Fuß */
.fuss {
  margin-top: var(--a6); padding-top: var(--a3); border-top: 1px solid var(--linie);
  display: flex; flex-wrap: wrap; gap: var(--a2) var(--a4);
  font-size: var(--t-mini); color: var(--grau);
}
.fuss__stand { flex-basis: 100%; max-width: 62rem; }
.fuss__luecke {
  flex-basis: 100%; border-left: 3px solid var(--linie); padding-left: var(--a3);
  margin-bottom: var(--a2); max-width: 62rem; color: var(--tinte);
  font-size: var(--t-meta);
}
.tat {
  background: none; border: 0; padding: 0; color: var(--akzent);
  font-size: var(--t-mini); font-weight: 500; cursor: pointer;
  border-bottom: 1px solid transparent;
}
.tat:hover { border-bottom-color: var(--akzent); }

@media (max-width: 52rem) {
  .formel { grid-template-columns: 1fr; }
  .formel__op { display: none; }
  .req { grid-template-columns: 1fr; gap: var(--a1); }
  .req__titel { font-weight: 500; }
  .spalten { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
@media print {
  .tat { display: none !important; }
  body { font-size: 9pt; color: #000; }
  .seite { max-width: none; padding: 0; }
  .ergebnis, .req { break-inside: avoid; }
  /* Der Formelstreifen bleibt ganz und bleibt bei seinem Ergebnis. */
  .formel { break-inside: avoid; break-after: avoid; }
  @page { margin: 12mm; size: A4 portrait; }
}

</style>
</head>
<body>
<div class="seite" id="seite"></div>
<p class="verborgen" id="live" role="status" aria-live="polite"></p>

<script id="daten" type="application/json">__DATEN_JSON__</script>
<script>__SKRIPT__</script>
</body>
</html>
