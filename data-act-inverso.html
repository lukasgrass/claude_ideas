<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betroffenheitsanalyse EU Data Act</title>
<meta name="description" content="Betroffenheitsanalyse zur Verordnung (EU) 2023/2854 in fünf Stufen. Läuft vollständig offline.">
<style>

/* ---------------------------------------------------------------- Tokens */
:root {
  --tinte:   #14181C;
  --grau:    #5B6369;
  --linie:   #D8DBDE;
  --flaeche: #F5F6F7;
  --papier:  #FFFFFF;
  --akzent:  #0F6152;
  --warn:    #8A5A12;

  /* Fünf Stufen des Vorgehensmodells, dunkel nach hell.
     Alle geprüft: weißer Text darauf erreicht mindestens 5,3:1. */
  --s1: #0A1A4F;
  --s2: #132C8C;
  --s3: #0A6BB0;
  --s4: #2B7480;
  --s5: #256B55;

  --schrift: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --tabellar: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
              "Liberation Mono", monospace;

  --a1: .25rem; --a2: .5rem; --a3: .75rem; --a4: 1rem;
  --a5: 1.5rem; --a6: 2rem;  --a7: 3rem;

  --t-mini:  .6875rem;  /* 11 */
  --t-meta:  .75rem;    /* 12 */
  --t-klein: .8125rem;  /* 13 */
  --t-text:  .9375rem;  /* 15 */
  --t-gross: 1.375rem;  /* 22 */
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papier); color: var(--tinte);
  font-family: var(--schrift); font-size: var(--t-text); line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0 0 var(--a2); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
[tabindex="-1"]:focus { outline: none; }
.verborgen {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

/* --------------------------------------------------------------- Bühne */
.buehne {
  position: relative; min-height: 100vh;
  display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: var(--a5);
  padding: var(--a5) var(--a6) var(--a7);
}

/* ------------------------------------------------------------ Kopfzeile */
.kopfzeile {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--a2) var(--a5);
  padding-bottom: var(--a4); margin-bottom: var(--a4);
  border-bottom: 2px solid var(--tinte);
}
.kopfzeile h1 { font-size: var(--t-gross); letter-spacing: -.012em; }
.kopfzeile__firma { font-size: var(--t-klein); color: var(--grau); }
/* Die Grenze zwischen Orientierung und Beratung gehört dorthin, wo Schlüsse
   gezogen werden - nicht nur in die Fußzeile. */
.kopfzeile__hinweis {
  font-size: var(--t-mini); color: var(--grau); margin-top: var(--a2);
  padding-top: var(--a2); border-top: 1px solid var(--linie); max-width: 46rem;
}
.kopfzeile__rechts {
  margin-left: auto; display: flex; flex-wrap: wrap;
  gap: var(--a2) var(--a4); align-items: baseline;
}
.kopfzeile__zahl {
  font-family: var(--tabellar); font-size: var(--t-klein); color: var(--grau);
  font-variant-numeric: tabular-nums;
}
.kopfzeile__zahl b { color: var(--tinte); font-size: var(--t-text); }
.kopfzeile__neben { color: var(--grau); font-weight: 400; }

/* ------------------------------------------------ Schrittleiste (links) */
/* Die fünf Schritte der Vorgehensfolie. Sie sind Orientierung, nicht
   Gliederung: sie sagen nur, wo im Bild man gerade steht. Kein Bedienelement. */
.leiste {
  position: sticky; top: var(--a4); align-self: start; z-index: 2;
  border-right: 1px solid var(--linie); padding-right: var(--a4);
}
.leiste__kopf {
  font-size: var(--t-mini); color: var(--grau);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--a3);
}
.leiste__schritt {
  display: grid; grid-template-columns: 1.6rem minmax(0, 1fr);
  gap: var(--a2); align-items: start; padding: var(--a2) 0; color: var(--grau);
}
.leiste__nr {
  display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem;
  border-radius: 2px; background: var(--flaeche); color: var(--grau);
  font-size: var(--t-klein); font-weight: 600; font-variant-numeric: tabular-nums;
}
.leiste__name { font-size: var(--t-meta); line-height: 1.3; }
.leiste__frage { display: none; font-size: var(--t-mini); margin-top: var(--a1); }
.leiste__schritt--an { color: var(--tinte); }
.leiste__schritt--an .leiste__name { font-weight: 600; }
.leiste__schritt--an .leiste__frage { display: block; color: var(--grau); }
.leiste__schritt--an .leiste__nr { color: var(--papier); }
.leiste__schritt--an[data-schritt="1"] .leiste__nr { background: var(--s1); }
.leiste__schritt--an[data-schritt="2"] .leiste__nr { background: var(--s2); }
.leiste__schritt--an[data-schritt="3"] .leiste__nr { background: var(--s3); }
.leiste__schritt--an[data-schritt="4"] .leiste__nr { background: var(--s4); }
.leiste__schritt--an[data-schritt="5"] .leiste__nr { background: var(--s5); }
/* Die Zäsur der Folie zwischen "Bin ich betroffen?" und "Was muss ich tun?" */
.leiste__zaesur {
  margin: var(--a3) 0; padding-top: var(--a2);
  border-top: 1px solid var(--linie);
  font-size: var(--t-mini); color: var(--grau);
}

/* ------------------------------------------------------------ Der Fluss */
.fluss { position: relative; z-index: 1; min-width: 0; }
.marke { display: block; height: 0; overflow: hidden; }

/* Die beiden waagerechten Reihen oben */
.zeile {
  display: flex; flex-wrap: wrap; gap: var(--a3); align-items: stretch;
  padding: var(--a4) 0;
}
.zeile + .zeile { border-top: 1px solid var(--linie); }
.zeile > .karte { flex: 1 1 15rem; max-width: 30rem; }
.zeile > .karte--fest:only-child { max-width: none; }

/* Ab hier läuft jede Säule ohne waagerechte Grenze bis zu ihrer Erntekarte.
   Die Anknüpfungsblöcke brechen um, statt bei zehn Strängen jede Spalte auf
   160 px zu quetschen. */
.gitter {
  display: flex; flex-wrap: wrap; gap: var(--a5) var(--a4); align-items: flex-start;
  margin-top: var(--a4); padding-top: var(--a4); border-top: 1px solid var(--linie);
}
/* Ein Block ist so breit wie seine Säulen, darf schrumpfen und umbrechen -
   so stehen die Anknüpfungspunkte nebeneinander, solange sie passen. */
.block {
  flex: 1 1 calc(var(--spalten, 1) * 16rem);
  min-width: min(100%, calc(var(--spalten, 1) * 13rem));
  max-width: 100%;
}
.block__spalten {
  display: grid; grid-template-columns: repeat(var(--spalten, 1), minmax(0, 1fr));
  gap: var(--a3); align-items: stretch; margin-top: var(--a3);
}
.anker {
  border: 1px solid var(--linie); border-top: 3px solid var(--akzent);
  border-radius: 2px; background: var(--flaeche); padding: var(--a3);
}
.anker__kopf {
  display: flex; gap: var(--a2); align-items: baseline; justify-content: space-between;
  font-family: var(--tabellar); font-size: var(--t-mini); color: var(--grau);
}
.anker__titel { font-size: var(--t-klein); font-weight: 600; margin-top: var(--a1); }
.anker__titel--begriff { border-bottom: 1px dotted var(--grau); cursor: help;
                         display: inline-block; }
.anker__grund { font-size: var(--t-mini); color: var(--grau); margin-top: var(--a2); }
.saeule {
  min-width: 0; height: 100%;
  display: flex; flex-direction: column; gap: var(--a2);
}
.saeule__kopf {
  font-size: var(--t-klein); font-weight: 600;
  padding-bottom: var(--a1); border-bottom: 1px solid var(--linie);
}
/* Die Erntekarte schließt die Säule ab, direkt unter der letzten Frage. */
.saeule .ernte { margin-top: var(--a3); }

/* --------------------------------------------------------------- Karten */
.karte {
  border: 1px solid var(--linie); border-left: 3px solid var(--linie);
  background: var(--papier); border-radius: 2px;
  padding: var(--a3); min-width: 0;
  display: flex; flex-direction: column; gap: var(--a2);
}
.karte--fest { border-left-color: var(--s1); }
.karte--aus { color: var(--grau); border-style: dashed; background: var(--flaeche); }
/* Noch nicht entschieden - sieht bewusst nicht wie ein Ausschluss aus. */
.karte--schwebend {
  border-left-color: var(--warn); border-style: dashed;
  background: var(--papier);
}
.karte--schwebend .karte__grund { color: var(--warn); }
.karte--offen { border-left-color: var(--akzent); }
.karte--gegangen { border-left-color: var(--akzent); background: var(--flaeche); }
.karte__kopf {
  display: flex; gap: var(--a2); align-items: baseline; justify-content: space-between;
  font-family: var(--tabellar); font-size: var(--t-mini); color: var(--grau);
}
.karte__titel { font-size: var(--t-klein); font-weight: 500; }
.karte--aus .karte__titel { font-weight: 400; }
.karte__grund { font-size: var(--t-mini); color: var(--grau); }
.karte--warn { border-left-color: var(--warn); }
.karte__grund--warn { color: var(--warn); }
/* Ziel eines Sprungs aus einer Herkunftszeile, kurz hervorgehoben */
.karte--ziel, .zeile.karte--ziel { outline: 2px solid var(--akzent); outline-offset: 2px; }
/* Innerhalb eines Moduls ist nur eine Frage offen - die muss man finden. */
.karte--dran {
  border-left-color: var(--akzent); border-color: var(--akzent);
  box-shadow: inset 3px 0 0 var(--akzent);
}
.karte--dran .karte__kopf > span:last-child {
  color: var(--akzent); font-weight: 600;
}
.karte__chips { display: flex; flex-wrap: wrap; gap: var(--a1); }

.chip {
  border: 1px solid var(--linie); background: var(--papier); cursor: pointer;
  border-radius: 2px; padding: .15rem var(--a2); font-size: var(--t-mini);
  color: var(--tinte); white-space: nowrap;
  transition: background-color .12s ease-out, border-color .12s ease-out;
}
.chip:hover { background: var(--flaeche); border-color: var(--grau); }
.chip--an { background: var(--akzent); border-color: var(--akzent);
            color: var(--papier); font-weight: 600; }
/* Buchstabenoptionen tragen ihren Text mit und belegen je eine eigene Zeile -
   nebeneinander wären sie in einer Säule von rund 15 rem unlesbar. */
.chip--lang {
  flex: 1 1 100%; white-space: normal; text-align: left;
  display: grid; grid-template-columns: 1.1rem minmax(0, 1fr);
  gap: var(--a2); align-items: baseline; line-height: 1.35;
}
.chip__nr { font-family: var(--tabellar); font-weight: 600; }
.chip[disabled] { cursor: not-allowed; opacity: .55; }
.chip[disabled]:hover { background: var(--papier); border-color: var(--linie); }
.tat[disabled] { color: var(--grau); cursor: default; }
.tat[disabled]:hover { border-bottom-color: transparent; }

/* Ergebnisknoten im Strang */
.ergebnis {
  border: 1px dashed var(--linie); background: var(--flaeche);
  border-radius: 2px; padding: var(--a2) var(--a3);
  font-size: var(--t-mini); color: var(--grau);
}
.ergebnis--warn { border-left: 3px solid var(--warn); color: var(--tinte); }

/* Ergebniskarte am Fuß jeder Säule */
.ernte { border-top: 3px solid var(--akzent); padding-top: var(--a3);
         margin-top: var(--a3); }
.ernte__zahl {
  font-size: var(--t-gross); font-weight: 600; font-variant-numeric: tabular-nums;
  line-height: 1;
}
.ernte__titel { font-size: var(--t-klein); font-weight: 500; margin-top: var(--a1); }
.ernte__kapitel { font-size: var(--t-mini); color: var(--grau); }
.ernte__mehrfach { font-size: var(--t-mini); color: var(--s3); margin-top: var(--a1); }
.ernte details { margin-top: var(--a2); }
.ernte summary {
  cursor: pointer; list-style: none; font-size: var(--t-mini); color: var(--akzent);
  padding: var(--a1) 0;
}
.ernte summary::-webkit-details-marker { display: none; }
.ernte summary::before { content: "▸ "; }
.ernte details[open] summary::before { content: "▾ "; }

/* Fußzeile innerhalb der Bühne */
.fusszeile {
  margin-top: var(--a5); padding-top: var(--a3);
  border-top: 1px solid var(--linie);
  display: flex; flex-wrap: wrap; gap: var(--a2) var(--a5);
  font-size: var(--t-mini); color: var(--grau);
}
.fusszeile .tat { font-size: var(--t-mini); }
.fusszeile__stand { flex-basis: 100%; max-width: 62rem; }

.tat {
  display: inline-block; background: none; border: 0; padding: 0;
  color: var(--akzent); font-size: var(--t-meta); font-weight: 500;
  cursor: pointer; border-bottom: 1px solid transparent; white-space: nowrap;
}
.tat:hover { border-bottom-color: var(--akzent); }
.tat--umbruch { white-space: normal; text-align: left; }
.modul__zahl {
  font-family: var(--tabellar); font-size: var(--t-mini); color: var(--grau);
  font-variant-numeric: tabular-nums;
}
.lead { font-size: var(--t-meta); color: var(--grau); }
.filter__zeile { display: flex; gap: var(--a3); flex-wrap: wrap; padding: var(--a2) 0; }
.reqliste { border-top: 1px solid var(--linie); }
/* ------------------------------------------------------- Anforderungszeile */
.abschnitt__tat { display: flex; gap: var(--a4); align-items: baseline; flex-wrap: wrap; }
.typzeile {
  font-size: var(--t-meta); font-weight: 600; color: var(--grau);
  margin: var(--a5) 0 var(--a2);
}
.reqliste { border-top: 1px solid var(--linie); }

.req { border-bottom: 1px solid var(--linie); }
.req__kopf {
  display: flex; flex-direction: column; gap: var(--a1);
  cursor: pointer; list-style: none;
  padding: var(--a3) var(--a3) var(--a3) calc(var(--a3) - 3px);
  border-left: 3px solid transparent;
}
.req__zeile { display: flex; gap: var(--a3); align-items: baseline; }
.req__meta {
  display: flex; flex-wrap: wrap; gap: var(--a1) var(--a3);
  padding-left: calc(6.5rem + var(--a3));
}
.req__kopf::-webkit-details-marker { display: none; }
.req__kopf:hover { background: var(--flaeche); }
.req[open] > .req__kopf { border-left-color: var(--akzent); background: var(--flaeche); }
.req--spaeter > .req__kopf { border-left-color: var(--grau); }
.req--warn > .req__kopf { border-left-color: var(--warn); }
.req--warn[open] > .req__kopf { border-left-color: var(--warn); }
.req__id {
  font-family: var(--tabellar); font-size: var(--t-meta); color: var(--grau);
  min-width: 6.5rem; flex: 0 0 auto;
}
.req[open] .req__id { color: var(--akzent); }
.req__titel { font-size: var(--t-klein); font-weight: 500; min-width: 0; }
.req__adressat { font-style: italic; }
.req__stelle, .req__frist, .req__typ, .req__adressat {
  font-size: var(--t-meta); color: var(--grau);
}
.req__frist { font-variant-numeric: tabular-nums; }
.req__marke { font-size: var(--t-meta); color: var(--warn); font-weight: 500; }
.req__marke--spaeter, .req__marke--rolle { color: var(--akzent); }

.req__inhalt {
  padding: var(--a2) var(--a3) var(--a5) var(--a3);
  margin-left: 6.5rem; max-width: 62ch;
}
.req__text { font-size: var(--t-klein); }
.req__block { margin-top: var(--a4); }
.req__block h4 {
  font-size: var(--t-meta); font-weight: 600; color: var(--grau);
  margin: 0 0 var(--a2); text-transform: none;
}
.detail {
  display: grid; grid-template-columns: 13rem minmax(0, 1fr);
  gap: var(--a2) var(--a4); margin: 0; font-size: var(--t-klein);
}
.detail dt { color: var(--grau); font-size: var(--t-meta); }
.detail dd { margin: 0; }

.herkunft__rolle {
  font-size: var(--t-meta); color: var(--grau); margin-top: var(--a2);
}
.herkunft__lang { color: var(--grau); }
.herkunft__zeile {
  padding: var(--a1) 0 var(--a1) var(--a3);
  border-left: 1px solid var(--linie); margin: var(--a2) 0;
  font-size: var(--t-klein);
}
.herkunft__wirkung {
  font-size: var(--t-meta); color: var(--grau); margin-left: var(--a2);
}
.herkunft__kommentar { font-size: var(--t-meta); color: var(--grau); }

.sammelblock { border-top: 2px solid var(--tinte); }
.sammelblock > summary {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--a4); cursor: pointer; list-style: none; padding: var(--a3) 0;
}
.sammelblock > summary::-webkit-details-marker { display: none; }
.sammelblock > summary::before { content: "▸ "; color: var(--grau); }
.sammelblock[open] > summary::before { content: "▾ "; }
.sammelblock > summary h2 { font-size: var(--t-modul); display: inline; }
.sammelblock__inhalt { padding-bottom: var(--a5); }

/* ------------------------------------------------------------- Ergebnisse */
.zwischen { margin-bottom: var(--a5); }
.zwischen summary {
  cursor: pointer; font-size: var(--t-meta); color: var(--grau);
  padding: var(--a2) 0; border-bottom: 1px solid var(--linie);
  list-style: none;
}
.zwischen summary::-webkit-details-marker { display: none; }
.zwischen summary::before { content: "▸ "; }
.zwischen[open] summary::before { content: "▾ "; }
.befund {
  border-left: 3px solid var(--akzent); padding: var(--a3) var(--a4);
  background: var(--flaeche); margin-top: var(--a3); font-size: var(--t-klein);
}
.befund--warn { border-left-color: var(--warn); }
.befund__quelle {
  font-family: var(--tabellar); font-size: var(--t-meta); color: var(--grau);
  display: block; margin-bottom: var(--a1);
}
.befundliste { display: flex; flex-direction: column; gap: 0; }

/* ------------------------------------------------------------ Erklärungen */
.begriff {
  border-bottom: 1px dotted var(--grau); cursor: help;
  text-decoration: none; color: inherit;
}
.begriff:hover, .begriff:focus-visible { border-bottom-style: solid; }
.varmarke {
  font-family: var(--tabellar); font-size: .95em; cursor: help;
  border-bottom: 1px dotted var(--grau); color: inherit;
}
.varmarke:hover, .varmarke:focus-visible { border-bottom-style: solid; }
.erkl {
  position: absolute; z-index: 20; max-width: min(30rem, calc(100vw - 2rem));
  background: var(--papier); border: 1px solid var(--tinte);
  border-left: 3px solid var(--akzent);
  padding: var(--a3) var(--a4); font-size: var(--t-klein); line-height: 1.5;
}
.erkl[hidden] { display: none; }
.erkl__kopf { font-weight: 600; }
.erkl__quelle {
  font-family: var(--tabellar); font-size: var(--t-meta); color: var(--grau);
  margin-bottom: var(--a2);
}
.erkl__zeile { margin-top: var(--a2); font-size: var(--t-meta); color: var(--grau); }
/* Antwortmöglichkeiten im Erklärfeld */
.erkl__optionen {
  display: grid; grid-template-columns: 1.2rem minmax(0, 1fr);
  gap: var(--a1) var(--a2); margin: var(--a2) 0 0;
  font-size: var(--t-meta); color: var(--grau);
}
.erkl__optionen dt { font-family: var(--tabellar); }
.erkl__optionen dd { margin: 0; }
.erkl__gewaehlt { color: var(--tinte); font-weight: 600; }
.erkl__zeile b { color: var(--tinte); font-weight: 500; }


/* ----------------------------------------------------------------- Mobil */
@media (max-width: 64rem) {
  /* Eine Spalte: Anknüpfungspunkt und seine Stränge folgen in Dokumentordnung */
  .gitter { grid-template-columns: minmax(0, 1fr); }
  .anker, .saeule { grid-row: auto; grid-column: auto !important; }
  .saeule .ernte { margin-top: var(--a3); }
}
@media (max-width: 48rem) {
  /* Leiste als schmaler Streifen über dem Bild */
  .buehne { grid-template-columns: minmax(0, 1fr); gap: var(--a3);
            padding: var(--a4) var(--a4) var(--a6); }
  .leiste {
    position: sticky; top: 0; background: var(--papier);
    border-right: 0; border-bottom: 1px solid var(--linie);
    padding: var(--a2) 0; display: flex; gap: var(--a3); overflow-x: auto;
  }
  .leiste__kopf, .leiste__zaesur, .leiste__frage { display: none; }
  .leiste__schritt { padding: 0; }
  .leiste__schritt:not(.leiste__schritt--an) .leiste__name { display: none; }
  .req__zeile { flex-direction: column; gap: var(--a1); }
  .req__meta { padding-left: 0; }
  .req__inhalt { margin-left: 0; }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .detail dt { margin-top: var(--a2); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

@media print {
  .tat, .fusszeile .tat { display: none !important; }
  body { font-size: 9pt; color: #000; }
  .buehne { padding: 0; min-height: 0; gap: 8mm; }
  /* Im Druck ist die Leiste stille Beschriftung, keine Fortschrittsanzeige */

":"KONZERN","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"KONZERN (Ja / Nein / Unsicher)"}],"frage_begriffe":[{"start":8,"laenge":11,"begriff":"Unternehmen"},{"start":181,"laenge":16,"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)"}],"erklaertext_begriffe":[{"start":40,"laenge":11,"begriff":"Unternehmen"},{"start":188,"laenge":16,"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)"}]},{"id":"EIN-04","modul":"EIN","frage":"Ist Ihr Unternehmen erst seit weniger als einem Jahr als mittleres Unternehmen eingestuft (vorher Kleinst-/Kleinunternehmen)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"EIN-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"EIN-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Unsicher","bedingung":null,"ziel":"EIN-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"hinweis":"(konservativ) + Hinweis 'Einzelfallprüfung empfohlen', weiter EIN-05","alias_von":"Nein"}],"anzeigebedingung":{"roh":"GROESSE = Mittel","ausdruck":{"op":"=","variable":"GROESSE","wert":"Mittel"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Neu in die Klasse 'mittel' aufgestiegene Unternehmen erhalten eine einjährige Schonfrist von den IoT-Datenpflichten; zusätzlich gilt für Produkte, die ein mittleres Unternehmen neu in Verkehr bringt, eine einjährige Frist ab Inverkehrbringen (wird in M-II berücksichtigt). Beispiel: Wachstum von 45 auf 60 Mitarbeiter im März 2026 → Schonfrist bis März 2027.","rechtsgrundlage":"Art. 7 Abs. 1 UAbs. 2; n Navigationsdienst im Fahrzeug. Nicht verbundene Dienste: reine Beratung, Analyse ohne Datenrückfluss zum Produkt, Reparatur-/Wartung vor Ort, Finanzierung, Stromversorgung, Mobilfunkkonnektivität. Im Zweifel gilt der Data Act (EG 17). Auch Dienste, die nicht vom Hersteller, sondern von einem Dritten angeboten werden, sind erfasst.","rechtsgrundlage":"Art. 2 Nr. 6; EG 17","gesetzte_variablen":[{"variable":"VERBUNDENER_DIENST","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"VERBUNDENER_DIENST (Ja / Nein / Unsicher)"}],"frage_begriffe":[{"start":69,"laenge":5,"begriff":"Daten"},{"start":98,"laenge":18,"begriff":"Vernetztes Produkt"}],"erklaertext_begriffe":[{"start":0,"laenge":18,"begriff":"Verbundener Dienst"}]},{"id":"II-03","modul":"M-II","frage":"Besteht die Hauptfunktion des Produkts darin, Daten für andere Personen als den Nutzer zu speichern, zu verarbeiten oder zu übertragen (z. B. Server, Netzwerkgeräte, Rechenzentrums-Hardware)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"II-09","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"kein vernetztes Produkt i. S. d. Data Act; ggf. M-VI prüfen","ergebnis_baustein_begriffe":[{"start":5,"laenge":18,"begriff":"Vernetztes Produkt"}]},{"antwort":"Nein","bedingung":{"ausdruck":{"op":"≠","variable":"GROESSE","wert":"Groß"},"vollstaendig":true,"klartext":[]},"ziel":"II-04","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":{"ausdruck":{"op":"nicht","operand":{"op":"≠","variable":"GROESSE","wert":"Groß"}},"vollstaendig":true,"klartext":[]},"ziel":"II-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null}],"anzeigebedingung":{"roh":"VERNETZTES_PRODUKT = Ja","ausdruck":{"op":"=","variable":"VERNETZTES_PRODUKT","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Ausgenommen sind Geräte, deren Zweck die Datenverarbeitung im Auftrag Dritter ist – etwa Server, Router oder Speichersysteme, die ein Hoster für seine Kunden betreibt. Grenzfall: Ein Industrie-Gateway, das Maschinendaten des Nutzers selbst sammelt und weiterleitet, ist ein vernetztes Produkt, weil es für den Nutzer arbeitet.","rechtsgrundlage":"Art. 2 Nr. 5 (letzter Halbsatz); EG 16","gesetzte_variablen":[],"frage_begriffe":[{"start":46,"laenge":5,"begriff":"Daten"},{"start":80,"laenge":6,"begriff":"Nutzer"}],"erklaertext_begriffe":[{"start":151,"laenge":6,"begriff":"Kunde"},{"start":225,"laenge":7,"begriff":"Nutzer"},{"start":274,"laenge":18,"begriff":"Vernetztes Produkt"}]},{"id":"II-04","modul":"M-II","frage":"Stellen Sie das Produkt bzw. den Dienst als Unterauftragnehmer im Auftrag eines anderen Unternehmens her oder bereit?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"II-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":{"ausdruck":{"op":"und","links":{"op":"∈","variable":"GROESSE","werte":["Kleinst","Klein"]},"rechts":{"op":"=","variable":"KONZERN","wert":"Nein"}},"vollstaendig":true,"klartext":[]},"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Ausnahme Art. 7 Abs. 1 – Kapitel-II-Pflichten gelten nicht für Ihre Produkte/Dienste","weiter_mit":"II-09","anschluss":"frage"},{"antwort":"Nein","bedingung":{"ausdruck":{"op":"und","links":{"op":"und","links":{"op":"=","variable":"GROESSE","wert":"Mittel"},"rechts":{"op":"=","variable":"MITTEL_NEU","wert":"Ja"}},"rechts":{"op":"=","variable":"KONZERN","wert":"Nein"}},"vollstaendig":true,"klartext":[]},"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einjährige Schonfrist Art. 7 Abs. 1 UAbs. 2","weiter_mit":"II-09","anschluss":"frage"},{"antwort":"Nein","bedingung":{"ausdruck":{"op":"und","links":{"op":"nicht","operand":{"op":"und","links":{"op":"∈","variable":"GROESSE","werte":["Kleinst","Klein"]},"rechts":{"op":"=","variable":"KONZERN","wert":"Nein"}}},"rechts":{"op":"nicht","operand":{"op":"und","links":{"op":"und","links":{"op":"=","variable":"GROESSE","wert":"Mittel"},"rechts":{"op":"=","variable":"MITTEL_NEU","wert":"Ja"}},"rechts":{"op":"=","variable":"KONZERN","wert":"Nein"}}}},"vollstaendig":true,"klartext":[]},"ziel":"II-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null}],"anzeigebedingung":{"roh":"GROESSE ≠ Groß und ((VERNETZTES_PRODUKT = Ja und II-03 = Nein) oder VERBUNDENER_DIENST = Ja)","ausdruck":{"op":"und","links":{"op":"≠","variable":"GROESSE","wert":"Groß"},"rechts":{"op":"oder","links":{"op":"und","links":{"op":"=","variable":"VERNETZTES_PRODUKT","wert":"Ja"},"rechts":{"op":"antwort","vergleich":"=","frage":"II-03","wert":"Nein"}},"rechts":{"op":"=","variable":"VERBUNDENER_DIENST","wert":"Ja"}}},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Kleinst- und Kleinunternehmen sind von den IoT-Pflichten befreit – aber nicht, wenn sie als Auftragsfertiger/Entwickler für ein größeres Unternehmen tätig sind oder zu einer größeren Gruppe gehören. Beispiel: Ein 20-Personen-Elektronikentwickler, der ein Smart-Meter im Auftrag eines Energiekonzerns konzipiert, ist nicht befreit. Achtung: Die Ausnahme befreit nur von der Hersteller-/Anbieterrolle; wer als Dateninhaber Daten fremder Produkte hält, bleibt verpflichtet (EG 41).","rechtsgrundlage":"Art. 7 Abs. 1; EG 41","gesetzte_variablen":[{"variable":"UNTERAUFTRAG","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"UNTERAUFTRAG (Ja / Nein)"}],"frage_begriffe":[{"start":88,"laenge":12,"begriff":"Unternehmen"}],"erklaertext_begriffe":[{"start":13,"laenge":16,"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)"},{"start":137,"laenge":11,"begriff":"Unternehmen"},{"start":408,"laenge":12,"begriff":"Dateninhaber"},{"start":421,"laenge":5,"begriff":"Daten"}]},{"id":"II-05","modul":"M-II","frage":"Bringen Sie ab dem 13.09.2026 neue oder überarbeitete Produkte (bzw. dazugehörige Dienste) erstmals auf den EU-Markt?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"II-06","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"'Access by design' Art. 3 Abs. 1 gilt für diese Produkte"},{"antwort":"Nein","bedingung":null,"ziel":"II-06","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"Art. 3 Abs. 1 gilt nicht für Bestandsprodukte; Informations- und Bereitstellungspflichten gelten dennoch seit 12.09.2025"}],"anzeigebedingung":{"roh":"II-04 = Ja oder (II-04 = Nein und keine Ausnahme ausgelöst)","ausdruck":{"op":"oder","links":{"op":"antwort","vergleich":"=","frage":"II-04","wert":"Ja"},"rechts":{"op":"und","links":{"op":"antwort","vergleich":"=","frage":"II-04","wert":"Nein"},"rechts":{"op":"unklar","text":"keine Ausnahme ausgelöst"}}},"vollstaendig":false,"klartext":["keine Ausnahme ausgelöst"],"sonst_ziel":null},"erklaertext":"Die Pflicht, Produkte so zu gestalten, dass Nutzer standardmäßig direkt auf die Daten zugreifen können, gilt nur für Produkte, die nach dem 12.09.2026 in Verkehr gebracht werden. Grenzfall: Ein unverändertes Produktmodell, das bereits vor dem Stichtag verkauft wurde und weiter verkauft wird, wird nach herrschender Lesart nicht 'erstmals' in Verkehr gebracht (Auslegungsunsicherheit, siehe Offene Punkte). Für Bestandsprodukte gelten aber bereits die vorvertraglichen Informationspflichten (Art. 3 Abs. 2, 3) und die Datenbereitstellung auf Verlangen (Art. 4, 5). Zusatz für mittlere Unternehmen (GROESSE = Mittel, KONZERN = Nein): Für jedes vernetzte Produkt gilt zusätzlich eine Schonfrist von einem Jahr ab seinem Inverkehrbringen (Art. 7 Abs. 1 UAbs. 2) – im Produktkalender je Modell vermerken.","rechtsgrundlage":"Art. 3 Abs. 1; Art. 50 UAbs. 3; Art. 2 Nr. 22","gesetzte_variablen":[{"variable":"NEUPRODUKT_2026","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"NEUPRODUKT_2026 (Ja / Nein)"}],"erklaertext_begriffe":[{"start":44,"laenge":6,"begriff":"Nutzer"},{"start":80,"laenge":5,"begriff":"Daten"},{"start":585,"laenge":11,"begriff":"Unternehmen"},{"start":643,"laenge":17,"begriff":"Vernetztes Produkt"},{"start":718,"laenge":16,"begriff":"Bereitstellung auf dem Markt / Inverkehrbringen"}]},{"id":"II-06","modul":"M-II","frage":"Wo liegen die vom Produkt/Dienst erzeugten Daten?","antwortoptionen":[{"schluessel":"A","text":"Bei uns bzw. bei einem von uns beauftragten Dienstleister (Backend, Cloud)","form":"buchstabe"},{"schluessel":"B","text":"Ausschließlich auf dem Gerät, der Nutzer kann direkt darauf zugreifen","form":"buchstabe"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"A","nein":"B","unsicher":"Unsicher"},"kanten":[{"antwort":"A","bedingung":null,"ziel":"II-07","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"B","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Design-, Informations- und Vertragspflichten (Art. 3, 7); keine Bereitstellungspflicht nach Art. 4 Abs. 1, solange direkter Zugriff möglich ist; ob die Weitergabe an Dritte nach Art. 5 ohne Dateninhaber entfällt, ist ungeklärt – Einzelfallprüfung empfohlen","weiter_mit":"II-09","anschluss":"frage","ergebnistext_begriffe":[{"start":190,"laenge":12,"begriff":"Dateninhaber"}]},{"antwort":"Unsicher","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einzelfallprüfung empfohlen – Dateninhaberschaft klären","weiter_mit":"II-09","anschluss":"frage"}],"anzeigebedingung":{"roh":"erreicht über II-05","ausdruck":{"op":"unklar","art":"erreichbarkeit","text":"erreicht über II-05","referenzierte_fragen":["II-05"]},"vollstaendig":false,"klartext":["erreicht über II-05"],"sonst_ziel":null},"erklaertext":"Wer die Daten aus dem Produkt/Dienst erhält und kontrolliert, ist 'Dateninhaber' und muss sie dem Nutzer und von ihm benannten Dritten auf Verlangen bereitstellen. Beispiel A: Maschinendaten werden in Ihre IoT-Plattform übertragen. Beispiel B: Ein Messgerät speichert Daten nur lokal, der Nutzer liest sie per USB aus. Ein reiner Auftragsverarbeiter (Cloud-Dienstleister) ist nicht Dateninhaber (EG 22).","rechtsgrundlage":"Art. 2 Nr. 13; Art. 3 Abs. 1; Art. 4 Abs. 1; EG 20, 22","gesetzte_variablen":[{"variable":"DATENINHABER","zuordnung":[{"antwort":"A","wert":"Ja"},{"antwort":"B","wert":"Nein"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"ausdrücklich ('… bei …')","sicher":true,"roh":"DATENINHABER (Ja bei A / Nein bei B / Unsicher)"}],"frage_begriffe":[{"start":43,"laenge":5,"begriff":"Daten"}],"erklaertext_begriffe":[{"start":8,"laenge":5,"begriff":"Daten"},{"start":67,"laenge":12,"begriff":"Dateninhaber"},{"start":98,"laenge":6,"begriff":"Nutzer"}]},{"id":"II-07","modul":"M-II","frage":"Enthalten die Daten, die Nutzer verlangen könnten, Geschäftsgeheimnisse Ihres Unternehmens oder eines Dritten?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein","unsicher":"Unsicher"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"II-08","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"Geschäftsgeheimnisse identifizieren, Schutzmaßnahmen vereinbaren, Ablehnung nur bei schwerem wirtschaftlichem Schaden, Meldepflicht an Behörde"},{"antwort":"Nein","bedingung":null,"ziel":"II-08","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Unsicher","bedingung":null,"ziel":"II-08","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"hinweis":"Hinweis 'Einzelfallprüfung empfohlen – Geschäftsgeheimnisse inventarisieren'"}],"anzeigebedingung":{"roh":"DATENINHABER = Ja","ausdruck":{"op":"=","variable":"DATENINHABER","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Geschäftsgeheimnisse sind nicht allgemein bekannte, wirtschaftlich wertvolle und angemessen geschützte Informationen (z. B. Prozessparameter, Rezepturen, Steuerungslogik). Wichtig: Sie berechtigen nicht dazu, die Herausgabe pauschal zu verweigern – sie müssen vor der Herausgabe konkret benannt und durch vereinbarte Maßnahmen (NDA, Zugangsbeschränkungen) geschützt werden. Nur im Ausnahmefall eines nachweisbar drohenden schweren wirtschaftlichen Schadens kann die Herausgabe einzelner Daten verweigert werden.","rechtsgrundlage":"Art. 4 Abs. 6–8; Art. 5 Abs. 9–11; Art. 8 Abs. 6; EG 31","gesetzte_variablen":[{"variable":"GESCHAEFTSGEHEIMNIS","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"GESCHAEFTSGEHEIMNIS (Ja / Nein / Unsicher)"}],"frage_begriffe":[{"start":14,"laenge":5,"begriff":"Daten"},{"start":25,"laenge":6,"begriff":"Nutzer"},{"start":78,"laenge":12,"begriff":"Unternehmen"}],"erklaertext_begriffe":[{"start":487,"laenge":5,"begriff":"Daten"}]},{"id":"II-08","modul":"M-II","frage":"Enthalten die Daten personenbezogene Daten von anderen Personen als dem Nutzer selbst (z. B. Mitarbeiter, Fahrer, Haushaltsmitglieder)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein","unsicher":"Unsicher"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"II-09","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"Bereitstellung an Unternehmensnutzer/Dritte nur mit DSGVO-Rechtsgrundlage; Anonymisierung/Beschränkung auf Nutzerdaten prüfen"},{"antwort":"Nein","bedingung":null,"ziel":"II-09","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Unsicher","bedingung":null,"ziel":"II-09","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"hinweis":"Hinweis 'Einzelfallprüfung empfohlen – Datenschutzprüfung'"}],"anzeigebedingung":{"roh":"DATENINHABER = Ja","ausdruck":{"op":"=","variable":"DATENINHABER","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Ist der Nutzer ein Unternehmen, benötigt es für personenbezogene Daten seiner Mitarbeiter (z. B. Fahrerverhalten im Lkw, Bedienerkennung an der Maschine) eine eigene Rechtsgrundlage nach Art. 6 DSGVO; der Data Act selbst liefert keine. Beispiel: Ein Leasingunternehmen verlangt Telematikdaten – Standortdaten der Fahrer sind personenbezogen. Ist der Nutzer selbst die betroffene Person (Verbraucher mit eigenem Gerät), gelten die Zugangsrechte uneingeschränkt.","rechtsgrundlage":"Art. 1 Abs. 5; Art. 4 Abs. 12; Art. 5 Abs. 7; EG 7, 34","gesetzte_variablen":[{"variable":"PBD_DRITTER","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"PBD_DRITTER (Ja / Nein / Unsicher)"}],"frage_begriffe":[{"start":14,"laenge":5,"begriff":"Daten"},{"start":20,"laenge":22,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":72,"laenge":6,"begriff":"Nutzer"}],"erklaertext_begriffe":[{"start":8,"laenge":6,"begriff":"Nutzer"},{"start":19,"laenge":11,"begriff":"Unternehmen"},{"start":48,"laenge":22,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":368,"laenge":17,"begriff":"Betroffene Person"},{"start":387,"laenge":11,"begriff":"Verbraucher"}]},{"id":"II-09","modul":"M-II","frage":"Nutzt Ihr Unternehmen vernetzte Produkte oder verbundene Dienste anderer Hersteller (gekauft, gemietet oder geleast)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"II-10","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"II-11","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null}],"anzeigebedingung":{"roh":"ROLLE_NUTZER = Ja (sonst direkt II-11)","ausdruck":{"op":"=","variable":"ROLLE_NUTZER","wert":"Ja"},"vollstaendig":true,"klartext":["sonst direkt II-11"],"sonst_ziel":"II-11"},"erklaertext":"Als Nutzer haben Sie Rechte: kostenloser Zugang zu den Daten Ihrer Maschinen, Fahrzeuge, Geräte und das Recht, diese Daten an Dienstleister Ihrer Wahl weitergeben zu lassen (z. B. unabhängige Wartung). Beispiel: Ein Betreiber vernetzter Produktionsanlagen kann vom Maschinenhersteller die Betriebsdaten für einen eigenen Analysedienstleister verlangen. Ausnahme: Produkte von eigenständigen Kleinst-/Kleinunternehmen.","rechtsgrundlage":"Art. 2 Nr. 12; Art. 4 Abs. 1; Art. 5 Abs. 1; EG 18","gesetzte_variablen":[{"variable":"NUTZER_AKTIV","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"NUTZER_AKTIV (Ja / Nein)"}],"frage_begriffe":[{"start":10,"laenge":11,"begriff":"Unternehmen"},{"start":22,"laenge":18,"begriff":"Vernetztes Produkt"},{"start":46,"laenge":18,"begriff":"Verbundener Dienst"}],"erklaertext_begriffe":[{"start":4,"laenge":6,"begriff":"Nutzer"},{"start":55,"laenge":5,"begriff":"Daten"},{"start":400,"laenge":16,"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)"}]},{"id":"II-10","modul":"M-II","frage":"Möchten Sie erlangte Daten nutzen, um ein Produkt zu entwickeln, das mit dem Produkt des Herstellers im Wettbewerb steht, oder Einblicke in dessen Geschäftslage zu gewinnen?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Unzulässiger Verwendungszweck (Art. 4 Abs. 10) – Zugangsrecht besteht, diese Nutzung ist aber verboten","weiter_mit":"II-11","anschluss":"frage"},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Nutzerrechte nach Art. 4, 5 nutzbar; Pflichten Art. 4 Abs. 10, 11 beachten","weiter_mit":"II-11","anschluss":"frage"},{"antwort":"Unsicher","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einzelfallprüfung empfohlen – Wettbewerbsverhältnis nach Marktabgrenzung prüfen","weiter_mit":"II-11","anschluss":"frage"}],"anzeigebedingung":{"roh":"NUTZER_AKTIV = Ja","ausdruck":{"op":"=","variable":"NUTZER_AKTIV","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Zulässig ist z. B. die Nutzung der Daten für eigene Prozessoptimierung, Reparatur, Reverse Engineering zu Reparaturzwecken oder die Entwicklung eines konkurrierenden Dienstes (Wartungsangebot). Verboten ist die Entwicklung eines konkurrierenden vernetzten Produkts (gleicher Produktmarkt) und das Ausspähen von Vermögenswerten/Produktionsmethoden des Herstellers.","rechtsgrundlage":"Art. 4 Abs. 10, 11; Art. 11 Abs. 4; EG 30, 32","gesetzte_variablen":[],"frage_begriffe":[{"start":21,"laenge":5,"begriff":"Daten"}],"erklaertext_begriffe":[{"start":35,"laenge":5,"begriff":"Daten"},{"start":245,"laenge":19,"begriff":"Vernetztes Produkt"}]},{"id":"II-11","modul":"M-II","frage":"Erhalten Sie Daten aus vernetzten Produkten anderer Unternehmen, weil deren Nutzer dies verlangt haben (z. B. als unabhängiger Wartungs-, Analyse- oder Versicherungsdienstleister)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":{"ausdruck":{"op":"=","variable":"TORWAECHTER","wert":"Nein"},"vollstaendig":true,"klartext":[]},"ziel":"II-12","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Ja","bedingung":{"ausdruck":{"op":"=","variable":"TORWAECHTER","wert":"Ja"},"vollstaendig":true,"klartext":[]},"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Als Torwächter dürfen Sie diese Daten nicht erhalten (Art. 5 Abs. 3, Art. 6 Abs. 2 Buchst. d)","weiter_mit":null,"anschluss":"ende_modul","ergebnistext_begriffe":[{"start":4,"laenge":10,"begriff":"Torwächter"},{"start":32,"laenge":5,"begriff":"Daten"}]},{"antwort":"Nein","bedingung":null,"ziel":"ENDE-MODUL","ziel_typ":"ende_modul","ergebnistext":null,"weiter_mit":null}],"anzeigebedingung":{"roh":"ROLLE_DRITTER = Ja (sonst direkt ENDE-MODUL)","ausdruck":{"op":"=","variable":"ROLLE_DRITTER","wert":"Ja"},"vollstaendig":true,"klartext":["sonst direkt ENDE-MODUL"],"sonst_ziel":"ENDE-MODUL"},"erklaertext":"Als 'Dritter' dürfen Sie die Daten nur zu den mit dem Nutzer vereinbarten Zwecken verwenden, müssen sie nach Zweckerreichung löschen, dürfen kein Profiling betreiben (außer für den gewünschten Dienst), keine Konkurrenzprodukte entwickeln und Verbraucher nicht an der Weitergabe hindern. Dark Patterns sind verboten. Torwächter dürfen keine Daten erhalten (siehe EIN-07).","rechtsgrundlage":"Art. 2 Nr. 14; Art. 6; EG 33, 37–39","gesetzte_variablen":[{"variable":"DRITTER_AKTIV","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"DRITTER_AKTIV (Ja / Nein)"}],"frage_begriffe":[{"start":13,"laenge":5,"begriff":"Daten"},{"start":23,"laenge":20,"begriff":"Vernetztes Produkt"},{"start":52,"laenge":11,"begriff":"Unternehmen"},{"start":76,"laenge":6,"begriff":"Nutzer"}],"erklaertext_begriffe":[{"start":29,"laenge":5,"begriff":"Daten"},{"start":54,"laenge":6,"begriff":"Nutzer"},{"start":146,"laenge":9,"begriff":"Profiling"},{"start":242,"laenge":11,"begriff":"Verbraucher"},{"start":316,"laenge":10,"begriff":"Torwächter"}]},{"id":"II-12","modul":"M-II","frage":"Geben Sie diese Daten an weitere Unternehmen weiter (z. B. Subunternehmer, Partner, Datenmarktplätze)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Weitergabe nur mit Vertrag mit dem Nutzer und Übernahme der Geschäftsgeheimnis-Schutzmaßnahmen durch den Empfänger; nie an Torwächter (Art. 6 Abs. 2 Buchst. c, d)","weiter_mit":null,"anschluss":"ende_modul","ergebnistext_begriffe":[{"start":35,"laenge":6,"begriff":"Nutzer"},{"start":60,"laenge":18,"begriff":"Geschäftsgeheimnis / Inhaber eines Geschäftsgeheimnisses"},{"start":123,"laenge":10,"begriff":"Torwächter"}]},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Pflichten des Dritten nach Art. 6 beachten","weiter_mit":null,"anschluss":"ende_modul"}],"anzeigebedingung":{"roh":"DRITTER_AKTIV = Ja","ausdruck":{"op":"=","variable":"DRITTER_AKTIV","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Beispiel: Ein Wartungsdienstleister gibt Maschinendaten an einen spezialisierten Analytics-Partner – zulässig nur, wenn der Nutzer dem vertraglich zugestimmt hat und der Partner dieselben Vertraulichkeitsmaßnahmen einhält. Die Nutzung eines Cloud-Dienstes (auch eines Torwächters) als bloßer Auftragsverarbeiter ist keine 'Weitergabe' (EG 40).","rechtsgrundlage":"Art. 6 Abs. 2 Buchst. c, d; Art. 11 Abs. 3 Buchst. c; EG 33, 40","gesetzte_variablen":[],"frage_begriffe":[{"start":16,"laenge":5,"begriff":"Daten"},{"start":33,"laenge":11,"begriff":"Unternehmen"}],"erklaertext_begriffe":[{"start":124,"laenge":6,"begriff":"Nutzer"},{"start":268,"laenge":11,"begriff":"Torwächter"}]},{"id":"III-01","modul":"M-III","frage":"Sind Sie aufgrund einer gesetzlichen Pflicht (Data Act Art. 5 auf Nutzerverlangen oder anderes EU-/nationales Recht) verpflichtet, anderen Unternehmen Daten bereitzustellen – oder erhalten Sie Daten aufgrund einer solchen Pflicht?","antwortoptionen":[{"schluessel":"A","text":"Ja, wir müssen bereitstellen","form":"buchstabe"},{"schluessel":"B","text":"Ja, wir erhalten Daten","form":"buchstabe"},{"schluessel":"C","text":"Beides","form":"buchstabe"},{"schluessel":"D","text":"Nein","form":"buchstabe"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{},"kanten":[{"antwort":"A","bedingung":null,"ziel":"III-02","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"B","bedingung":null,"ziel":"III-02","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"C","bedingung":null,"ziel":"III-02","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"D","bedingung":null,"ziel":"ENDE-MODUL","ziel_typ":"ende_modul","ergebnistext":null,"weiter_mit":null},{"antwort":"Unsicher","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einzelfallprüfung empfohlen – gesetzliche Bereitstellungspflichten inventarisieren","weiter_mit":null,"anschluss":"ende_modul"}],"anzeigebedingung":{"roh":"DATENINHABER = Ja oder ROLLE_DRITTER = Ja oder DRITTER_AKTIV = Ja oder (ROLLE_PRODUKT = Ja und Art.-7-Ausnahme in II-04 ausgelöst)","ausdruck":{"op":"oder","links":{"op":"oder","links":{"op":"oder","links":{"op":"=","variable":"DATENINHABER","wert":"Ja"},"rechts":{"op":"=","variable":"ROLLE_DRITTER","wert":"Ja"}},"rechts":{"op":"=","variable":"DRITTER_AKTIV","wert":"Ja"}},"rechts":{"op":"und","links":{"op":"=","variable":"ROLLE_PRODUKT","wert":"Ja"},"rechts":{"op":"unklar","text":"Art.-7-Ausnahme in II-04 ausgelöst","referenzierte_fragen":["II-04"]}}},"vollstaendig":false,"klartext":["Art.-7-Ausnahme in II-04 ausgelöst"],"sonst_ziel":null},"erklaertext":"Kapitel III regelt die Bedingungen (fair, angemessen, nicht diskriminierend, transparent – 'FRAND'), wenn eine Datenweitergabe zwischen Unternehmen gesetzlich vorgeschrieben ist. Wichtigster Fall: Ein Nutzer verlangt nach Art. 5, dass Sie seine Maschinendaten einem Dienstleister bereitstellen. Nicht erfasst: freiwillige Datenkooperationen und Auskunftsrechte nach DSGVO.","rechtsgrundlage":"Art. 8 Abs. 1; Art. 12 Abs. 1; EG 42","gesetzte_variablen":[{"variable":"KAP3_ROLLE","zuordnung":[],"wert_unbekannt":true,"moegliche_werte":["Bereitsteller","Empfänger","Beides"],"herleitung":null,"sicher":false,"roh":"KAP3_ROLLE (Bereitsteller / Empfänger / Beides)"}],"frage_begriffe":[{"start":139,"laenge":11,"begriff":"Unternehmen"},{"start":151,"laenge":5,"begriff":"Daten"}],"erklaertext_begriffe":[{"start":136,"laenge":11,"begriff":"Unternehmen"},{"start":201,"laenge":6,"begriff":"Nutzer"}]},{"id":"III-02","modul":"M-III","frage":"Beruht die Pflicht auf dem Data Act (Art. 5) oder auf einer Rechtsvorschrift, die nach dem 12.09.2025 in Kraft getreten ist?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein","unsicher":"Unsicher"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"III-03","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Kapitel III nicht anwendbar – ältere Bereitstellungspflichten bleiben unberührt (Art. 44 Abs. 1, Art. 50 UAbs. 4)","weiter_mit":null,"anschluss":"ende_modul"},{"antwort":"Unsicher","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einzelfallprüfung empfohlen – zeitliche Anwendbarkeit von Kapitel III ist rechtlich umstritten","weiter_mit":"III-03","anschluss":"frage"}],"anzeigebedingung":{"roh":"KAP3_ROLLE gesetzt","ausdruck":{"op":"gesetzt","variable":"KAP3_ROLLE"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Beispiel für ältere Pflichten: Fahrzeug-Reparaturdaten nach der Typgenehmigungsverordnung – diese bleiben nach ihren eigenen Regeln bestehen. Grenzfall: Für Weitergaben nach Art. 5 Data Act ist die Anwendung von Kapitel III nach dem Zweck der Verordnung (EG 42) gewollt, obwohl der Wortlaut von Art. 50 UAbs. 4 nicht eindeutig ist – daher 'Ja' auch bei Art.-5-Fällen.","rechtsgrundlage":"Art. 50 UAbs. 4; Art. 44 Abs. 1; Art. 12 Abs. 1","gesetzte_variablen":[{"variable":"KAP3_ZEIT","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"KAP3_ZEIT (Ja / Nein / Unsicher)"}]},{"id":"III-03","modul":"M-III","frage":"Wird für die Bereitstellung der Daten eine Gegenleistung (Entgelt) verlangt oder gezahlt?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"III-04","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"III-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null}],"anzeigebedingung":{"roh":"erreicht über III-02","ausdruck":{"op":"unklar","art":"erreichbarkeit","text":"erreicht über III-02","referenzierte_fragen":["III-02"]},"vollstaendig":false,"klartext":["erreicht über III-02"],"sonst_ziel":null},"erklaertext":"Eine Gegenleistung ist erlaubt, muss aber angemessen und nicht diskriminierend sein und darf nur bestimmte Kosten plus ggf. eine Marge abdecken. Gegenüber dem Nutzer selbst ist die Bereitstellung immer kostenlos – das Entgelt kann nur vom empfangenden Dritten verlangt werden (EG 35). Die Berechnungsgrundlage muss offengelegt werden.","rechtsgrundlage":"Art. 9 Abs. 1–3, 7; Art. 5 Abs. 1; EG 46, 47, 51","gesetzte_variablen":[{"variable":"GEGENLEISTUNG","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"GEGENLEISTUNG (Ja / Nein)"}],"frage_begriffe":[{"start":32,"laenge":5,"begriff":"Daten"}],"erklaertext_begriffe":[{"start":159,"laenge":6,"begriff":"Nutzer"}]},{"id":"III-04","modul":"M-III","frage":"Ist der Datenempfänger ein KMU (eigenständig, ohne größere Konzernmutter) oder eine gemeinnützige Forschungseinrichtung?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein","unsicher":"Unsicher"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"III-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"Gegenleistung auf reine Bereitstellungskosten begrenzt, keine Marge, Art. 9 Abs. 4"},{"antwort":"Nein","bedingung":null,"ziel":"III-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"Gegenleistung darf Marge enthalten, Art. 9 Abs. 1–3"},{"antwort":"Unsicher","bedingung":null,"ziel":"III-05","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"hinweis":"Hinweis 'Einzelfallprüfung empfohlen – KMU-Status des Empfängers dokumentieren'"}],"anzeigebedingung":{"roh":"GEGENLEISTUNG = Ja","ausdruck":{"op":"=","variable":"GEGENLEISTUNG","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Beispiel: Eine 40-Personen-Werkstatt ohne Konzernbindung erhält Fahrzeugdaten – der Hersteller darf nur Formatierungs-, Übertragungs- und Speicherkosten in Rechnung stellen. Ist der Empfänger Tochter eines Großkonzerns, ist eine Marge zulässig. Was 'gemeinnützige Forschungseinrichtung' ist, definiert die Verordnung nicht.","rechtsgrundlage":"Art. 9 Abs. 4; EG 48, 49","gesetzte_variablen":[{"variable":"EMPFAENGER_KMU","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"EMPFAENGER_KMU (Ja / Nein / Unsicher)"}],"frage_begriffe":[{"start":8,"laenge":14,"begriff":"Datenempfänger"}]},{"id":"III-05","modul":"M-III","frage":"Setzen Sie technische Schutzmaßnahmen (z. B. Verschlüsselung, Zugriffskontrollen, Smart Contracts) ein, um unbefugte Nutzung bereitgestellter Daten zu verhindern?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"FRAND-Pflichten (Art. 8, 9) und Schranken für Schutzmaßnahmen (Art. 11 Abs. 1: keine Diskriminierung, keine Behinderung der Nutzerrechte) beachten","weiter_mit":null,"anschluss":"ende_modul"},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"FRAND-Pflichten (Art. 8, 9) beachten; Schutzmaßnahmen nach Art. 11 sind zulässig, aber nicht verpflichtend","weiter_mit":null,"anschluss":"ende_modul"}],"anzeigebedingung":{"roh":"erreicht über III-03 oder III-04","ausdruck":{"op":"unklar","art":"erreichbarkeit","text":"erreicht über III-03 oder III-04","referenzierte_fragen":["III-03","III-04"]},"vollstaendig":false,"klartext":["erreicht über III-03 oder III-04"],"sonst_ziel":null},"erklaertext":"Schutzmaßnahmen sind erlaubt, dürfen aber weder zwischen Datenempfängern diskriminieren noch den Nutzer daran hindern, seine Daten abzurufen oder weiterzugeben. Bei Missbrauch durch den Empfänger (falsche Angaben, Zweckverstoß, Weitergabe) können Löschung, Produktionsstopp und Schadensersatz verlangt werden (Art. 11 Abs. 2, 3).","rechtsgrundlage":"Art. 11; EG 57","gesetzte_variablen":[{"variable":"SCHUTZMASSNAHMEN","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"SCHUTZMASSNAHMEN (Ja / Nein)"}],"frage_begriffe":[{"start":142,"laenge":5,"begriff":"Daten"}],"erklaertext_begriffe":[{"start":57,"laenge":15,"begriff":"Datenempfänger"},{"start":97,"laenge":6,"begriff":"Nutzer"},{"start":125,"laenge":5,"begriff":"Daten"}]},{"id":"IV-01","modul":"M-IV","frage":"Schließen Sie mit anderen Unternehmen Verträge, die Regelungen zum Zugang zu Daten, zur Datennutzung oder zur Haftung bei datenbezogenen Pflichten enthalten (z. B. AGB, Plattformbedingungen, Lieferanten- oder Lizenzverträge)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"IV-02","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"ENDE-MODUL","ziel_typ":"ende_modul","ergebnistext":"Kapitel IV gilt nur für Verträge mit Klauseln über Datenzugang, Datennutzung oder Haftung. Solche Klauseln stehen häufig auch in gewöhnlichen IT-Dienstleistungs-, Wartungs- und Cloud-Verträgen - im Zweifel Vertragsinventur.","weiter_mit":null,"ergebnistext_ergaenzt":"gesetzt"},{"antwort":"Unsicher","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einzelfallprüfung empfohlen – Vertragsinventur nach Datenklauseln","weiter_mit":null,"anschluss":"ende_modul"}],"anzeigebedingung":{"roh":"— (Modul wird für alle Unternehmen durchlaufen)","ausdruck":null,"vollstaendig":true,"klartext":["Modul wird für alle Unternehmen durchlaufen"],"sonst_ziel":null},"erklaertext":"Erfasst sind nur die datenbezogenen Teile eines Vertrags, nicht der Vertrag insgesamt. Beispiele: Klauseln in Maschinenkaufverträgen über Nutzungsrechte an Betriebsdaten, Cloud-AGB zur Datennutzung, Datenlizenzverträge, Plattform-AGB. Verträge mit Verbrauchern fallen nicht unter Kapitel IV (dafür gilt das Verbraucherrecht).","rechtsgrundlage":"Art. 13 Abs. 1; Art. 1 Abs. 2 Buchst. c; EG 58, 60","gesetzte_variablen":[{"variable":"DATENVERTRAEGE","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"DATENVERTRAEGE (Ja / Nein)"}],"frage_begriffe":[{"start":26,"laenge":11,"begriff":"Unternehmen"},{"start":77,"laenge":5,"begriff":"Daten"}],"erklaertext_begriffe":[{"start":248,"laenge":12,"begriff":"Verbraucher"}]},{"id":"IV-02","modul":"M-IV","frage":"Werden diese Datenklauseln von einer Seite vorgegeben, ohne dass die andere Seite ihren Inhalt trotz Verhandlungsversuchs beeinflussen kann?","antwortoptionen":[{"schluessel":"A","text":"Wir geben die Klauseln vor","form":"buchstabe"},{"schluessel":"B","text":"Unser Vertragspartner gibt sie vor","form":"buchstabe"},{"schluessel":"C","text":"Beides kommt vor","form":"buchstabe"},{"schluessel":"D","text":"Nein, die Klauseln werden individuell ausgehandelt","form":"buchstabe"}],"antwort_aliase":{},"kanten":[{"antwort":"A","bedingung":null,"ziel":"IV-03","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"Sie tragen die Beweislast, dass Klauseln nicht einseitig auferlegt wurden; schwarze/graue Liste Art. 13 Abs. 4, 5 prüfen"},{"antwort":"B","bedingung":null,"ziel":"IV-03","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"missbräuchliche Klauseln sind für Sie nicht bindend"},{"antwort":"C","bedingung":null,"ziel":"IV-03","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"D","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Kapitel IV nicht anwendbar – ausgehandelte Klauseln unterliegen nicht der Missbrauchskontrolle","weiter_mit":null,"anschluss":"ende_modul"}],"anzeigebedingung":{"roh": bH, AG, eG, KG/OHG) und keine öffentliche Stelle?","antwortoptionen":[{"schluessel":"A","text":"Ja, juristische Person des Privatrechts","form":"buchstabe"},{"schluessel":"B","text":"Nein, Einzelunternehmen/natürliche Person","form":"buchstabe"},{"schluessel":"C","text":"Wir sind eine öffentliche Stelle","form":"buchstabe"},{"schluessel":"D","text":"Wir sind ein öffentliches Unternehmen (z. B. kommunale Stadtwerke GmbH)","form":"buchstabe"}],"antwort_aliase":{"ja":"A","nein":"B","öffentlich":"C","öffentliches unternehmen":"D"},"kanten":[{"antwort":"A","bedingung":null,"ziel":"V-02","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"B","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Art. 14 adressiert nur juristische Personen – Bereitstellungspflicht nach Kapitel V greift voraussichtlich nicht (Einzelfallprüfung bei Personengesellschaften empfohlen)","weiter_mit":null,"anschluss":"ende_modul"},{"antwort":"C","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Öffentliche Stellen sind keine Dateninhaber i. S. v. Kapitel V, können aber selbst Datenverlangen stellen. Als ersuchende Stelle treffen Sie eigene Pflichten aus Art. 17 (Form und Begründung des Verlangens), Art. 19 (Pflichten der empfangenden Stelle), Art. 21 (Weitergabe an Forschung) und Art. 22 (Amtshilfe). Dieses Werkzeug prüft diese Strecke nicht - Einzelfallprüfung erforderlich.","weiter_mit":null,"anschluss":"ende_modul","ergebnistext_begriffe":[{"start":0,"laenge":19,"begriff":"Einrichtungen der Union / öffentliche Stelle"},{"start":31,"laenge":12,"begriff":"Dateninhaber"}],"ergebnistext_ergaenzt":"angehängt"},{"antwort":"D","bedingung":null,"ziel":"V-02","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"hinweis":"Hinweis: öffentliche Unternehmen können Dateninhaber sein, EG 63","hinweis_begriffe":[{"start":21,"laenge":11,"begriff":"Unternehmen"},{"start":40,"laenge":12,"begriff":"Dateninhaber"}]}],"anzeigebedingung":{"roh":"— (Modu ge":"Art. 30 Abs. 1–5; Art. 2 Nr. 37; EG 86, 92","gesetzte_variablen":[{"variable":"CLOUD_MODELL","zuordnung":[{"antwort":"A","wert":"IaaS"},{"antwort":"B","wert":"PaaS-SaaS"},{"antwort":"Unsicher","wert":"Unsicher"}],"herleitung":"positionell (Reihenfolge der Antwortoptionen)","sicher":false,"roh":"CLOUD_MODELL (IaaS / PaaS-SaaS / Unsicher)"}],"erklaertext_begriffe":[{"start":78,"laenge":6,"begriff":"Kunde"},{"start":273,"laenge":20,"begriff":"Exportierbare Daten"}]},{"id":"VI-05","modul":"M-VI","frage":"Erheben Sie derzeit Entgelte für den Anbieterwechsel oder die Datenextraktion (Egress-Gebühren, Migrationsgebühren)?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"VI-06","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null,"ergebnis_baustein":"bis 12.01.2027 nur kostendeckende ermäßigte Wechselentgelte, danach Verbot [außer Individualdienste]; vorvertragliche Information über Entgelte; Extraktionsentgelte bei paralleler Nutzung dauerhaft zu Selbstkosten, Art. 34 Abs. 2","ergebnis_baustein_begriffe":[{"start":44,"laenge":15,"begriff":"Datenextraktionsentgelte / Wechselentgelte"}]},{"antwort":"Nein","bedingung":null,"ziel":"VI-06","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null}],"anzeigebedingung":{"roh":"erreicht über VI-04","ausdruck":{"op":"unklar","art":"erreichbarkeit","text":"erreicht über VI-04","referenzierte_fragen":["VI-04"]},"vollstaendig":false,"klartext":["erreicht über VI-04"],"sonst_ziel":null},"erklaertext":"Wechselentgelte sind alle Gebühren für die vom Data Act vorgeschriebenen Wechselhandlungen, einschließlich Datenextraktion. Keine Wechselentgelte sind: laufende Standarddienstentgelte bis Vertragsende, vereinbarte Sanktionen bei vorzeitiger Kündigung befristeter Verträge und vom Kunden zusätzlich bestellte Migrationsdienste, deren Preis er vorab akzeptiert hat (EG 89).","rechtsgrundlage":"Art. 29; Art. 34 Abs. 2; Art. 2 Nr. 35, 36; EG 88, 89, 99","gesetzte_variablen":[{"variable":"WECHSELENTGELTE","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"WECHSELENTGELTE (Ja / Nein)"}],"erklaertext_begriffe":[{"start":0,"laenge":15,"begriff":"Datenextraktionsentgelte / Wechselentgelte"},{"start":280,"laenge":6,"begriff":"Kunde"}]},{"id":"VI-06","modul":"M-VI","frage":"Speichern oder verarbeiten Sie im Rahmen des Dienstes nicht-personenbezogene Daten in der EU?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"VI-07","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Kapitel VII (Schutz vor Drittstaatszugriff) betrifft nur in der EU gespeicherte nicht-personenbezogene Daten; Transparenzpflicht zur Gerichtsbarkeit der Infrastruktur (Art. 28) gilt dennoch","weiter_mit":"VI-09","anschluss":"frage","ergebnistext_begriffe":[{"start":80,"laenge":28,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}]}],"anzeigebedingung":{"roh":"erreicht über VI-05 oder VI-02","ausdruck":{"op":"unklar","art":"erreichbarkeit","text":"erreicht über VI-05 oder VI-02","referenzierte_fragen":["VI-02","VI-05"]},"vollstaendig":false,"klartext":["erreicht über VI-05 oder VI-02"],"sonst_ziel":null},"erklaertext":"Kapitel VII verpflichtet Cloud-Anbieter, in der EU gespeicherte nicht-personenbezogene Daten (Unternehmensdaten, Maschinendaten) durch technische, organisatorische und vertragliche Maßnahmen vor unrechtmäßigem Zugriff ausländischer Behörden zu schützen. Für personenbezogene Daten gelten die DSGVO-Regeln zum Drittlandtransfer.","rechtsgrundlage":"Art. 32 Abs. 1; Art. 1 Abs. 2 Buchst. f; EG 101, 102","gesetzte_variablen":[{"variable":"DATEN_IN_EU","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"DATEN_IN_EU (Ja / Nein)"}],"frage_begriffe":[{"start":54,"laenge":28,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}],"erklaertext_begriffe":[{"start":64,"laenge":28,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":275,"laenge":5,"begriff":"Daten"}]},{"id":"VI-07","modul":"M-VI","frage":"Liegt Ihnen ein Herausgabe- oder Zugangsverlangen einer Behörde oder eines Gerichts aus einem Nicht-EU-Staat zu solchen Daten vor?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"VI-08","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Vorsorgepflichten: angemessene Schutzmaßnahmen (Art. 32 Abs. 1), Veröffentlichung von Gerichtsbarkeit und Schutzmaßnahmen auf der Website und Verweis im Vertrag (Art. 28)","weiter_mit":"VI-09","anschluss":"frage"}],"anzeigebedingung":{"roh":"DATEN_IN_EU = Ja","ausdruck":{"op":"=","variable":"DATEN_IN_EU","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Beispiele: Herausgabeanordnungen nach dem US CLOUD Act (externes Wissen), Auskunftsersuchen ausländischer Aufsichtsbehörden. Auch konzerninterne Anforderungen einer Nicht-EU-Muttergesellschaft, die ein behördliches Verlangen weiterleitet, fallen darunter.","rechtsgrundlage":"Art. 32 Abs. 2–5; EG 101","gesetzte_variablen":[{"variable":"DRITTSTAAT_VERLANGEN","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"DRITTSTAAT_VERLANGEN (Ja / Nein)"}],"frage_begriffe":[{"start":120,"laenge":5,"begriff":"Daten"}]},{"id":"VI-08","modul":"M-VI","frage":"Beruht das Verlangen auf einem internationalen Abkommen (z. B. Rechtshilfeabkommen) zwischen dem Drittstaat und der EU oder einem Mitgliedstaat?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Verlangen anerkennbar; nur Mindestmenge an Daten herausgeben und Kunden vorab informieren (außer bei Strafverfolgung, solange erforderlich) (Art. 32 Abs. 2, 4, 5)","weiter_mit":"VI-09","anschluss":"frage","ergebnistext_begriffe":[{"start":43,"laenge":5,"begriff":"Daten"},{"start":65,"laenge":6,"begriff":"Kunde"}]},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Herausgabe nur, wenn Drittstaatsrecht Begründung, Verhältnismäßigkeit, gerichtliche Überprüfung und Berücksichtigung Ihrer Interessen vorsieht; Stellungnahme der zuständigen nationalen Stelle einholen (Pflicht bei Sicherheits-/Verteidigungsbezug); nach 1 Monat ohne Antwort Ablehnung möglich; Mindestmenge; Kunde informieren (Art. 32 Abs. 3–5)","weiter_mit":"VI-09","anschluss":"frage","ergebnistext_begriffe":[{"start":307,"laenge":5,"begriff":"Kunde"}]},{"antwort":"Unsicher","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einzelfallprüfung empfohlen – Stellungnahme der zuständigen nationalen Stelle einholen (Art. 32 Abs. 3 UAbs. 2)","weiter_mit":"VI-09","anschluss":"frage"}],"anzeigebedingung":{"roh":"DRITTSTAAT_VERLANGEN = Ja","ausdruck":{"op":"=","variable":"DRITTSTAAT_VERLANGEN","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Ohne Abkommen dürfen Sie nur herausgeben, wenn das ausländische Verfahren rechtsstaatliche Mindestgarantien bietet; im Zweifel können Sie die zuständige nationale Stelle um eine Stellungnahme bitten. Betrifft das Verlangen möglicherweise die nationale Sicherheit oder Verteidigung, müssen Sie das tun. Leitlinien der Kommission hierzu stehen noch aus.","rechtsgrundlage":"Art. 32 Abs. 2–5; EG 101","gesetzte_variablen":[]},{"id":"VI-09","modul":"M-VI","frage":"Nutzen Sie Cloud- oder SaaS-Dienste anderer Anbieter und planen Sie einen Anbieterwechsel, eine Rückverlagerung ins eigene Rechenzentrum oder die parallele Nutzung mehrerer Anbieter?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"VI-10","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Kundenrechte kennen: schriftlicher Vertrag mit Wechselklauseln, max. 2 Monate Kündigungsfrist, 30-Tage-Übergang, 30-Tage-Abruf, Löschung; Streitbeilegung nach Art. 10 Abs. 4","weiter_mit":null,"anschluss":"ende_modul"}],"anzeigebedingung":{"roh":"ROLLE_CLOUD_KUNDE = Ja (sonst direkt ENDE-MODUL)","ausdruck":{"op":"=","variable":"ROLLE_CLOUD_KUNDE","wert":"Ja"},"vollstaendig":true,"klartext":["sonst direkt ENDE-MODUL"],"sonst_ziel":"ENDE-MODUL"},"erklaertext":"Als Kunde profitieren Sie von den Wechselregeln unabhängig von Ihrer Größe – auch bei kostenlosen Angeboten. Ihr Anbieter muss Ihnen vor Vertragsschluss die Wechselbedingungen, exportierbaren Datenkategorien und Entgelte offenlegen und Sie beim Ausstieg unterstützen. Sie selbst sind zur Zusammenarbeit nach Treu und Glauben verpflichtet (Art. 27). Hinweis: Bei Testversionen und Individualdiensten (Art. 31) gelten Teile dieser Rechte nicht – der Anbieter muss Sie vorab darüber informiert haben.","rechtsgrundlage":"Art. 23; Art. 25; Art. 26; Art. 27; Art. 10 Abs. 4; EG 78, 85","gesetzte_variablen":[{"variable":"WECHSEL_GEPLANT","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwort":"Nein","wert":"Nein"}],"herleitung":"Wert und Antwortoption namensgleich","sicher":true,"roh":"WECHSEL_GEPLANT (Ja / Nein)"}],"erklaertext_begriffe":[{"start":4,"laenge":5,"begriff":"Kunde"}]},{"id":"VI-10","modul":"M-VI","frage":"Handelt es sich um einen vollständigen Wechsel (Kündigung des bisherigen Dienstes) oder um eine parallele Nutzung mehrerer Anbieter (Multi-Cloud)?","antwortoptionen":[{"schluessel":"A","text":"Wechsel","form":"buchstabe"},{"schluessel":"B","text":"Parallele Nutzung","form":"buchstabe"},{"schluessel":"C","text":"Beides","form":"buchstabe"}],"antwort_aliase":{},"kanten":[{"antwort":"A","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Wechselrechte nach Art. 23–26, 30: Übergang max. 30 Tage (verlängerbar, einmal durch Sie), Export aller exportierbaren Daten und digitalen Vermögenswerte, Wechselentgelte bis 12.01.2027 nur kostendeckend, danach keine","weiter_mit":null,"anschluss":"ende_modul","ergebnistext_begriffe":[{"start":104,"laenge":20,"begriff":"Exportierbare Daten"},{"start":129,"laenge":24,"begriff":"Digitale Vermögenswerte"},{"start":155,"laenge":15,"begriff":"Datenextraktionsentgelte / Wechselentgelte"}]},{"antwort":"B","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Interoperabilitätsrechte nach Art. 34: offene Schnittstellen, Export in maschinenlesbarem Format; Extraktionsentgelte nur zu Selbstkosten – auch nach 2027","weiter_mit":null,"anschluss":"ende_modul"},{"antwort":"C","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Beide Rechtekataloge (Art. 23–30 und Art. 34) anwendbar","weiter_mit":null,"anschluss":"ende_modul"}],"anzeigebedingung":{"roh":"WECHSEL_GEPLANT = Ja","ausdruck":{"op":"=","variable":"WECHSEL_GEPLANT","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Beim Wechsel muss der alte Anbieter Ihre Daten extrahieren und maschinenlesbar bereitstellen; das Hochladen beim neuen Anbieter obliegt Ihnen bzw. dem neuen Anbieter (EG 85). Bei Multi-Cloud darf der Anbieter weiterhin die tatsächlichen Extraktionskosten weitergeben. Bei Individualdiensten und Testversionen gelten Einschränkungen (Art. 31).","rechtsgrundlage":"Art. 23–26; Art. 29; Art. 30; Art. 34; EG 85, 99","gesetzte_variablen":[],"frage_begriffe":[{"start":39,"laenge":7,"begriff":"Wechsel"}],"erklaertext_begriffe":[{"start":5,"laenge":7,"begriff":"Wechsel"},{"start":41,"laenge":5,"begriff":"Daten"}]},{"id":"VIII-01","modul":"M-VIII","frage":"Stellen Sie anderen Teilnehmern eines gemeinsamen Datenraums (z. B. branchenspezifisches Datenökosystem) Daten oder Datendienste bereit?","antwortoptionen":[{"schluessel":"Ja","text":"Ja","form":"klartext"},{"schluessel":"Nein","text":"Nein","form":"klartext"},{"schluessel":"Unsicher","text":"Unsicher","form":"klartext"}],"antwort_aliase":{"ja":"Ja","nein":"Nein","unsicher":"Unsicher"},"kanten":[{"antwort":"Ja","bedingung":null,"ziel":"VIII-02","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Nein","bedingung":null,"ziel":"VIII-03","ziel_typ":"frage","ergebnistext":null,"weiter_mit":null},{"antwort":"Unsicher","bedingung":null,"ziel":"ERGEBNIS","ziel_typ":"ergebnis","ergebnistext":"Einzelfallprüfung empfohlen – Einstufung als Datenraum-Teilnehmer; Begriff ist nicht legaldefiniert","weiter_mit":"VIII-03","anschluss":"frage"}],"anzeigebedingung":{"roh":"ROLLE_DATENRAUM = Ja","ausdruck":{"op":"=","variable":"ROLLE_DATENRAUM","wert":"Ja"},"vollstaendig":true,"klartext":[],"sonst_ziel":null},"erklaertext":"Datenräume sind sektorspezifische oder sektorübergreifende Rahmen mit gemeinsamen Normen für die Datenweitergabe (Beispiele aus der Praxis: Catena-X, Mobility Data Space – externes Wissen). Wer dort nur Daten bezieht, ist nicht Adressat. Die Pflichten betreffen nur Elemente, die Sie selbst kontrollieren (EG 103).","rechtsgrundlage":"Art. 33 Abs. 1; EG 103","gesetzte_variablen":[{"variable":"DATENRAUM_ANBIETER","zuordnung":[{"antwort":"Ja","wert":"Ja"},{"antwor
