ten hat, (b) ein ähnliches Verlangen zum selben Zweck bereits von einer anderen Stelle gestellt wurde und keine Löschmitteilung erfolgte, (c) das Verlangen die Anforderungen des Art. 17 Abs. 1 und 2 nicht erfüllt.","fundstelle":"Art. 18 Abs. 2 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Fristenkontrolle: 5 bzw. 30 Arbeitstage nach Eingang. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":209,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-V-013","kurztitel":"Art. 18 Abs. 3 – Informationspflicht (Dateninhaber)","beschreibung":"Bei Ablehnung/Änderungsantrag wegen eines früheren gleichartigen Verlangens (Abs. 2 Buchst. b) benennt der Dateninhaber die Stelle, die zuvor zum selben Zweck Daten verlangt hatte.","fundstelle":"Art. 18 Abs. 3 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Informationstext erstellen und im richtigen Kanal bereitstellen.","beschreibung_begriffe":[{"start":107,"laenge":12,"begriff":"Dateninhaber"},{"start":159,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-V-014","kurztitel":"Anonymisieren/Pseudonymisieren","beschreibung":"Enthalten die Daten personenbezogene Daten, anonymisiert der Dateninhaber sie; ist die Offenlegung personenbezogener Daten zur Erfüllung des Verlangens erforderlich, pseudonymisiert er sie.","fundstelle":"Art. 18 Abs. 4 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Anonymisierungsverfahren bereithalten.","beschreibung_begriffe":[{"start":14,"laenge":5,"begriff":"Daten"},{"start":20,"laenge":22,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":61,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-V-015","kurztitel":"Art. 18 Abs. 5 – Recht (Dateninhaber)","beschreibung":"Bei beabsichtigtem Widerspruch der Stelle gegen eine Ablehnung oder Einspruch des Dateninhabers, der nicht durch Änderung des Verlangens beigelegt werden kann, wird die zuständige Behörde des Niederlassungsmitgliedstaats des Dateninhabers befasst.","fundstelle":"Art. 18 Abs. 5 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen.","beschreibung_begriffe":[{"start":82,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-V-016","kurztitel":"Art. 19 Abs. 1 – Handlungspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Die empfangende Stelle darf die Daten nicht zweckwidrig nutzen, muss technische und organisatorische Maßnahmen für Vertraulichkeit, Integrität und Übermittlungssicherheit getroffen haben und muss die Daten löschen, sobald sie nicht mehr erforderlich sind, mit unverzüglicher Löschmitteilung an den Dateninhaber und Empfänger nach Art. 21 Abs. 1.","fundstelle":"Art. 19 Abs. 1 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":32,"laenge":5,"begriff":"Daten"},{"start":298,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-V-017","kurztitel":"Art. 19 Abs. 2 – Unterlassungspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Empfänger dürfen die Daten oder daraus gewonnene Erkenntnisse über den Dateninhaber nicht zur Entwicklung/Verbesserung konkurrierender vernetzter Produkte oder verbundener Dienste nutzen oder dafür weitergeben.","fundstelle":"Art. 19 Abs. 2 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":21,"laenge":5,"begriff":"Daten"},{"start":71,"laenge":12,"begriff":"Dateninhaber"},{"start":135,"laenge":19,"begriff":"Vernetztes Produkt"},{"start":160,"laenge":19,"begriff":"Verbundener Dienst"}]},{"req_id":"DA-V-018","kurztitel":"Geschäftsgeheimnisse gegenüber Behörden","beschreibung":"Geschäftsgeheimnisse werden nur offengelegt, soweit für den Zweck des Verlangens unerlässlich; der Dateninhaber/Geschäftsgeheimnisinhaber identifiziert die geschützten Daten inkl. Metadaten; die Stelle trifft vor Offenlegung alle erforderlichen Schutzmaßnahmen (Mustervertragsbestimmungen, Normen, Verhaltenskodizes).","fundstelle":"Art. 19 Abs. 3 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Geheimnisse kennzeichnen; Vertraulichkeitszusage einholen.","beschreibung_begriffe":[{"start":99,"laenge":12,"begriff":"Dateninhaber"},{"start":168,"laenge":5,"begriff":"Daten"},{"start":180,"laenge":9,"begriff":"Metadaten"}]},{"req_id":"DA-V-019","kurztitel":"Art. 19 Abs. 4 – Handlungspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Die empfangende Stelle ist für die Sicherheit der erhaltenen Daten verantwortlich.","fundstelle":"Art. 19 Abs. 4 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":61,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-V-020","kurztitel":"Unentgeltlichkeit bei Notstand","beschreibung":"Daten zur Bewältigung eines öffentlichen Notstands sind unentgeltlich bereitzustellen; die empfangende Stelle erkennt den Beitrag des Dateninhabers auf dessen Ersuchen öffentlich an.","fundstelle":"Art. 20 Abs. 1 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Auf Wunsch öffentliche Anerkennung verlangen.","beschreibung_begriffe":[{"start":0,"laenge":5,"begriff":"Daten"},{"start":28,"laenge":22,"begriff":"Öffentlicher Notstand"},{"start":134,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-V-021","kurztitel":"Anspruch auf faire Gegenleistung","beschreibung":"Für Bereitstellungen nach Art. 15 Abs. 1 Buchst. b hat der Dateninhaber Anspruch auf faire Gegenleistung, die mindestens die technischen und organisatorischen Kosten (inkl. Anonymisierung, Pseudonymisierung, Aggregation, technische Anpassung) und eine angemessene Marge deckt; auf Verlangen der Stelle sind Kostengrundlage und Marge zu erläutern.","fundstelle":"Art. 20 Abs. 2 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Kosten (inkl. Anonymisierung) und Marge kalkulieren und belegen.","beschreibung_begriffe":[{"start":59,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-V-022","kurztitel":"Gegenleistung für Kleinst-/Kleinunternehmen auch bei Notstand","beschreibung":"Kleinst- und Kleinunternehmen können auch bei Notstandsverlangen eine Gegenleistung nach Abs. 2 beanspruchen.","fundstelle":"Art. 20 Abs. 3 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Kostenkalkulation vorbereiten.","beschreibung_begriffe":[{"start":13,"laenge":16,"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)"}]},{"req_id":"DA-V-023","kurztitel":"Art. 21 Abs. 1–5 – Handlungspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Empfangende Stellen dürfen die Daten an gemeinnützige/im öffentlichen Interesse handelnde Forschungseinrichtungen oder an statistische Ämter/Eurostat weitergeben; diese unterliegen denselben Pflichten (Art. 17 Abs. 3, Art. 19) und dürfen die Daten bis zu 6 Monate nach Löschung durch die Stelle aufbewahren; der Dateninhaber ist vorab unverzüglich mit Identität, Zweck, Zeitraum und Schutzmaßnahmen zu unterrichten und kann bei der zuständigen Behörde Beschwerde einlegen.","fundstelle":"Art. 21 Abs. 1–5 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":31,"laenge":5,"begriff":"Daten"},{"start":312,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-V-024","kurztitel":"Art. 22 Abs. 3, 4 – Handlungspflicht (Öffentliche Stellen, Kommission, EZB, Ei)","beschreibung":"Bei Verlangen an einen Dateninhaber in einem anderen Mitgliedstaat ist zunächst die dortige zuständige Behörde zu unterrichten, die das Verlangen anhand von Art. 17 prüft und es entweder an den Dateninhaber übermittelt oder begründet ablehnt; die anfragende Stelle berücksichtigt deren Hinweise vor erneuter Einreichung.","fundstelle":"Art. 22 Abs. 3, 4 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":23,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-VI-001","kurztitel":"Wechsel ermöglichen","beschreibung":"Der Anbieter trifft die Maßnahmen nach Art. 25, 26, 27, 29 und 30, um Kunden den Wechsel zu einem Dienst gleicher Dienstart eines anderen Anbieters, zu IKT-Infrastruktur in eigenen Räumlichkeiten oder die parallele Nutzung mehrerer Anbieter zu ermöglichen.","fundstelle":"Art. 23 Satz 1 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Exit-Prozess und Verantwortlichkeiten für Wechsel definieren.","beschreibung_begriffe":[{"start":70,"laenge":6,"begriff":"Kunde"},{"start":81,"laenge":7,"begriff":"Wechsel"},{"start":105,"laenge":18,"begriff":"Gleiche Dienstart"},{"start":152,"laenge":43,"begriff":"IKT-Infrastruktur in eigenen Räumlichkeiten"}],"naechste_schritte_begriffe":[{"start":42,"laenge":7,"begriff":"Wechsel"}]},{"req_id":"DA-VI-002","kurztitel":"Keine Wechselhindernisse","beschreibung":"Der Anbieter darf keine vorkommerziellen, gewerblichen, technischen, vertraglichen oder organisatorischen Hindernisse aufzwingen und muss bestehende beseitigen, soweit sie Kunden hindern: (a) den Vertrag nach maximaler Kündigungsfrist und erfolgreichem Wechsel zu kündigen, (b) neue Verträge mit anderen Anbietern zu schließen, (c) exportierbare Daten und digitale Vermögenswerte zu übertragen (auch nach unentgeltlichem Angebot), (d) Funktionsäquivalenz nach Art. 24 zu erreichen, (e) Dienste nach Art. 30 Abs. 1 (IaaS) von anderen Diensten des Anbieters zu trennen, soweit technisch durchführbar.","fundstelle":"Art. 23 Satz 2 Buchst. a–e (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Vertrags-, Preis- und Technikhindernisse inventarisieren und abbauen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":172,"laenge":6,"begriff":"Kunde"},{"start":253,"laenge":7,"begriff":"Wechsel"},{"start":332,"laenge":19,"begriff":"Exportierbare Daten"},{"start":356,"laenge":23,"begriff":"Digitale Vermögenswerte"},{"start":435,"laenge":19,"begriff":"Funktionsäquivalenz"}]},{"req_id":"DA-VI-003","kurztitel":"Art. 24 – Ausnahme (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Die Verantwortung nach Art. 23, 25, 29, 30 und 34 beschränkt sich auf Dienste, Verträge oder Geschäftsgepflogenheiten, die vom ursprünglichen Anbieter angeboten wurden.","fundstelle":"Art. 24 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-VI-004","kurztitel":"Schriftlicher Vertrag mit Wechselklauseln","beschreibung":"Kundenrechte und Anbieterpflichten zum Wechsel sind eindeutig in einem schriftlichen Vertrag festzulegen; der Vertrag ist dem Kunden vor Unterzeichnung so bereitzustellen, dass er ihn speichern und reproduzieren kann.","fundstelle":"Art. 25 Abs. 1 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Vertragsvorlage überarbeiten; speicherbare Fassung vor Unterzeichnung bereitstellen.","beschreibung_begriffe":[{"start":39,"laenge":7,"begriff":"Wechsel"},{"start":126,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VI-005","kurztitel":"30-Tage-Übergang mit Unterstützung","beschreibung":"Der Vertrag muss Klauseln enthalten, die dem Kunden auf Verlangen den Wechsel zu einem anderen Anbieter oder die Übertragung aller exportierbaren Daten und digitalen Vermögenswerte auf eigene IKT-Infrastruktur unverzüglich, spätestens nach Ablauf einer verbindlichen Übergangsfrist von max. 30 Kalendertagen ab Ende der maximalen Kündigungsfrist ermöglichen; in dieser Frist leistet der Anbieter (i) angemessene Unterstützung, (ii) handelt mit gebotener Sorgfalt zur Aufrechterhaltung der Geschäftskontinuität, (iii) unterrichtet über bekannte Risiken für die unterbrechungsfreie Erbringung, (iv) sorgt für hohes Sicherheitsniveau während Übertragung und Abrufzeitraum.","fundstelle":"Art. 25 Abs. 2 Buchst. a (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Übergangsprozess mit Support, Risikoinformation und Sicherheitsniveau festlegen.","beschreibung_begriffe":[{"start":45,"laenge":6,"begriff":"Kunde"},{"start":70,"laenge":7,"begriff":"Wechsel"},{"start":131,"laenge":20,"begriff":"Exportierbare Daten"},{"start":156,"laenge":24,"begriff":"Digitale Vermögenswerte"}]},{"req_id":"DA-VI-006","kurztitel":"Art. 25 Abs. 2 Buchst. b – Handlungspflicht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Der Vertrag muss die Verpflichtung des Anbieters enthalten, die Ausstiegsstrategie des Kunden für die vertraglich vereinbarten Dienste zu unterstützen, u. a. durch Bereitstellung aller einschlägigen Informationen.","fundstelle":"Art. 25 Abs. 2 Buchst. b (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":87,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VI-007","kurztitel":"Art. 25 Abs. 2 Buchst. c – Handlungspflicht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Der Vertrag muss eine Klausel enthalten, wonach der Vertrag als beendet gilt und der Kunde über die Kündigung unterrichtet wird (i) nach erfolgreichem Wechsel bzw. (ii) nach Ablauf der maximalen Kündigungsfrist, wenn der Kunde nicht wechseln, sondern seine Daten und Vermögenswerte löschen will.","fundstelle":"Art. 25 Abs. 2 Buchst. c (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":85,"laenge":5,"begriff":"Kunde"},{"start":151,"laenge":7,"begriff":"Wechsel"},{"start":257,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-VI-008","kurztitel":"Maximale Kündigungsfrist 2 Monate","beschreibung":"Der Vertrag muss eine maximale Kündigungsfrist für die Einleitung des Wechsels enthalten, die zwei Monate nicht überschreiten darf.","fundstelle":"Art. 25 Abs. 2 Buchst. d (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Kündigungsfristen in Verträgen anpassen.","beschreibung_begriffe":[{"start":70,"laenge":8,"begriff":"Wechsel"}]},{"req_id":"DA-VI-009","kurztitel":"Liste exportierbarer Datenkategorien","beschreibung":"Der Vertrag muss eine erschöpfende Auflistung aller Kategorien von Daten und digitalen Vermögenswerten enthalten, die beim Wechsel übertragen werden können – mindestens alle exportierbaren Daten.","fundstelle":"Art. 25 Abs. 2 Buchst. e (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Datenkatalog erstellen.","beschreibung_begriffe":[{"start":67,"laenge":5,"begriff":"Daten"},{"start":77,"laenge":25,"begriff":"Digitale Vermögenswerte"},{"start":123,"laenge":7,"begriff":"Wechsel"},{"start":174,"laenge":20,"begriff":"Exportierbare Daten"}]},{"req_id":"DA-VI-010","kurztitel":"Liste ausgenommener interner Daten","beschreibung":"Der Vertrag muss eine erschöpfende Liste der Datenkategorien enthalten, die für die interne Funktionsweise des Dienstes spezifisch sind und wegen Geschäftsgeheimnisgefahr von den exportierbaren Daten ausgenommen werden – die Ausnahmen dürfen den Wechsel nach Art. 23 Buchst. c nicht behindern oder verzögern.","fundstelle":"Art. 25 Abs. 2 Buchst. f (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Restriktiv definieren; Wechsel darf nicht behindert werden. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":179,"laenge":20,"begriff":"Exportierbare Daten"},{"start":246,"laenge":7,"begriff":"Wechsel"}],"naechste_schritte_begriffe":[{"start":23,"laenge":7,"begriff":"Wechsel"}]},{"req_id":"DA-VI-011","kurztitel":"Abrufzeitraum mindestens 30 Tage","beschreibung":"Der Vertrag muss eine Mindestfrist für den Datenabruf von mindestens 30 Kalendertagen ab Ende des Übergangszeitraums vorsehen.","fundstelle":"Art. 25 Abs. 2 Buchst. g (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Vertrags- und Löschprozess anpassen."},{"req_id":"DA-VI-012","kurztitel":"Löschung nach Abruf","beschreibung":"Der Vertrag muss garantieren, dass alle exportierbaren Daten und digitalen Vermögenswerte, die vom Kunden generiert werden oder sich direkt auf ihn beziehen, nach Ablauf des Abrufzeitraums (oder eines vereinbarten späteren Zeitpunkts) vollständig gelöscht werden, sofern der Wechsel erfolgreich vollzogen ist.","fundstelle":"Art. 25 Abs. 2 Buchst. h (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Löschgarantie und Nachweis implementieren.","beschreibung_begriffe":[{"start":40,"laenge":20,"begriff":"Exportierbare Daten"},{"start":65,"laenge":24,"begriff":"Digitale Vermögenswerte"},{"start":99,"laenge":6,"begriff":"Kunde"},{"start":275,"laenge":7,"begriff":"Wechsel"}]},{"req_id":"DA-VI-013","kurztitel":"Art. 25 Abs. 2 Buchst. i – Informationspflicht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Der Vertrag muss die nach Art. 29 zulässigen Wechselentgelte ausweisen.","fundstelle":"Art. 25 Abs. 2 Buchst. i (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Informationstext erstellen und im richtigen Kanal bereitstellen.","beschreibung_begriffe":[{"start":45,"laenge":15,"begriff":"Datenextraktionsentgelte / Wechselentgelte"}]},{"req_id":"DA-VI-014","kurztitel":"Art. 25 Abs. 3 – Handlungspflicht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Der Vertrag muss Klauseln enthalten, wonach der Kunde nach Ablauf der maximalen Kündigungsfrist seine Entscheidung mitteilen kann: (a) Wechsel zu anderem Anbieter (mit dessen Angaben), (b) Wechsel zu eigener IKT-Infrastruktur, (c) Löschung seiner exportierbaren Daten und digitalen Vermögenswerte.","fundstelle":"Art. 25 Abs. 3 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":48,"laenge":5,"begriff":"Kunde"},{"start":135,"laenge":7,"begriff":"Wechsel"},{"start":247,"laenge":20,"begriff":"Exportierbare Daten"},{"start":272,"laenge":24,"begriff":"Digitale Vermögenswerte"}]},{"req_id":"DA-VI-015","kurztitel":"Verlängerter Übergang nur begründet","beschreibung":"Ist die 30-Tage-Übergangsfrist technisch nicht durchführbar, teilt der Anbieter dies dem Kunden binnen 14 Arbeitstagen nach Wechselantrag mit, begründet die Undurchführbarkeit ordnungsgemäß und nennt einen alternativen Übergangszeitraum von höchstens sieben Monaten; Dienstkontinuität ist auch dann sicherzustellen.","fundstelle":"Art. 25 Abs. 4 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Prozess für 14-Tage-Mitteilung und Begründung.","beschreibung_begriffe":[{"start":89,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VI-016","kurztitel":"Art. 25 Abs. 5 – Recht (Anbieter von Datenverarbeitungsdiensten )","beschreibung":"Der Vertrag muss dem Kunden das Recht einräumen, den Übergangszeitraum einmal um einen von ihm als angemessener erachteten Zeitraum zu verlängern.","fundstelle":"Art. 25 Abs. 5 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen.","beschreibung_begriffe":[{"start":21,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VI-017","kurztitel":"Information über Wechselverfahren","beschreibung":"Der Anbieter stellt dem Kunden Informationen über verfügbare Wechsel- und Übertragungsverfahren bereit, einschließlich Methoden, Formate, Einschränkungen und bekannter technischer Beschränkungen.","fundstelle":"Art. 26 Buchst. a (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Wechseldokumentation (Formate, Methoden, Beschränkungen) veröffentlichen.","beschreibung_begriffe":[{"start":24,"laenge":6,"begriff":"Kunde"},{"start":61,"laenge":7,"begriff":"Wechsel"}]},{"req_id":"DA-VI-018","kurztitel":"Online-Register der Datenstrukturen","beschreibung":"Der Anbieter stellt einen Verweis auf ein aktuelles Online-Register bereit mit Einzelheiten zu Datenstrukturen, Datenformaten, einschlägigen Normen und offenen Interoperabilitätsspezifikationen, in denen die exportierbaren Daten verfügbar sind.","fundstelle":"Art. 26 Buchst. b (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Register anlegen und aktuell halten.","beschreibung_begriffe":[{"start":152,"laenge":41,"begriff":"Offene Interoperabilitätsspezifikationen / gemeinsame Spezifikationen / harmonisierte Norm"},{"start":208,"laenge":20,"begriff":"Exportierbare Daten"}]},{"req_id":"DA-VI-019","kurztitel":"Zusammenarbeit nach Treu und Glauben","beschreibung":"Alle Beteiligten arbeiten nach Treu und Glauben zusammen, damit der Wechsel effektiv vollzogen wird, Daten rechtzeitig übertragen werden und die Dienstkontinuität gewahrt bleibt.","fundstelle":"Art. 27 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Kooperationspflichten in Wechselprozess aufnehmen.","beschreibung_begriffe":[{"start":68,"laenge":7,"begriff":"Wechsel"},{"start":101,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-VI-020","kurztitel":"Website-Transparenz zu Gerichtsbarkeit und Schutzmaßnahmen","beschreibung":"Der Anbieter stellt auf seiner Website aktuell bereit: (a) die Gerichtsbarkeit, der die IKT-Infrastruktur der einzelnen Dienste unterliegt, (b) eine allgemeine Beschreibung der technischen, organisatorischen und vertraglichen Maßnahmen gegen unrechtmäßigen internationalen staatlichen Zugang zu/Übermittlung von in der Union gespeicherten nicht-personenbezogenen Daten.","fundstelle":"Art. 28 Abs. 1 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Website-Abschnitt erstellen und pflegen.","beschreibung_begriffe":[{"start":339,"laenge":29,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}]},{"req_id":"DA-VI-021","kurztitel":"Verweis im Vertrag","beschreibung":"Die Websites nach Abs. 1 sind in den Verträgen für alle angebotenen Datenverarbeitungsdienste aufzuführen.","fundstelle":"Art. 28 Abs. 2 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Vertragsvorlagen ergänzen.","beschreibung_begriffe":[{"start":68,"laenge":25,"begriff":"Datenverarbeitungsdienst"}]},{"req_id":"DA-VI-022","kurztitel":"Verbot von Wechselentgelten ab 12.01.2027","beschreibung":"Ab dem 12. Januar 2027 dürfen für den Vollzug des Anbieterwechsels keine Wechselentgelte mehr erhoben werden.","fundstelle":"Art. 29 Abs. 1 (Kapitel VI)","ab_wann":"12.01.2027 (Art. 29 Abs. 1)","naechste_schritte":"Preislisten anpassen; Egress-Gebühren für Wechsel abschaffen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":73,"laenge":15,"begriff":"Datenextraktionsentgelte / Wechselentgelte"}],"naechste_schritte_begriffe":[{"start":42,"laenge":7,"begriff":"Wechsel"}]},{"req_id":"DA-VI-023","kurztitel":"Nur kostendeckende Wechselentgelte bis 12.01.2027","beschreibung":"Vom 11. Januar 2024 bis 12. Januar 2027 dürfen nur ermäßigte Wechselentgelte erhoben werden, die die unmittelbar mit dem Wechsel verbundenen Kosten nicht übersteigen.","fundstelle":"Art. 29 Abs. 2, 3 (Kapitel VI)","ab_wann":"11.01.2024 – 12.01.2027 (Art. 29 Abs. 2) – Hinweis: Datum liegt vor dem allgemeinen Geltungsbeginn 12.09.2025 (Art. 50)","naechste_schritte":"Kostennachweis für Entgelte führen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":61,"laenge":15,"begriff":"Datenextraktionsentgelte / Wechselentgelte"},{"start":121,"laenge":7,"begriff":"Wechsel"}]},{"req_id":"DA-VI-024","kurztitel":"Vorvertragliche Entgeltinformation","beschreibung":"Vor Vertragsschluss ist der potenzielle Kunde eindeutig über Standarddienstentgelte, Sanktionen bei vorzeitiger Kündigung und die im Übergangszeitraum möglichen ermäßigten Wechselentgelte zu unterrichten.","fundstelle":"Art. 29 Abs. 4 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Entgelte und Sanktionen im Angebotsprozess ausweisen.","beschreibung_begriffe":[{"start":40,"laenge":5,"begriff":"Kunde"},{"start":172,"laenge":15,"begriff":"Datenextraktionsentgelte / Wechselentgelte"}]},{"req_id":"DA-VI-025","kurztitel":"Art. 29 Abs. 5 – Informationspflicht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Der Anbieter informiert Kunden gegebenenfalls über Dienste, bei denen der Wechsel sehr kompliziert, kostspielig oder ohne nennenswerte Eingriffe in Daten, digitale Vermögenswerte oder Dienstarchitektur unmöglich ist.","fundstelle":"Art. 29 Abs. 5 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Informationstext erstellen und im richtigen Kanal bereitstellen.","beschreibung_begriffe":[{"start":24,"laenge":6,"begriff":"Kunde"},{"start":74,"laenge":7,"begriff":"Wechsel"},{"start":148,"laenge":5,"begriff":"Daten"},{"start":155,"laenge":23,"begriff":"Digitale Vermögenswerte"}]},{"req_id":"DA-VI-026","kurztitel":"Art. 29 Abs. 6 – Informationspflicht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Die Informationen nach Abs. 4 und 5 sind gegebenenfalls in einem gesonderten Website-Abschnitt oder anderweitig leicht zugänglich zu veröffentlichen.","fundstelle":"Art. 29 Abs. 6 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Informationstext erstellen und im richtigen Kanal bereitstellen."},{"req_id":"DA-VI-027","kurztitel":"Funktionsäquivalenz (IaaS)","beschreibung":"Anbieter von auf Infrastrukturelemente (Server, Netze, virtuelle Ressourcen) beschränkten Diensten ohne Zugang zu darauf betriebener Software/Anwendungen ergreifen alle angemessenen Maßnahmen, damit der Kunde nach Wechsel zu einem Dienst gleicher Art Funktionsäquivalenz erreicht; sie stellen Kapazitäten, Informationen, Dokumentation, technische Unterstützung und ggf. Instrumente bereit.","fundstelle":"Art. 30 Abs. 1 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Migrations-Dokumentation, Tools und Support bereitstellen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":203,"laenge":5,"begriff":"Kunde"},{"start":214,"laenge":7,"begriff":"Wechsel"},{"start":251,"laenge":19,"begriff":"Funktionsäquivalenz"}]},{"req_id":"DA-VI-028","kurztitel":"Offene Schnittstellen (PaaS/SaaS)","beschreibung":"Andere Anbieter (PaaS/SaaS etc.) stellen allen Kunden und übernehmenden Anbietern unentgeltlich offene Schnittstellen bereit, die ausreichende Informationen enthalten, um Software für Datenübertragbarkeit und Interoperabilität entwickeln zu können.","fundstelle":"Art. 30 Abs. 2 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Export-/Interop-APIs kostenlos bereitstellen und dokumentieren.","beschreibung_begriffe":[{"start":47,"laenge":6,"begriff":"Kunde"},{"start":209,"laenge":17,"begriff":"Interoperabilität"}]},{"req_id":"DA-VI-029","kurztitel":"Kompatibilität mit künftigen Normen","beschreibung":"Anbieter gewährleisten Kompatibilität mit gemeinsamen Spezifikationen bzw. harmonisierten Interoperabilitätsnormen spätestens 12 Monate nach deren Veröffentlichung in der zentralen Unionsdatenbank nach Art. 35 Abs. 8.","fundstelle":"Art. 30 Abs. 3 (Kapitel VI)","ab_wann":"12 Monate nach Veröffentlichung in der zentralen Datenbank (Art. 30 Abs. 3) – noch offen","naechste_schritte":"Normungsprozess beobachten; 12-Monats-Umsetzung einplanen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":42,"laenge":27,"begriff":"Offene Interoperabilitätsspezifikationen / gemeinsame Spezifikationen / harmonisierte Norm"}]},{"req_id":"DA-VI-030","kurztitel":"Art. 30 Abs. 4 – Informationspflicht (Anbieter von Datenverarbeitungsdiensten )","beschreibung":"Das Online-Register nach Art. 26 Buchst. b ist entsprechend den Pflichten nach Abs. 3 zu aktualisieren.","fundstelle":"Art. 30 Abs. 4 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Informationstext erstellen und im richtigen Kanal bereitstellen."},{"req_id":"DA-VI-031","kurztitel":"Export in maschinenlesbarem Format","beschreibung":"Fehlen für die Dienstart gemeinsame Spezifikationen oder harmonisierte Normen in der zentralen Datenbank, exportiert der Anbieter auf Verlangen des Kunden alle exportierbaren Daten in einem strukturierten, gängigen und maschinenlesbaren Format.","fundstelle":"Art. 30 Abs. 5 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Exportfunktion für alle exportierbaren Daten bereitstellen.","beschreibung_begriffe":[{"start":25,"laenge":26,"begriff":"Offene Interoperabilitätsspezifikationen / gemeinsame Spezifikationen / harmonisierte Norm"},{"start":148,"laenge":6,"begriff":"Kunde"},{"start":160,"laenge":20,"begriff":"Exportierbare Daten"}],"naechste_schritte_begriffe":[{"start":24,"laenge":20,"begriff":"Exportierbare Daten"}]},{"req_id":"DA-VI-032","kurztitel":"Art. 30 Abs. 6 – Ausnahme (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Anbieter sind nicht verpflichtet, neue Technologien oder Dienste zu entwickeln, IP-/geschäftsgeheimnisgeschützte digitale Vermögenswerte offenzulegen oder die Sicherheit und Integrität des Kunden oder Anbieters zu beeinträchtigen.","fundstelle":"Art. 30 Abs. 6 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":113,"laenge":23,"begriff":"Digitale Vermögenswerte"},{"start":189,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VI-033","kurztitel":"Ausnahme für Individualdienste","beschreibung":"Die Pflichten aus Art. 23 Buchst. d, Art. 29 und Art. 30 Abs. 1 und 3 gelten nicht für Dienste, deren zentrale Funktionen auf einen einzelnen Kunden zugeschnitten oder deren Komponenten für einen einzelnen Kunden entwickelt wurden, sofern sie nicht im größeren kommerziellen Maßstab über den Dienstleistungskatalog angeboten werden.","fundstelle":"Art. 31 Abs. 1 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Individualisierungsgrad dokumentieren. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":142,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VI-034","kurztitel":"Ausnahme für Testversionen","beschreibung":"Kapitel VI gilt nicht für Dienste, die nicht als Vollversion, sondern zu Test- und Bewertungszwecken für begrenzte Zeit bereitgestellt werden.","fundstelle":"Art. 31 Abs. 2 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Testversionen zeitlich klar begrenzen. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-VI-035","kurztitel":"Information über nicht geltende Pflichten","beschreibung":"Vor Vertragsschluss über Dienste nach Art. 31 unterrichtet der Anbieter den potenziellen Kunden über die nicht geltenden Pflichten aus Kapitel VI.","fundstelle":"Art. 31 Abs. 3 (Kapitel VI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Hinweis in Angebot/Vertrag aufnehmen.","beschreibung_begriffe":[{"start":89,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VII-001","kurztitel":"Schutz vor Drittstaatszugriff","beschreibung":"Der Anbieter trifft alle angemessenen technischen, organisatorischen und rechtlichen Maßnahmen (inkl. Verträge), um internationalen und drittstaatlichen staatlichen Zugang zu bzw. Übermittlung von in der Union gespeicherten nicht-personenbezogenen Daten zu verhindern, wenn dies Unions- oder nationalem Recht widerspräche.","fundstelle":"Art. 32 Abs. 1 (Kapitel VII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verschlüsselung, Zugriffskontrollen, Audits, Konzernrichtlinie zu Behördenanfragen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":224,"laenge":29,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}]},{"req_id":"DA-VII-002","kurztitel":"Art. 32 Abs. 2 – Ausnahme (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Drittstaatliche Gerichts- oder Behördenentscheidungen, die die Übermittlung von oder den Zugang zu nicht-personenbezogenen Daten verlangen, werden nur anerkannt/vollstreckt, wenn sie auf einer internationalen Übereinkunft (z. B. Rechtshilfeabkommen) zwischen Drittland und Union/Mitgliedstaat beruhen.","fundstelle":"Art. 32 Abs. 2 (Kapitel VII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":99,"laenge":29,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}]},{"req_id":"DA-VII-003","kurztitel":"Herausgabe ohne Abkommen nur bei Rechtsstaatsgarantien","beschreibung":"Fehlt eine internationale Übereinkunft und würde die Befolgung gegen Unions-/nationales Recht verstoßen, darf Übermittlung/Zugang nur erfolgen, wenn (a) das Drittlandsrecht Begründung, Verhältnismäßigkeit und hinreichende Bestimmtheit der Entscheidung verlangt, (b) ein begründeter Einwand des Adressaten von einem zuständigen Drittlandsgericht überprüft wird und (c) dieses Gericht die rechtlichen Interessen des Datenbereitstellers berücksichtigen darf.","fundstelle":"Art. 32 Abs. 3 UAbs. 1 (Kapitel VII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Prüfschema und Rechtsberatung für Drittstaatsverlangen. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-VII-004","kurztitel":"Art. 32 Abs. 3 UAbs. 2 – Recht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Der Adressat kann die Stellungnahme der zuständigen nationalen Stelle/Behörde für internationale Rechtszusammenarbeit einholen (insb. bei Geschäftsgeheimnissen, IP, Re-Identifikationsrisiko); bei Berührung nationaler Sicherheit/Verteidigung muss er sie einholen. Bleibt eine Antwort binnen eines Monats aus oder verneint die Stelle die Voraussetzungen, kann er das Verlangen ablehnen.","fundstelle":"Art. 32 Abs. 3 UAbs. 2 (Kapitel VII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen."},{"req_id":"DA-VII-005","kurztitel":"Art. 32 Abs. 4 – Handlungspflicht (Anbieter von Datenverarbeitungsdiensten)","beschreibung":"Sind die Voraussetzungen nach Abs. 2 oder 3 erfüllt, stellt der Anbieter nur die Mindestmenge an Daten bereit, die nach angemessener Auslegung des Verlangens zulässig ist (Datenminimierung).","fundstelle":"Art. 32 Abs. 4 (Kapitel VII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":97,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-VII-006","kurztitel":"Kunden vorab informieren","beschreibung":"Der Anbieter teilt dem Kunden das Vorliegen eines drittstaatlichen Datenzugangsverlangens vor dessen Erfüllung mit – außer bei Strafverfolgungszwecken, solange dies zur Wahrung der Wirksamkeit der Strafverfolgung erforderlich ist.","fundstelle":"Art. 32 Abs. 5 (Kapitel VII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Benachrichtigungsprozess mit Strafverfolgungsausnahme.","beschreibung_begriffe":[{"start":23,"laenge":6,"begriff":"Kunde"}]},{"req_id":"DA-VIII-001","kurztitel":"Interoperabilität im Datenraum","beschreibung":"Wesentliche Interoperabilitätsanforderungen: (a) hinreichende Beschreibung von Datensatzinhalten, Nutzungsbeschränkungen, Lizenzen, Erhebungsmethoden, Datenqualität und Unsicherheiten (ggf. maschinenlesbar), (b) öffentliche, einheitliche Beschreibung von Datenstrukturen, Formaten, Vokabularen, Klassifikationen, Taxonomien, Codelisten, (c) ausreichende Beschreibung technischer Zugangsmittel (APIs), Nutzungsbedingungen und Dienstqualität für automatischen Datenzugang/-übermittlung, (d) ggf. Mittel zur Interoperabilität von Automatisierungstools wie intelligenten Verträgen.","fundstelle":"Art. 33 Abs. 1 (Kapitel VIII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Datensatz-, Format- und API-Beschreibungen maschinenlesbar veröffentlichen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":505,"laenge":17,"begriff":"Interoperabilität"}]},{"req_id":"DA-VIII-002","kurztitel":"Art. 33 Abs. 3, 8 – Ausnahme (Teilnehmer an Datenräumen)","beschreibung":"Konformität mit den wesentlichen Anforderungen wird vermutet bei Übereinstimmung mit harmonisierten Normen (Fundstelle im ABl.) oder gemeinsamen Spezifikationen (Durchführungsrechtsakt), soweit diese die Anforderungen abdecken.","fundstelle":"Art. 33 Abs. 3, 8 (Kapitel VIII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":85,"laenge":21,"begriff":"Offene Interoperabilitätsspezifikationen / gemeinsame Spezifikationen / harmonisierte Norm"}]},{"req_id":"DA-VIII-003","kurztitel":"Interoperabilität für Multi-Cloud","beschreibung":"Die Anforderungen aus Art. 23, 24, 25 Abs. 2 Buchst. a Ziff. ii und iv, Buchst. e und f sowie Art. 30 Abs. 2–5 gelten entsprechend für die Interoperabilität zum Zweck der parallelen Nutzung mehrerer Datenverarbeitungsdienste (Multi-Cloud).","fundstelle":"Art. 34 Abs. 1 (Kapitel VIII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Schnittstellen und Export auch für parallele Nutzung bereitstellen.","beschreibung_begriffe":[{"start":139,"laenge":17,"begriff":"Interoperabilität"},{"start":199,"laenge":25,"begriff":"Datenverarbeitungsdienst"}]},{"req_id":"DA-VIII-004","kurztitel":"Extraktionsentgelte nur zu Selbstkosten","beschreibung":"Bei paralleler Nutzung dürfen Datenextraktionsentgelte nur zur Weitergabe der tatsächlich entstandenen Extraktionskosten erhoben werden, ohne diese zu übersteigen.","fundstelle":"Art. 34 Abs. 2 (Kapitel VIII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Kostenbasierte Kalkulation.","beschreibung_begriffe":[{"start":30,"laenge":24,"begriff":"Datenextraktionsentgelte / Wechselentgelte"}]},{"req_id":"DA-VIII-006","kurztitel":"Art. 35 Abs. 8 – Handlungspflicht (Kommission (mit Wirkung für Anbieter von)","beschreibung":"Die Kommission veröffentlicht per Durchführungsrechtsakt die Fundstellen harmonisierter Normen und gemeinsamer Spezifikationen in einer zentralen Unionsdatenbank; diese Veröffentlichung löst die 12-Monats-Frist nach Art. 30 Abs. 3 aus.","fundstelle":"Art. 35 Abs. 8 (Kapitel VIII)","ab_wann":"Offen – abhängig von Durchführungsrechtsakt","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":73,"laenge":21,"begriff":"Offene Interoperabilitätsspezifikationen / gemeinsame Spezifikationen / harmonisierte Norm"}]},{"req_id":"DA-VIII-007","kurztitel":"Anforderungen an Smart Contracts","beschreibung":"Intelligente Verträge zur (teilweisen) Ausführung einer Datenbereitstellungsvereinbarung müssen erfüllen: (a) Robustheit und Zugangskontrolle, (b) sichere Beendigung und Unterbrechung (Reset-/Stop-Funktionen), (c) Datenarchivierung und -kontinuität (Prüfbarkeit), (d) strenge Zugangskontrolle auf Governance- und Vertragsebene, (e) Kohärenz mit den Bedingungen der Datenweitergabevereinbarung.","fundstelle":"Art. 36 Abs. 1 (Kapitel VIII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Design-Review: Robustheit, Stop-Funktion, Archivierung, Zugangskontrolle, Kohärenz. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-VIII-008","kurztitel":"Konformitätsbewertung und EU-Konformitätserklärung","beschreibung":"Der Anbieter führt eine Konformitätsbewertung durch, stellt bei Erfüllung eine EU-Konformitätserklärung aus und übernimmt damit die Verantwortung für die Einhaltung der wesentlichen Anforderungen.","fundstelle":"Art. 36 Abs. 2, 3 (Kapitel VIII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Bewertung dokumentieren; Erklärung ausstellen. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-VIII-009","kurztitel":"Art. 36 Abs. 4, 9 – Ausnahme (Anbieter eines intelligenten Vertrags)","beschreibung":"Konformität wird vermutet bei Übereinstimmung mit harmonisierten Normen (Fundstelle im ABl.) oder gemeinsamen Spezifikationen aus Durchführungsrechtsakten, soweit diese die Anforderungen abdecken.","fundstelle":"Art. 36 Abs. 4, 9 (Kapitel VIII)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":50,"laenge":21,"begriff":"Offene Interoperabilitätsspezifikationen / gemeinsame Spezifikationen / harmonisierte Norm"}]},{"req_id":"DA-IX-001","kurztitel":"Art. 37 Abs. 10 – Ausnahme (Rechtsträger im Anwendungsbereich der Ve)","beschreibung":"Rechtsträger unterliegen der Zuständigkeit des Mitgliedstaats ihrer Niederlassung; bei mehreren Niederlassungen der Hauptniederlassung (Hauptsitz/eingetragener Sitz mit finanzieller und betrieblicher Kontrolle).","fundstelle":"Art. 37 Abs. 10 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-IX-002","kurztitel":"EU-Vertreter benennen","beschreibung":"Benennung eines Vertreters in einem Mitgliedstaat, an den sich die zuständigen Behörden zusätzlich oder anstelle des Rechtsträgers wenden; der Vertreter arbeitet mit den Behörden zusammen und weist auf Anfrage die Compliance-Maßnahmen des Rechtsträgers umfassend nach.","fundstelle":"Art. 37 Abs. 11, 12 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Vertreter in einem Mitgliedstaat bestellen und Compliance-Nachweise bereithalten. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-IX-003","kurztitel":"Art. 37 Abs. 13 – Ausnahme (Nicht in der Union niedergelassene Recht)","beschreibung":"Rechtsträger unterliegen der Zuständigkeit des Mitgliedstaats des Vertreters; bis zur Benennung eines Vertreters unterliegen sie der Zuständigkeit aller Mitgliedstaaten, die jeweils Sanktionen verhängen können (sofern nicht bereits Verfahren einer anderen Behörde in derselben Sache).","fundstelle":"Art. 37 Abs. 13 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-IX-004","kurztitel":"Art. 37 Abs. 14 – Handlungspflicht (Nutzer)","beschreibung":"Die zuständigen Behörden können alle zur Compliance-Prüfung nötigen Informationen verlangen; Verlangen müssen verhältnismäßig und begründet sein.","fundstelle":"Art. 37 Abs. 14 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren."},{"req_id":"DA-IX-005","kurztitel":"Art. 38 Abs. 1 – Recht (Natürliche und juristische Personen)","beschreibung":"Recht auf Beschwerde – einzeln oder gemeinsam – bei der zuständigen Behörde des Mitgliedstaats des gewöhnlichen Aufenthalts, Arbeitsplatzes oder der Niederlassung bei vermuteter Verletzung von Rechten aus der Verordnung; der Datenkoordinator stellt auf Anfrage alle nötigen Informationen bereit.","fundstelle":"Art. 38 Abs. 1 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen."},{"req_id":"DA-IX-006","kurztitel":"Art. 39 – Recht (Natürliche und juristische Personen)","beschreibung":"Recht auf wirksamen gerichtlichen Rechtsbehelf gegen rechtsverbindliche Entscheidungen zuständiger Behörden sowie bei Untätigkeit der Behörde auf Beschwerde; Verfahren vor den Gerichten des Mitgliedstaats der Behörde.","fundstelle":"Art. 39 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen."},{"req_id":"DA-IX-007","kurztitel":"Art. 40 Abs. 1–3 – Ausnahme (Alle Adressaten (Sanktionsrisiko))","beschreibung":"Mitgliedstaaten erlassen wirksame, verhältnismäßige und abschreckende Sanktionen (Meldung an die Kommission bis 12.09.2025) und berücksichtigen dabei Art, Schwere, Umfang, Dauer, Abhilfemaßnahmen, frühere Verstöße, finanzielle Vorteile, sonstige Umstände und den Unionsjahresumsatz.","fundstelle":"Art. 40 Abs. 1–3 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-IX-008","kurztitel":"Art. 40 Abs. 4, 5 – Ausnahme (Dateninhaber, Hersteller, Dritte (Kapite)","beschreibung":"Bei Verstößen gegen Kapitel II, III und V können die Datenschutzaufsichtsbehörden Geldbußen nach Art. 83 DSGVO bis zur Höhe des Art. 83 Abs. 5 DSGVO verhängen; bei Kapitel V der EDSB nach Art. 66 VO 2018/1725.","fundstelle":"Art. 40 Abs. 4, 5 (Kapitel IX)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-X-001","kurztitel":"Kein Datenbankschutz für Produktdaten","beschreibung":"Das Schutzrecht sui generis nach Art. 7 RL 96/9/EG findet keine Anwendung auf Daten, die mittels eines in den Anwendungsbereich der Verordnung (insb. Art. 4, 5) fallenden vernetzten Produkts oder verbundenen Dienstes erlangt oder erzeugt wurden.","fundstelle":"Art. 43 (Kapitel X)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Rechtsposition nicht auf Datenbankrecht stützen.","beschreibung_begriffe":[{"start":78,"laenge":5,"begriff":"Daten"},{"start":171,"laenge":19,"begriff":"Vernetztes Produkt"},{"start":196,"laenge":20,"begriff":"Verbundener Dienst"}]},{"req_id":"DA-XI-001","kurztitel":"Art. 44 Abs. 1 – Ausnahme (Alle Adressaten)","beschreibung":"Besondere B2B-, B2C- und ausnahmsweise B2G-Datenbereitstellungspflichten aus Unionsrecht, das bis zum 11.01.2024 in Kraft getreten ist, sowie darauf beruhende delegierte/Durchführungsrechtsakte bleiben unberührt.","fundstelle":"Art. 44 Abs. 1 (Kapitel XI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-XI-002","kurztitel":"Art. 44 Abs. 2, 3 – Ausnahme (Alle Adressaten)","beschreibung":"Sektorspezifisches Unionsrecht mit weiteren Anforderungen (technische Zugangsaspekte, Beschränkungen der Dateninhaberrechte, sonstige Aspekte) sowie Unions-/nationales Recht zum Datenzugang für wissenschaftliche Forschung (außer Kapitel V) bleiben unberührt.","fundstelle":"Art. 44 Abs. 2, 3 (Kapitel XI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-XI-003","kurztitel":"Art. 50 UAbs. 1, 2 – Ausnahme (Alle Adressaten)","beschreibung":"Inkrafttreten am 20. Tag nach Veröffentlichung im ABl. (ABl. vom 22.12.2023, d. h. 11.01.2024); Geltung ab 12.09.2025.","fundstelle":"Art. 50 UAbs. 1, 2 (Kapitel XI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2); Inkrafttreten 11.01.2024","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-XI-004","kurztitel":"Stichtag 12.09.2026","beschreibung":"Die Pflicht nach Art. 3 Abs. 1 (access by design) gilt nur für vernetzte Produkte und damit verbundene Dienste, die nach dem 12.09.2026 in Verkehr gebracht wurden.","fundstelle":"Art. 50 UAbs. 3 (Kapitel XI)","ab_wann":"12.09.2026 (Art. 50 UAbs. 3)","naechste_schritte":"Produktroadmap gegen Stichtag prüfen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":63,"laenge":18,"begriff":"Vernetztes Produkt"},{"start":92,"laenge":18,"begriff":"Verbundener Dienst"}]},{"req_id":"DA-XI-005","kurztitel":"Art. 50 UAbs. 4 – Ausnahme (Dateninhaber (Kapitel III))","beschreibung":"Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten.","fundstelle":"Art. 50 UAbs. 4 (Kapitel XI)","ab_wann":"12.09.2025 (Art. 50 UAbs. 4)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-XI-006","kurztitel":"Übergangsregel für Verträge","beschreibung":"Kapitel IV gilt für nach dem 12.09.2025 geschlossene Verträge; für am/vor dem 12.09.2025 geschlossene Verträge gilt es ab 12.09.2027, sofern sie unbefristet sind oder ihre Laufzeit frühestens 10 Jahre nach dem 11.01.2024 endet.","fundstelle":"Art. 50 UAbs. 5, 6 (Kapitel XI)","ab_wann":"12.09.2025 bzw. 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Vertragsinventur nach Abschlussdatum und Laufzeit."}],"begriffe":[{"begriff":"Daten","fundstelle":"Art. 2 Nr. 1","definition":"Jede digitale Darstellung von Handlungen, Tatsachen oder Informationen und jede Zusammenstellung davon, auch als Ton-, Bild- oder audiovisuelles Material.","abgrenzung":"EG 15: Rohdaten und aufbereitete Daten erfasst; abgeleitete/gefolgerte Informationen aus proprietären Algorithmen (z. B. Sensorfusion) nicht. EG 16: Inhalte (Text, Audio, Video), die der Nutzer aufzeichnet/abspielt, sind nicht erfasst.","relevanz":"Hoch – Grundlage jeder Datenkategorisierung; Abgrenzung Rohdaten vs. abgeleitete Daten ist erster Prüfschritt in Kapitel II."},{"begriff":"Metadaten","fundstelle":"Art. 2 Nr. 2","definition":"Strukturierte Beschreibung von Inhalt oder Nutzung von Daten, die deren Auffinden oder Verwendung erleichtert.","abgrenzung":"EG 15: mindestens grundlegender Kontext und Zeitstempel sind mitzuliefern.","relevanz":"Mittel – erweitert den Umfang der Bereitstellungspflichten (Art. 3–5, 14)."},{"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten","fundstelle":"Art. 2 Nr. 3, 4","definition":"Verweis auf Art. 4 Nr. 1 DSGVO; nicht-personenbezogen ist alles andere.","abgrenzung":"EG 7, 34: gemischte Datensätze unterliegen der DSGVO; Verordnung ist keine Rechtsgrundlage für Erhebung/Nutzung personenbezogener Daten.","relevanz":"Hoch – Weiche für zusätzliche DSGVO-Prüfung (Art. 4 Abs. 12, Art. 5 Abs. 7) und für Kapitel V (nur nicht-personenbezogene Daten außerhalb Notstand) sowie Kapitel VII."},{"begriff":"Vernetztes Produkt","fundstelle":"Art. 2 Nr. 5","definition":"Gegenstand, der Daten über Nutzung oder Umgebung erlangt/generiert/erhebt, diese über elektronischen Kommunikationsdienst, physische Verbindung oder geräteinternen Zugang übermitteln kann und dessen Hauptfunktion nicht die Speicherung/Verarbeitung/Übertragung von Daten im Namen anderer (außer dem Nutzer) ist.","abgrenzung":"EG 14: IoT-Produkte aller Sektoren (Fahrzeuge, Medizingeräte, Haushaltsgeräte, Maschinen), außer Prototypen. EG 16: Server/Cloud-Infrastruktur, die ausschließlich im Auftrag Dritter betrieben wird, nicht erfasst. EG 36: IoT-Geräte gelten als Endgeräte i. S. d. RL 2002/58/EG.","relevanz":"Sehr hoch – Eingangsfrage für Kapitel II."},{"begriff":"Verbundener Dienst","fundstelle":"Art. 2 Nr. 6","definition":"Digitaler Dienst (nicht elektronischer Kommunikationsdienst, inkl. Software), der beim Kauf/Miete/Leasing so mit dem Produkt verbunden ist, dass das Produkt ohne ihn eine Funktion nicht ausführen könnte, oder der nachträglich zur Ergänzung/Aktualisierung/Anpassung der Funktionen verbunden wird.","abgrenzung":"EG 17: Dienst muss Daten oder Befehle mit dem Produkt austauschen; reine Beratungs-, Analyse-, Finanz-, Reparatur-/Wartungsdienste sind keine verbundenen Dienste; Stromversorgung und Konnektivität ebenfalls nicht; im Zweifel Anwendung der Verordnung; auch Dienste Dritter erfasst.","relevanz":"Sehr hoch – bestimmt Adressatenstellung des Dienstanbieters und Umfang der 'verbundenen Dienstdaten'."},{"begriff":"Verarbeitung","fundstelle":"Art. 2 Nr. 7","definition":"Jeder Vorgang mit Daten (Erheben, Speichern, Nutzen, Offenlegen, Löschen usw.), mit oder ohne automatisierte Verfahren.","abgrenzung":"—","relevanz":"Niedrig – Hilfsbegriff (z. B. Art. 6 Abs. 1)."},{"begriff":"Datenverarbeitungsdienst","fundstelle":"Art. 2 Nr. 8","definition":"Digitale Dienstleistung mit flächendeckendem, auf Abruf verfügbarem Netzzugang zu einem gemeinsam genutzten Pool konfigurierbarer, skalierbarer, elastischer Rechenressourcen (zentralisiert, verteilt oder hochgradig verteilt), rasch bereitstellbar mit minimalem Verwaltungsaufwand.","abgrenzung":"EG 80: erläutert 'ortsunabhängig', 'skalierbar', 'elastisch', 'gemeinsam genutzter Pool', 'verteilt', 'hochgradig verteilt' (Edge). EG 81: IaaS, PaaS, SaaS und Varianten (Storage-, Database-as-a-Service).","relevanz":"Sehr hoch – Eingangsfrage für Kapitel VI und VII."},{"begriff":"Gleiche Dienstart","fundstelle":"Art. 2 Nr. 9","definition":"Datenverarbeitungsdienste mit demselben Hauptziel, Dienstmodell und denselben Hauptfunktionen.","abgrenzung":"EG 81: Kategorisierung nach Hauptziel/Funktionen; Dienste gleicher Art können unterschiedliche Leistungs-/Sicherheitsmerkmale haben.","relevanz":"Hoch – bestimmt Reichweite der Wechselpflichten (Art. 23, 30)."},{"begriff":"Datenvermittlungsdienst","fundstelle":"Art. 2 Nr. 10","definition":"Verweis auf Art. 2 Nr. 11 VO (EU) 2022/868 (DGA).","abgrenzung":"EG 26, 33: können Nutzer beim Datenzugang unterstützen, Zugang aggregieren; unterliegen DGA-Schutzvorkehrungen (EG 39).","relevanz":"Mittel – kann als 'im Namen des Nutzers handelnde Partei' (Art. 5 Abs. 1) auftreten."},{"begriff":"Betroffene Person","fundstelle":"Art. 2 Nr. 11","definition":"Verweis auf Art. 4 Nr. 1 DSGVO.","abgrenzung":"EG 34: Nutzer kann betroffene Person sein oder nicht; Unternehmensnutzer gilt als Verantwortlicher.","relevanz":"Hoch – Weiche in Art. 4 Abs. 12, Art. 5 Abs. 7."},{"begriff":"Nutzer","fundstelle":"Art. 2 Nr. 12","definition":"Natürliche oder juristische Person, die ein vernetztes Produkt besitzt, der vertraglich zeitweilige Nutzungsrechte übertragen wurden oder die verbundene Dienste in Anspruch nimmt.","abgrenzung":"EG 18: Unternehmen, Verbraucher, öffentliche Stelle; Eigentümer, Mieter, Leasingnehmer; mehrere Nutzer möglich (Flottenmanagement, Car-Sharing). EG 21: getrennte Nutzerkonten bei Mehrfachnutzung. EG 34: Nutzer kann nach Datenerhalt selbst Dateninhaber werden.","relevanz":"Sehr hoch – Berechtigter in Kapitel II; Unternehmen als Nutzer haben Rechte, nicht nur Pflichten."},{"begriff":"Dateninhaber","fundstelle":"Art. 2 Nr. 13","definition":"Natürliche oder juristische Person, die nach der Verordnung, Unionsrecht oder nationalem Recht berechtigt oder verpflichtet ist, Daten – bei Vertrag auch Produkt-/Dienstdaten – zu nutzen und bereitzustellen, die sie während der Erbringung eines verbundenen Dienstes abgerufen oder generiert hat.","abgrenzung":"EG 22: Auftragsverarbeiter i. S. d. DSGVO sind keine Dateninhaber, können aber vom Verantwortlichen beauftragt werden. EG 25, 63: öffentliche Stellen i. d. R. nicht, öffentliche Unternehmen ggf. schon. EG 41: Kleinst-/Kleinunternehmen können als Dateninhaber verpflichtet sein, auch wenn sie nicht Hersteller sind.","relevanz":"Sehr hoch – Hauptpflichtadressat in Kapitel II, III, V. Auslegungsunsicherheit: Definition ist auf verbundene Dienste bezogen; Anwendung auf Kapitel V ('von Unternehmen gehaltene Daten') nur über EG 63."},{"begriff":"Datenempfänger","fundstelle":"Art. 2 Nr. 14","definition":"Person, die im Rahmen ihrer gewerblichen/beruflichen Tätigkeit handelt, nicht Nutzer ist und der der Dateninhaber Daten bereitstellt – einschließlich Dritter, denen auf Nutzerverlangen oder aufgrund gesetzlicher Pflicht Daten bereitgestellt werden.","abgrenzung":"EG 33: Dritte können Verbraucher, Unternehmen, Forschungseinrichtungen etc. sein.","relevanz":"Hoch – Adressat in Kapitel III/IV; Begriffe 'Dritter' und 'Datenempfänger' überschneiden sich (vgl. Art. 11 Abs. 5)."},{"begriff":"Produktdaten","fundstelle":"Art. 2 Nr. 15","definition":"Durch Nutzung eines vernetzten Produkts generierte Daten, die der Hersteller so konzipiert hat, dass sie über Kommunikationsdienst, physische Verbindung oder geräteinternen Zugang abrufbar sind.","abgrenzung":"EG 15: auch Sensordaten, Hardwarestatus, Daten im Standby/ausgeschaltet; nicht: abgeleitete Informationen. EG 20: keine Pflicht, Daten außerhalb der generierenden Komponente zu speichern.","relevanz":"Sehr hoch – Gegenstand der Kapitel-II-Pflichten; die Konzeptionsentscheidung des Herstellers bestimmt den Umfang."},{"begriff":"Verbundene Dienstdaten","fundstelle":"Art. 2 Nr. 16","definition":"Daten, die Nutzerhandlungen oder Vorgänge im Zusammenhang mit dem Produkt digital darstellen und vom Nutzer absichtlich aufgezeichnet oder als Nebenprodukt bei der Erbringung eines verbundenen Dienstes generiert werden.","abgrenzung":"EG 15, 17: verbundene Dienste können unabhängig vom Produkt eigene wertvolle Daten generieren.","relevanz":"Hoch – erweitert den Datenumfang über die reine Produktebene hinaus."},{"begriff":"Ohne Weiteres verfügbare Daten","fundstelle":"Art. 2 Nr. 17","definition":"Produkt- und verbundene Dienstdaten, die ein Dateninhaber ohne unverhältnismäßigen Aufwand rechtmäßig vom Produkt/Dienst erhält oder erhalten kann, wobei über eine einfache Bearbeitung hinausgegangen wird.","abgrenzung":"EG 20: Verfügbarkeit ergibt sich aus Konzeption, Vertrag und technischen Mitteln; nicht erfasst: Daten, die das Produkt nicht nach außen übermittelt. EG 15: keine wesentlichen Investitionen in Bereinigung/Transformation geschuldet.","relevanz":"Sehr hoch – bestimmt den Umfang der Bereitstellungspflicht nach Art. 4 und 5 (Auslegungsunsicherheit: 'unverhältnismäßiger Aufwand')."},{"begriff":"Geschäftsgeheimnis / Inhaber eines Geschäftsgeheimnisses","fundstelle":"Art. 2 Nr. 18, 19","definition":"Verweis auf Art. 2 Nr. 1 und 2 RL (EU) 2016/943.","abgrenzung":"EG 31: Geschäftsgeheimnis allein rechtfertigt keine Ablehnung; Schutz über vereinbarte Maßnahmen; Ausnahme nur bei schwerem wirtschaftlichem Schaden (schwere irreparable Verluste).","relevanz":"Hoch – Prüfpfad in Art. 4 Abs. 6–8, Art. 5 Abs. 9–11, Art. 8 Abs. 6, Art. 19 Abs. 3."},{"begriff":"Profiling","fundstelle":"Art. 2 Nr. 20","definition":"Verweis auf Art. 4 Nr. 4 DSGVO.","abgrenzung":"EG 39: Profiling durch Dritte nur, wenn für den verlangten Dienst unbedingt erforderlich.","relevanz":"Mittel – Verbot in Art. 6 Abs. 2 Buchst. b."},{"begriff":"Bereitstellung auf dem Markt / Inverkehrbringen","fundstelle":"Art. 2 Nr. 21, 22","definition":"Entgeltliche oder unentgeltliche Abgabe eines vernetzten Produkts zum Vertrieb/Verbrauch/Verwendung auf dem Unionsmarkt; Inverkehrbringen = erstmalige Bereitstellung.","abgrenzung":"EG 41: einjährige Übergangszeit für Produkte mittlerer Unternehmen nach Inverkehrbringen.","relevanz":"Hoch – zeitlicher Anknüpfungspunkt für Art. 3 Abs. 1 (Art. 50 UAbs. 3) und Art. 7 Abs. 1 UAbs. 2; Unsicherheit: Definition bezieht sich nur auf Produkte, nicht auf verbundene Dienste."},{"begriff":"Verbraucher","fundstelle":"Art. 2 Nr. 23","definition":"Natürliche Person, die außerhalb ihrer gewerblichen/beruflichen Tätigkeit handelt.","abgrenzung":"EG 28: Verbraucherrecht der Union (RL 93/13/EWG, 2005/29/EG) gilt ergänzend.","relevanz":"Mittel – Art. 6 Abs. 2 Buchst. h; Abgrenzung B2C/B2B für Kapitel IV."},{"begriff":"Unternehmen","fundstelle":"Art. 2 Nr. 24","definition":"Natürliche oder juristische Person, die in Bezug auf erfasste Verträge/Vorgehensweisen zu gewerblichen/beruflichen Zwecken handelt.","abgrenzung":"EG 58, 59: Kapitel IV schützt Unternehmen vor einseitig auferlegten Klauseln unabhängig von der Größe.","relevanz":"Hoch – Adressat Kapitel IV."},{"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)","fundstelle":"Art. 2 Nr. 25, 26 (KMU: EG 3, Art. 9 Abs. 4)","definition":"Verweis auf Art. 2 Abs. 2 und 3 des Anhangs der Empfehlung 2003/361/EG.","abgrenzung":"EG 41: Ausnahme von Konzeptionspflichten; Rückausnahme bei nicht-kleinen Partner-/verbundenen Unternehmen (Art. 3 des Anhangs) oder Unterauftrag. EG 63, 75: Sonderregeln in Kapitel V. EG 49: Kostendeckelung der Gegenleistung (Art. 9 Abs. 4).","relevanz":"Sehr hoch – Größenklasse steuert Art. 7 Abs. 1, Art. 9 Abs. 4, Art. 15 Abs. 2, Art. 20."},{"begriff":"Einrichtungen der Union / öffentliche Stelle","fundstelle":"Art. 2 Nr. 27, 28","definition":"Einrichtungen, Stellen und Agenturen der Union nach EUV/AEUV/Euratom; öffentliche Stelle = nationale, regionale, lokale Behörden, Körperschaften/Einrichtungen des öffentlichen Rechts und deren Verbände.","abgrenzung":"EG 63: Forschungseinrichtungen können öffentliche Stellen sein; öffentliche Unternehmen können Dateninhaber sein.","relevanz":"Hoch – Anfragende in Kapitel V; Abgrenzung 'öffentliches Unternehmen als Dateninhaber'."},{"begriff":"Öffentlicher Notstand","fundstelle":"Art. 2 Nr. 29","definition":"Zeitlich begrenzte Ausnahmesituation (Gesundheitsnotfall, Naturkatastrophe, von Menschen verursachte Katastrophe inkl. schwerer Cybersicherheitsvorfälle) mit negativen Auswirkungen auf die Bevölkerung und Risiko schwerwiegender Folgen, die nach Unions-/nationalem Recht festgestellt und amtlich ausgerufen wurde.","abgrenzung":"EG 64: Feststellung nach einschlägigen Verfahren, auch internationaler Organisationen.","relevanz":"Hoch – Weiche zwischen Art. 15 Abs. 1 Buchst. a (unentgeltlich, auch personenbezogene Daten, 5-Tage-Frist, auch KMU) und Buchst. b."},{"begriff":"Kunde","fundstelle":"Art. 2 Nr. 30","definition":"Natürliche oder juristische Person mit vertraglicher Beziehung zu einem Anbieter von Datenverarbeitungsdiensten.","abgrenzung":"EG 78: auch Kunden unentgeltlicher Angebote. EG 91: Anbieter können selbst Kunden sein.","relevanz":"Hoch – Berechtigter in Kapitel VI."},{"begriff":"Virtuelle Assistenten","fundstelle":"Art. 2 Nr. 31","definition":"Software, die Aufträge/Aufgaben/Fragen (Ton, Schrift, Gesten) verarbeitet und Zugang zu anderen Diensten gewährt oder Produktfunktionen steuert.","abgrenzung":"EG 23: nur Daten aus der Interaktion mit vernetzten Produkten/verbundenen Diensten erfasst.","relevanz":"Mittel – Art. 1 Abs. 4."},{"begriff":"Digitale Vermögenswerte","fundstelle":"Art. 2 Nr. 32","definition":"Elemente in digitaler Form (inkl. Anwendungen), für die der Kunde ein Nutzungsrecht hat, unabhängig vom Vertrag mit dem zu wechselnden Dienst.","abgrenzung":"EG 83: Anwendungen, Konfigurations-/Sicherheits-/Zugriffsmetadaten, virtuelle Maschinen, Container.","relevanz":"Hoch – Gegenstand der Übertragungspflichten in Art. 23, 25."},{"begriff":"IKT-Infrastruktur in eigenen Räumlichkeiten","fundstelle":"Art. 2 Nr. 33","definition":"Vom Kunden besessene, gemietete oder geleaste Infrastruktur/Rechenressourcen im Rechenzentrum des Kunden, von ihm oder Dritten betrieben.","abgrenzung":"EG 93: Wechsel zu On-Premises ausdrücklich erfasst.","relevanz":"Mittel – Wechselziel in Kapitel VI."},{"begriff":"Wechsel","fundstelle":"Art. 2 Nr. 34","definition":"Prozess zwischen Quellenanbieter, Kunde und ggf. übernehmendem Anbieter, bei dem der Kunde zu einem Dienst gleicher Art eines anderen Anbieters oder zu eigener IKT-Infrastruktur wechselt, auch durch Extraktion, Umwandlung und Hochladen.","abgrenzung":"EG 85: mehrstufiger Prozess; Herauslösung einzelner Dienste; Wechsel durch Dritte im Namen des Kunden; Verantwortungsverteilung (Quellanbieter extrahiert, Kunde/Zielanbieter laden hoch).","relevanz":"Hoch – Auslöser aller Kapitel-VI-Pflichten."},{"begriff":"Datenextraktionsentgelte / Wechselentgelte","fundstelle":"Art. 2 Nr. 35, 36","definition":"Datenextraktionsentgelte = Übertragungsentgelte für Netzextraktion; Wechselentgelte = alle Entgelte für vorgeschriebene Wechselhandlungen inkl. Extraktionsentgelte, außer Standarddienstentgelte und Sanktionen bei vorzeitiger Kündigung.","abgrenzung":"EG 88, 89: Outsourcing-Kosten des Anbieters ungerechtfertigt; zusätzliche, vom Kunden bestellte Dienste dürfen berechnet werden; Standarddienstentgelte bleiben bis Vertragsende. EG 99: Extraktionsentgelte bei paralleler Nutzung weiter zulässig.","relevanz":"Hoch – Art. 29, Art. 34 Abs. 2; Stichtag 12.01.2027."},{"begriff":"Funktionsäquivalenz","fundstelle":"Art. 2 Nr. 37","definition":"Wiederherstellung eines Mindestmaßes an Funktionalität im neuen Dienst gleicher Art auf Basis exportierbarer Daten/Vermögenswerte, wobei bei gemeinsamen Funktionen ein materiell vergleichbares Ergebnis erzielt wird.","abgrenzung":"EG 86: nur für gemeinsam angebotene Funktionen; Pflicht nur für IaaS. EG 92: keine Pflicht zur Wiederherstellung in fremder Infrastruktur.","relevanz":"Hoch – Art. 23 Buchst. d, Art. 30 Abs. 1 (nur IaaS)."},{"begriff":"Exportierbare Daten","fundstelle":"Art. 2 Nr. 38","definition":"Für Art. 23–31 und 35: Eingabe- und Ausgabedaten inkl. Metadaten, die durch Kundennutzung unmittelbar/mittelbar oder gemeinsam generiert werden, ohne IP-/geschäftsgeheimnisgeschützte Vermögenswerte des Anbieters oder Dritter.","abgrenzung":"EG 82: auch Daten zu Sicherheit/Integrität des Dienstes ausgenommen; Ausnahmen dürfen Wechsel nicht behindern.","relevanz":"Hoch – Umfang der Export-/Löschpflichten (Art. 25 Abs. 2 Buchst. e, f, h; Art. 30 Abs. 5)."},{"begriff":"Intelligenter Vertrag","fundstelle":"Art. 2 Nr. 39","definition":"Computerprogramm zur automatisierten Ausführung einer Vereinbarung (oder eines Teils) mittels einer Abfolge elektronischer Datensätze mit gewährleisteter Integrität und chronologischer Richtigkeit.","abgrenzung":"EG 104: technologieneutral; z. B. mit elektronischem Vorgangsregister verbunden; nicht für rein interne Nutzung.","relevanz":"Hoch – Adressatenprüfung Art. 36."},{"begriff":"Interoperabilität","fundstelle":"Art. 2 Nr. 40","definition":"Fähigkeit von Datenräumen, Netzen, Systemen, Produkten, Anwendungen, Datenverarbeitungsdiensten oder Komponenten, Daten auszutauschen und zu nutzen.","abgrenzung":"EG 90: mehrschichtige Interoperabilität; ISO/IEC 19941:2017 als Bezugspunkt.","relevanz":"Mittel – Kapitel VIII."},{"begriff":"Offene Interoperabilitätsspezifikationen / gemeinsame Spezifikationen / harmonisierte Norm","fundstelle":"Art. 2 Nr. 41, 42, 43","definition":"Leistungsbezogene IKT-Spezifikation für Cloud-Interoperabilität; Dokument (keine Norm) mit technischen Lösungen zur Pflichterfüllung; harmonisierte Norm nach Art. 2 Nr. 1 Buchst. c VO 1025/2012.","abgrenzung":"EG 100, 103: gemeinsame Spezifikationen nur als Ausweichlösung bei Scheitern/Verzögerung der Normung.","relevanz":"Mittel – Konformitätsvermutungen (Art. 33, 36) und Kompatibilitätspflicht (Art. 30 Abs. 3)."},{"begriff":"Teilnehmer an Datenräumen / gemeinsame europäische Datenräume","fundstelle":"Nicht in Art. 2 definiert; Umschreibung in Art. 33 Abs. 1","definition":"Teilnehmer, die anderen Teilnehmern Daten oder Datendienste anbieten; Datenräume = zweck-/sektorspezifische oder sektorübergreifende interoperable Rahmen gemeinsamer Normen und Verfahren für Datenweitergabe/-verarbeitung.","abgrenzung":"EG 103: Stellen, die die Datenweitergabe in gemeinsamen europäischen Datenräumen erleichtern oder daran beteiligt sind, einschließlich Dateninhaber; Pflichten nur für kontrollierte Elemente.","relevanz":"Mittel – Adressat Kapitel VIII; Auslegungsunsicherheit wegen fehlender Legaldefinition."},{"begriff":"Torwächter","fundstelle":"Nicht in Art. 2 definiert; Verweis in Art. 5 Abs. 3, Art. 6 Abs. 2 Buchst. d auf Art. 3 VO (EU) 2022/1925","definition":"Nach dem DMA benanntes Unternehmen.","abgrenzung":"EG 40: kein Datenzugangsrecht; Dritte dürfen Daten nicht an Torwächter weitergeben, dürfen aber deren Cloud-Dienste nutzen.","relevanz":"Hoch – Ausschlussknoten bei der Wahl des Dritten."}],"fristen":[{"datum":"11.01.2024","fundstelle":"Art. 50 UAbs. 1 (Veröffentlichung ABl. 22.12.2023); genannt in Art. 29 Abs. 2, Art. 44 Abs. 1, Art. 45 Abs. 2","betroffene_req_ids":"DA-VI-023, DA-XI-001, DA-XI-003, DA-XI-007","bedeutung":"Inkrafttreten der Verordnung; Beginn des Zeitraums ermäßigter Wechselentgelte; Stichtag für unberührt bleibende Alt-Bereitstellungspflichten; Beginn der Befugnisübertragung für delegierte Rechtsakte.","req_ids":["DA-VI-023","DA-XI-001","DA-XI-003","DA-XI-007"],"id":"FR-01","so
