:"","erwaegungsgruende_liste":[],"querverweise_liste":["DSGVO Art. 5 Abs. 1 Buchst. c"],"anforderung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":67,"laenge":7,"begriff":"Nutzer"}],"stichtage":["FR-04"],"stichtag_quelle":"Alle Anforderungen ohne abweichende Angabe","handlungsfristen":[]},{"req_id":"DA-II-011","kapitel":"II","fundstelle":"Art. 4 Abs. 6","adressat":"Dateninhaber (bzw. Inhaber des Geschäftsgeheimnisses); Nutzer","typ":"Handlungspflicht","anforderung":"Geschäftsgeheimnisse werden nur offengelegt, wenn Dateninhaber und Nutzer vorher alle erforderlichen Maßnahmen zur Wahrung der Vertraulichkeit getroffen haben. Der Dateninhaber (oder der Geschäftsgeheimnisinhaber) ermittelt die geschützten Daten – auch in den Metadaten – und vereinbart mit dem Nutzer angemessene technische und organisatorische Maßnahmen (z. B. Mustervertragsklauseln, NDAs, Zugangsprotokolle, Normen, Verhaltenskodizes).","ausloeser":"Verlangte Daten enthalten Geschäftsgeheimnisse","ausnahmen":"—","geltungsbeginn":"12.09.2025 (Art. 50 UAbs. 2)","querverweise":"Art. 2 Nr. 18, 19; RL 2016/943; Art. 8 Abs. 6; Art. 41 (Mustervertragsklauseln)","erwaegungsgruende":"31","auslegungsunsicherheit":"ja – Umfang der 'erforderlichen' Maßnahmen und Verfahren bei fehlender Einigung nur grob geregelt","hinweis":"Grundsatz (EG 31): Geschäftsgeheimnis allein rechtfertigt keine Ablehnung.","erwaegungsgruende_liste":["31"],"querverweise_liste":["Art. 2 Nr. 18, 19","RL 2016/943","Art. 8 Abs. 6","Art. 41 (Mustervertragsklauseln)"],"anforderung_begriffe":[{"start":50,"laenge":12,"begriff":"Dateninhaber"},{"start":67,"laenge":6,"begriff":"Nutzer"},{"start":240,"laenge":5,"begriff":"Daten"},{"start":260,"laenge":9,"begriff":"Metadaten"}],"ausloeser_begriffe":[{"start":10,"laenge":5,"begriff":"Daten"}],"stichtage":["FR-04"],"stichtag_quelle":"Alle Anforderungen ohne abweichende Angabe","handlungsfristen":[]},{"req_id":"DA-II-012","kapitel":"II","fundstelle":"Art. 4 Abs. 7","adressat":"Dateninhaber","typ":"Recht","anforderung":"Kommt keine Einigung über die Schutzmaßnahmen zustande, setzt der Nutzer vereinbarte Maßnahmen nicht um oder wird die Vertraulichkeit verletzt, kann der Dateninhaber die Weitergabe der als Geschäftsgeheimnis eingestuften Daten verweigern oder aussetzen. Die Entscheidung ist zu begründen und dem Nutzer unverzüglich schriftlich mitzuteilen; die zuständige Behörde ist unter Angabe der nicht vereinbarten/umgesetzten Maßnahmen und der betroffenen Geschäftsgeheimnisse zu unterrichten.","ausloeser":"Fehlende Einigung/Umsetzung oder Vertraulichkeitsverletzung","ausnahmen":"Nur für als Geschäftsgeheimnis eingestufte Daten","geltungsbeginn":"12.09.2025 (Art. 50 UAbs. 2)","querverweise":"Art. 4 Abs. 6, 9; Art. 37","erwaegungsgruende":"31","auslegungsunsicherheit":"nein","hinweis":"Kombiniert Recht (Verweigerung) mit Informationspflichten gegenüber Nutzer und Behörde.","erwaegungsgruende_liste":["31"],"querverweise_liste":["Art. 4 Abs. 6, 9","Art. 37"],"anforderung_begriffe":[{"start":66,"laenge":6,"begriff":"Nutzer"},{"start":153,"laenge":12,"begriff":"Dateninhaber"},{"start":189,"laenge":18,"begriff":"Geschäftsgeheimnis / Inhaber eines Geschäftsgeheimnisses"},{"start":221,"laenge":5,"begriff":"Daten"}],"ausnahmen_begriffe":[{"start":12,"laenge":18,"begriff":"Geschäftsgeheimnis / Inhaber eines Geschäftsgeheimnisses"},{"start":43,"laenge":5,"begriff":"Daten"}],"stichtage":["FR-04"],"stichtag_quelle":"Alle Anforderungen ohne abweichende Angabe","handlungsfristen":["FR-12"]},{"req_id":"DA-II-013","kapitel":"II","fundstelle":"Art. 4 Abs. 8","adressat":"Dateninhaber, der Inhaber eines Geschäftsgeheimnisses ist","typ":"Recht","anforderung":"Unter außergewöhnlichen Umständen kann der Dateninhaber ein Zugangsverlangen im Einzelfall ablehnen, wenn er nachweist, dass trotz der Schutzmaßnahmen des Nutzers mit hoher Wahrscheinlichkeit ein schwerer wirtschaftlicher Schaden durch Offenlegung droht. Nachweis auf Basis objektiver Fakten (Durchsetzbarkeit in Drittländern, Vertraulichkeitsgrad, Einzigartigkeit/Neuartigkeit des Produkts), schriftlich und unverzüglich gegenüber dem Nutzer; Mitteilung an die zuständige Behörde.","ausloeser":"Drohender schwerer wirtschaftlicher Schaden","ausnahmen":"Nur Ausnahmefall; nur der Dateninhaber, der zugleich Geschäftsgeheimnisinhaber ist","geltungsbeginn":"12.09.2025 (Art. 50 UAbs. 2)","querverweise":"Art. 4 Abs. 9; Art. 37 Abs. 6 Buchst. c; Art. 49 Abs. 1 Buchst. f (Evaluierung)","erwaegungsgruende":"31","auslegungsunsicherheit":"ja – 'schwerer wirtschaftlicher Schaden' (EG 31: schwere irreparable Verluste) ist wertungsoffen","hinweis":"","erwaegungsgruende_liste":["31"],"querverweise_liste":["Art. 4 Abs. 9","Art. 37 Abs. 6 Buchst. c","Art. 49 Abs. 1 Buchst. f (Evaluierung)"],"anforderung_begriffe":[{"start":43,"laenge":12,"begriff":"Dateninhaber"},{"start":155,"laenge":7,"begriff":"Nutzer"}],"ausnahmen_begriffe":[{"start":26,"laenge":12,"begriff":"Dateninhaber"}],"stichtage":["FR-04"],"stichtag_quelle":"Alle Anforderungen ohne abweichende Angabe","handlungsfristen":["FR-12","FR-25"]},{"req_id":"DA-II-014","kapitel":"II","fundstelle":"Art. 4 Abs. 9","adressat":"Nutzer","typ":"Recht","anforderung":"Der Nutzer kann Ablehnung, Verweigerung oder Aussetzung nach Abs. 7 und 8 durch Beschwerde bei der zuständigen Behörde (die unverzüglich über Beginn/Wiederaufnahme der Weitergabe entscheidet) oder durch einvernehmliche Anrufung einer Streitbeilegungsstelle anfechten – unbeschadet des Rechtswegs.","ausloeser":"Ablehnung/Aussetzung nach Abs. 7/8","ausnahmen":"—","geltungsbeginn":"12.09.2025 (Art. 50 UAbs. 2)","querverweise":"Art. 10 Abs. 1; Art. 37 Abs. 5 Buchst. b","erwaegungsgruende":"31","auslegungsunsicherheit":"nein","hinweis":"","erwaegungsgruende_liste":["31"],"querverweise_liste":["Art. 10 Abs. 1","Art. 37 Abs. 5 Buchst. b"],"anforderung_begriffe":[{"start":4,"laenge":6,"begriff":"Nutzer"}],"stichtage":["FR-04"],"stichtag_quelle":"Alle Anforderungen ohne abweichende Angabe","hand ende":"—","auslegungsunsicherheit":"nein","hinweis":"","erwaegungsgruende_liste":[],"querverweise_liste":["Art. 5 Abs. 5","Art. 11 Abs. 3 Buchst. a, Abs. 4"],"anforderung_begriffe":[{"start":4,"laenge":6,"begriff":"Nutzer"},{"start":100,"laenge":13,"begriff":"Dateninhaber"}],"stichtage":["FR-04"],"stichtag_quelle":"Alle Anforderungen ohne abweichende Angabe","handlungsfristen":["FR-12"]},{"req_id":"DA-II-017","kapitel":"II","fundstelle":"Art. 4 Abs. 12","adressat":"Dateninhaber","typ":"Unterlassungspflicht","anforderung":"Ist der Nutzer nicht die betroffene Person, darf der Dateninhaber personenbezogene Daten dem Nutzer nur bereitstellen, wenn eine Rechtsgrundlage nach Art. 6 DSGVO besteht und ggf. Art. 9 DSGVO und Art. 5 Abs. 3 RL 2002/58/EG erfüllt sind.","ausloeser":"Verlangen personenbezogener Daten Dritter durch einen Nutzer, der nicht betroffene Person ist","ausnahmen":"—","geltungsbeginn":"12.09.2025 (Art. 50 UAbs. 2)","querverweise":"DSGVO Art. 6, 9, 26; RL 2002/58/EG Art. 5 Abs. 3","erwaegungsgruende":"7, 34, 36","auslegungsunsicherheit":"ja – EG 34: Unternehmensnutzer gilt als Verantwortlicher; Alternativen (Anonymisierung, Beschränkung auf Nutzerdaten) nur in EG 7 angedeutet","hinweis":"","erwaegungsgruende_liste":["7","34","36"],"querverweise_liste":["DSGVO Art. 6, 9, 26","RL 2002/58/EG Art. 5 Abs. 3"],"anforderung_begriffe":[{"start":8,"laenge":6,"begriff":"Nutzer"},{"start":25,"laenge":17,"begriff":"Betroffene Person"},{"start":53,"laenge":12,"begriff":"Dateninhaber"},{"start":66,"laenge":22,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}],"ausloeser_begriffe":[{"start":10,"laenge":23,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":54,"laenge":6,"begriff":"Nutzer"},{"start":72,"laenge":17,"begriff":"Betroffene Person"}],"stichtage":["FR-04"],"stichtag_quelle":"Alle Anforderungen ohne abweichende Angabe","handlungsfristen":["FR-12"]},{"req_id":"DA-II-018","kapitel":"II","fundstelle":"Art. 4 Abs. 13 Satz 1", rung einer Vereinbarung.","fundstelle":"Art. 1 Abs. 3 Buchst. g (Kapitel I)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":13,"laenge":25,"begriff":"Teilnehmer an Datenräumen / gemeinsame europäische Datenräume"}]},{"req_id":"DA-I-006","kurztitel":"Art. 1 Abs. 4 – Ausnahme (Alle Adressaten von Kapitel II)","beschreibung":"Bezugnahmen auf vernetzte Produkte oder verbundene Dienste schließen virtuelle Assistenten ein, soweit diese mit einem vernetzten Produkt oder verbundenen Dienst interagieren.","fundstelle":"Art. 1 Abs. 4 (Kapitel I)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":16,"laenge":18,"begriff":"Vernetztes Produkt"},{"start":40,"laenge":18,"begriff":"Verbundener Dienst"},{"start":69,"laenge":21,"begriff":"Virtuelle Assistenten"}]},{"req_id":"DA-I-007","kurztitel":"Art. 1 Abs. 5 – Ausnahme (Alle Adressaten)","beschreibung":"Die Verordnung lässt das Datenschutzrecht (DSGVO, VO 2018/1725, RL 2002/58/EG) unberührt; bei Widerspruch geht das Datenschutzrecht vor. Die Rechte nach Kapitel II ergänzen Art. 15 und 20 DSGVO.","fundstelle":"Art. 1 Abs. 5 (Kapitel I)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-II-001","kurztitel":"Datenzugang ab Werk (Access by Design)","beschreibung":"Vernetzte Produkte sind so zu konzipieren und herzustellen und verbundene Dienste so zu konzipieren und zu erbringen, dass Produktdaten und verbundene Dienstdaten (inkl. erforderlicher Metadaten) für den Nutzer standardmäßig einfach, sicher, unentgeltlich, in einem umfassenden, strukturierten, gängigen und maschinenlesbaren Format und – soweit relevant und technisch durchführbar – direkt zugänglich sind ('access by design').","fundstelle":"Art. 3 Abs. 1 (Kapitel II)","ab_wann":"Gilt für vernetzte Produkte und damit verbundene Dienste, die nach dem 12.09.2026 in Verkehr gebracht werden (Art. 50 UAbs. 3)","naechste_schritte":"Neue Produktgenerationen und zugehörige Dienste so gestalten, dass Nutzer standardmäßig einfach, sicher und kostenlos an ihre Daten kommen; Datenmodell und Schnittstellen dokumentieren. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":0,"laenge":18,"begriff":"Vernetztes Produkt"},{"start":63,"laenge":18,"begriff":"Verbundener Dienst"},{"start":123,"laenge":12,"begriff":"Produktdaten"},{"start":140,"laenge":22,"begriff":"Verbundene Dienstdaten"},{"start":185,"laenge":9,"begriff":"Metadaten"},{"start":204,"laenge":6,"begriff":"Nutzer"}],"naechste_schritte_begriffe":[{"start":67,"laenge":6,"begriff":"Nutzer"},{"start":126,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-II-002","kurztitel":"Vorvertragliche Produktinformation","beschreibung":"Vor Abschluss eines Kauf-, Miet- oder Leasingvertrags sind dem Nutzer klar und verständlich mindestens Informationen bereitzustellen über: (a) Art, Format und geschätzten Umfang der Produktdaten, (b) Fähigkeit zur kontinuierlichen Echtzeit-Datengenerierung, (c) Speicherung auf Gerät/Server inkl. Speicherdauer, (d) Zugangs-, Abruf- und Löschmöglichkeiten inkl. technischer Mittel, Nutzungsbedingungen und Dienstqualität.","fundstelle":"Art. 3 Abs. 2 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Produktdatenblatt/Website mit Art, Format, Umfang, Echtzeitfähigkeit, Speicherort/-dauer und Zugangsweg der Daten erstellen; Vertriebspartner (Händler, Leasinggeber) mit den Informationen ausstatten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":63,"laenge":6,"begriff":"Nutzer"},{"start":182,"laenge":12,"begriff":"Produktdaten"}],"naechste_schritte_begriffe":[{"start":108,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-II-003","kurztitel":"Vorvertragliche Information zum verbundenen Dienst","beschreibung":"Vor Abschluss eines Vertrags über einen verbundenen Dienst sind dem Nutzer klar und verständlich mindestens Informationen bereitzustellen über: (a) Art, Umfang, Häufigkeit der Erhebung der Produktdaten und Zugangsmodalitäten inkl. Speicherung/Aufbewahrungsdauer, (b) Art, Umfang der verbundenen Dienstdaten und Zugangsmodalitäten, (c) beabsichtigte Eigennutzung und Zwecke sowie Weitergabe an Dritte, (d) Identität des Dateninhabers und anderer Verarbeitungsparteien, (e) Kommunikationsmittel, (f) Weg zur Beantragung/Beendigung der Weitergabe an Dritte, (g) Beschwerderecht bei der zuständigen Behörde nach Art. 37, (h) Geschäftsgeheimnis-Inhaberschaft, (i) Vertragsdauer und vorzeitige Beendigung.","fundstelle":"Art. 3 Abs. 3 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Informationstext zu Datenarten, Eigennutzung, Weitergabe, Identität, Kontakt, Beschwerderecht und Vertragsdauer in den Bestellprozess/AGB integrieren.","beschreibung_begriffe":[{"start":40,"laenge":18,"begriff":"Verbundener Dienst"},{"start":68,"laenge":6,"begriff":"Nutzer"},{"start":189,"laenge":12,"begriff":"Produktdaten"},{"start":283,"laenge":23,"begriff":"Verbundene Dienstdaten"},{"start":419,"laenge":13,"begriff":"Dateninhaber"},{"start":621,"laenge":18,"begriff":"Geschäftsgeheimnis / Inhaber eines Geschäftsgeheimnisses"}]},{"req_id":"DA-II-004","kurztitel":"Datenbereitstellung an den Nutzer","beschreibung":"Kann der Nutzer nicht direkt vom Produkt/Dienst auf die Daten zugreifen, stellt der Dateninhaber dem Nutzer ohne Weiteres verfügbare Daten inkl. erforderlicher Metadaten auf einfaches elektronisches Verlangen unverzüglich, einfach, sicher, unentgeltlich, in umfassendem, gängigem und maschinenlesbarem Format und – falls relevant und technisch durchführbar – in gleicher Qualität wie für den Dateninhaber, kontinuierlich und in Echtzeit bereit.","fundstelle":"Art. 4 Abs. 1 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Self-Service-Zugang (Nutzerkonto, API, Export) einrichten, der Anfragen automatisch ohne Freigabe erfüllt; Metadaten mitliefern; Antwortzeiten definieren. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":9,"laenge":6,"begriff":"Nutzer"},{"start":56,"laenge":5,"begriff":"Daten"},{"start":84,"laenge":12,"begriff":"Dateninhaber"},{"start":108,"laenge":30,"begriff":"Ohne Weiteres verfügbare Daten"},{"start":160,"laenge":9,"begriff":"Metadaten"}],"naechste_schritte_begriffe":[{"start":107,"laenge":9,"begriff":"Metadaten"}]},{"req_id":"DA-II-005","kurztitel":"Beschränkung aus Sicherheitsgründen","beschreibung":"Nutzer und Dateninhaber können Zugang, Nutzung oder erneute Weitergabe vertraglich beschränken, wenn die Verarbeitung Sicherheitsanforderungen des Produkts nach Unions-/nationalem Recht beeinträchtigen und zu schwerwiegenden Auswirkungen auf Gesundheit oder Sicherheit natürlicher Personen führen könnte.","fundstelle":"Art. 4 Abs. 2 Satz 1 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Sicherheitskritische Datenkategorien identifizieren und nur diese vertraglich beschränken; Begründung dokumentieren. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":0,"laenge":6,"begriff":"Nutzer"},{"start":11,"laenge":12,"begriff":"Dateninhaber"},{"start":105,"laenge":12,"begriff":"Verarbeitung"}]},{"req_id":"DA-II-006","kurztitel":"Meldung sicherheitsbedingter Verweigerung","beschreibung":"Verweigert der Dateninhaber die Datenweitergabe aus Sicherheitsgründen nach Abs. 2, teilt er dies der zuständigen Behörde nach Art. 37 mit.","fundstelle":"Art. 4 Abs. 2 Satz 3 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Meldeprozess an die zuständige Behörde einrichten.","beschreibung_begriffe":[{"start":15,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-007","kurztitel":"Art. 4 Abs. 3 – Recht (Nutzer)","beschreibung":"Bei Streit über vertragliche Beschränkungen nach Abs. 2 kann der Nutzer Beschwerde bei der zuständigen Behörde einlegen oder mit dem Dateninhaber vereinbaren, eine Streitbeilegungsstelle nach Art. 10 anzurufen – unbeschadet des Rechtswegs.","fundstelle":"Art. 4 Abs. 3 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen.","beschreibung_begriffe":[{"start":65,"laenge":6,"begriff":"Nutzer"},{"start":133,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-008","kurztitel":"Keine Dark Patterns","beschreibung":"Der Dateninhaber darf die Ausübung der Nutzerrechte nicht unangemessen erschweren, insbesondere nicht durch nicht-neutrale Wahlmöglichkeiten oder durch Gestaltung der Benutzerschnittstelle, die Autonomie und Entscheidungsfreiheit des Nutzers untergräbt (Verbot von 'Dark Patterns').","fundstelle":"Art. 4 Abs. 4 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Zugangs- und Berechtigungsdialoge neutral gestalten; UX-Review durchführen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":234,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-II-009","kurztitel":"Sparsame Nutzeridentifizierung","beschreibung":"Zur Überprüfung der Nutzereigenschaft darf der Dateninhaber keine über das erforderliche Maß hinausgehenden Informationen verlangen.","fundstelle":"Art. 4 Abs. 5 Satz 1 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Identitätsprüfung auf das Nötige beschränken (z. B. Nutzerkonto, Seriennummer).","beschreibung_begriffe":[{"start":47,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-010","kurztitel":"Keine übermäßigen Zugriffsprotokolle","beschreibung":"Der Dateninhaber darf keine Informationen über den Datenzugang des Nutzers (insb. Protokolldaten) aufbewahren, die über das für die Ausführung des Verlangens und die Sicherheit/Pflege der Dateninfrastruktur Erforderliche hinausgehen.","fundstelle":"Art. 4 Abs. 5 Satz 2 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Log-Konzept: nur Sicherheits- und Betriebsprotokolle, Löschfristen festlegen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":67,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-II-011","kurztitel":"Geschäftsgeheimnisse kennzeichnen und schützen","beschreibung":"Geschäftsgeheimnisse werden nur offengelegt, wenn Dateninhaber und Nutzer vorher alle erforderlichen Maßnahmen zur Wahrung der Vertraulichkeit getroffen haben. Der Dateninhaber (oder der Geschäftsgeheimnisinhaber) ermittelt die geschützten Daten – auch in den Metadaten – und vereinbart mit dem Nutzer angemessene technische und organisatorische Maßnahmen (z. B. Mustervertragsklauseln, NDAs, Zugangsprotokolle, Normen, Verhaltenskodizes).","fundstelle":"Art. 4 Abs. 6 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Geschäftsgeheimnis-Inventar anlegen, in Metadaten markieren; Standard-Vertraulichkeitsvereinbarung und Zugangsprotokolle vorbereiten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":50,"laenge":12,"begriff":"Dateninhaber"},{"start":67,"laenge":6,"begriff":"Nutzer"},{"start":240,"laenge":5,"begriff":"Daten"},{"start":260,"laenge":9,"begriff":"Metadaten"}],"naechste_schritte_begriffe":[{"start":0,"laenge":18,"begriff":"Geschäftsgeheimnis / Inhaber eines Geschäftsgeheimnisses"},{"start":40,"laenge":9,"begriff":"Metadaten"}]},{"req_id":"DA-II-012","kurztitel":"Aussetzung bei fehlendem Geheimnisschutz","beschreibung":"Kommt keine Einigung über die Schutzmaßnahmen zustande, setzt der Nutzer vereinbarte Maßnahmen nicht um oder wird die Vertraulichkeit verletzt, kann der Dateninhaber die Weitergabe der als Geschäftsgeheimnis eingestuften Daten verweigern oder aussetzen. Die Entscheidung ist zu begründen und dem Nutzer unverzüglich schriftlich mitzuteilen; die zuständige Behörde ist unter Angabe der nicht vereinbarten/umgesetzten Maßnahmen und der betroffenen Geschäftsgeheimnisse zu unterrichten.","fundstelle":"Art. 4 Abs. 7 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Entscheidungs- und Begründungsvorlage; Meldeprozess an Behörde.","beschreibung_begriffe":[{"start":66,"laenge":6,"begriff":"Nutzer"},{"start":153,"laenge":12,"begriff":"Dateninhaber"},{"start":189,"laenge":18,"begriff":"Geschäftsgeheimnis / Inhaber eines Geschäftsgeheimnisses"},{"start":221,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-II-013","kurztitel":"Ablehnung bei schwerem wirtschaftlichem Schaden","beschreibung":"Unter außergewöhnlichen Umständen kann der Dateninhaber ein Zugangsverlangen im Einzelfall ablehnen, wenn er nachweist, dass trotz der Schutzmaßnahmen des Nutzers mit hoher Wahrscheinlichkeit ein schwerer wirtschaftlicher Schaden durch Offenlegung droht. Nachweis auf Basis objektiver Fakten (Durchsetzbarkeit in Drittländern, Vertraulichkeitsgrad, Einzigartigkeit/Neuartigkeit des Produkts), schriftlich und unverzüglich gegenüber dem Nutzer; Mitteilung an die zuständige Behörde.","fundstelle":"Art. 4 Abs. 8 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Nur im Ausnahmefall; Nachweis mit objektiven Fakten vorbereiten; Meldung an Behörde. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":43,"laenge":12,"begriff":"Dateninhaber"},{"start":155,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-II-014","kurztitel":"Art. 4 Abs. 9 – Recht (Nutzer)","beschreibung":"Der Nutzer kann Ablehnung, Verweigerung oder Aussetzung nach Abs. 7 und 8 durch Beschwerde bei der zuständigen Behörde (die unverzüglich über Beginn/Wiederaufnahme der Weitergabe entscheidet) oder durch einvernehmliche Anrufung einer Streitbeilegungsstelle anfechten – unbeschadet des Rechtswegs.","fundstelle":"Art. 4 Abs. 9 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen.","beschreibung_begriffe":[{"start":4,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-II-015","kurztitel":"Art. 4 Abs. 10 – Unterlassungspflicht (Nutzer)","beschreibung":"Der Nutzer darf die nach Abs. 1 erlangten Daten nicht zur Entwicklung eines konkurrierenden vernetzten Produkts nutzen, nicht mit dieser Absicht an Dritte weitergeben und nicht nutzen, um Einblicke in wirtschaftliche Lage, Vermögenswerte und Produktionsmethoden des Herstellers/Dateninhabers zu erlangen.","fundstelle":"Art. 4 Abs. 10 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":4,"laenge":6,"begriff":"Nutzer"},{"start":42,"laenge":5,"begriff":"Daten"},{"start":92,"laenge":19,"begriff":"Vernetztes Produkt"},{"start":278,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-016","kurztitel":"Art. 4 Abs. 11 – Unterlassungspflicht (Nutzer)","beschreibung":"Der Nutzer darf keine Zwangsmittel einsetzen oder Lücken in der technischen Schutzinfrastruktur des Dateninhabers ausnutzen, um Datenzugang zu erlangen.","fundstelle":"Art. 4 Abs. 11 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":4,"laenge":6,"begriff":"Nutzer"},{"start":100,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-017","kurztitel":"Personenbezogene Daten Dritter nur mit Rechtsgrundlage","beschreibung":"Ist der Nutzer nicht die betroffene Person, darf der Dateninhaber personenbezogene Daten dem Nutzer nur bereitstellen, wenn eine Rechtsgrundlage nach Art. 6 DSGVO besteht und ggf. Art. 9 DSGVO und Art. 5 Abs. 3 RL 2002/58/EG erfüllt sind.","fundstelle":"Art. 4 Abs. 12 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Datenschutzprüfung: Rechtsgrundlage des Nutzers, Anonymisierung oder Beschränkung auf Nutzerdaten anbieten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":8,"laenge":6,"begriff":"Nutzer"},{"start":25,"laenge":17,"begriff":"Betroffene Person"},{"start":53,"laenge":12,"begriff":"Dateninhaber"},{"start":66,"laenge":22,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}],"naechste_schritte_begriffe":[{"start":40,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-II-018","kurztitel":"Eigennutzung nur mit Vertrag","beschreibung":"Der Dateninhaber darf ohne Weiteres verfügbare nicht-personenbezogene Daten nur auf Grundlage eines Vertrags mit dem Nutzer nutzen.","fundstelle":"Art. 4 Abs. 13 Satz 1 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Datennutzungsklauseln in Kauf-/Dienstverträge aufnehmen; Bestandsverträge nachziehen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":47,"laenge":28,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":117,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-II-019","kurztitel":"Kein Ausspähen des Nutzers","beschreibung":"Der Dateninhaber darf solche Daten nicht verwenden, um Einblicke in wirtschaftliche Lage, Vermögenswerte, Produktionsmethoden oder Nutzung des Nutzers zu erlangen, die dessen gewerbliche Position auf seinen Märkten untergraben könnten.","fundstelle":"Art. 4 Abs. 13 Satz 2 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Nutzungsrichtlinie: keine Auswertung zur Wettbewerbsposition des Nutzers.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":29,"laenge":5,"begriff":"Daten"},{"start":143,"laenge":7,"begriff":"Nutzer"}],"naechste_schritte_begriffe":[{"start":73,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-II-020","kurztitel":"Keine Weitergabe an Dritte außerhalb des Nutzervertrags","beschreibung":"Der Dateninhaber darf nicht-personenbezogene Produktdaten Dritten nur zur Erfüllung seines Vertrags mit dem Nutzer bereitstellen; ggf. sind Dritte vertraglich zur Nicht-Weitergabe zu verpflichten.","fundstelle":"Art. 4 Abs. 14 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Weitergabeprozesse prüfen; Weitergabeverbot in Drittverträgen verankern. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":45,"laenge":12,"begriff":"Produktdaten"},{"start":108,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-II-021","kurztitel":"Weitergabe an vom Nutzer benannte Dritte","beschreibung":"Auf Verlangen des Nutzers (oder einer für ihn handelnden Partei) stellt der Dateninhaber einem Dritten ohne Weiteres verfügbare Daten inkl. Metadaten unverzüglich, für den Nutzer unentgeltlich, in derselben Qualität wie für sich selbst, einfach, sicher, in umfassendem, strukturiertem, gängigem und maschinenlesbarem Format und – soweit relevant und technisch durchführbar – kontinuierlich und in Echtzeit bereit; die Bereitstellung an den Dritten erfolgt nach Art. 8 und 9.","fundstelle":"Art. 5 Abs. 1 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Prozess zur Freigabe und technischen Anbindung Dritter (API, Datenformate) einrichten; Bedingungen nach Art. 8/9 vorbereiten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":18,"laenge":7,"begriff":"Nutzer"},{"start":76,"laenge":12,"begriff":"Dateninhaber"},{"start":103,"laenge":30,"begriff":"Ohne Weiteres verfügbare Daten"},{"start":140,"laenge":9,"begriff":"Metadaten"}]},{"req_id":"DA-II-022","kurztitel":"Keine Weitergabepflicht für Testdaten","beschreibung":"Die Weitergabepflicht nach Abs. 1 gilt nicht für ohne Weiteres verfügbare Daten aus der Prüfung neuer, noch nicht in Verkehr gebrachter Produkte, Stoffe oder Verfahren, sofern die Verwendung durch Dritte nicht vertraglich genehmigt ist.","fundstelle":"Art. 5 Abs. 2 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Testdaten vor Inverkehrbringen klassifizieren.","beschreibung_begriffe":[{"start":49,"laenge":30,"begriff":"Ohne Weiteres verfügbare Daten"}],"naechste_schritte_begriffe":[{"start":14,"laenge":16,"begriff":"Bereitstellung auf dem Markt / Inverkehrbringen"}]},{"req_id":"DA-II-023","kurztitel":"Torwächter ausgeschlossen","beschreibung":"Ein als Torwächter benanntes Unternehmen ist kein zugelassener Dritter und darf Nutzer weder zur Bereitstellung nach Art. 4-Daten für seine Dienste auffordern/anreizen, noch zur Beantragung einer Weitergabe nach Art. 5 Abs. 1 bewegen, noch solche Daten von Nutzern erhalten.","fundstelle":"Art. 5 Abs. 3 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Prüfen, ob benannte Dritte Torwächter sind; Weitergabe verweigern.","beschreibung_begriffe":[{"start":8,"laenge":10,"begriff":"Torwächter"},{"start":29,"laenge":11,"begriff":"Unternehmen"},{"start":80,"laenge":6,"begriff":"Nutzer"},{"start":124,"laenge":5,"begriff":"Daten"}],"naechste_schritte_begriffe":[{"start":27,"laenge":10,"begriff":"Torwächter"}]},{"req_id":"DA-II-024","kurztitel":"Art. 5 Abs. 4 – Unterlassungspflicht (Dateninhaber)","beschreibung":"Zur Prüfung der Nutzer-/Dritteigenschaft dürfen keine über das erforderliche Maß hinausgehenden Informationen verlangt werden; der Dateninhaber darf keine über Ausführung und Sicherheit hinausgehenden Informationen über den Zugang des Dritten aufbewahren.","fundstelle":"Art. 5 Abs. 4 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":16,"laenge":6,"begriff":"Nutzer"},{"start":131,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-025","kurztitel":"Art. 5 Abs. 5 – Unterlassungspflicht (Dritter)","beschreibung":"Der Dritte darf keine Zwangsmittel verwenden oder Lücken in der Schutzinfrastruktur des Dateninhabers ausnutzen, um Datenzugang zu erlangen.","fundstelle":"Art. 5 Abs. 5 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":88,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-026","kurztitel":"Kein Ausspähen des Dritten","beschreibung":"Der Dateninhaber darf ohne Weiteres verfügbare Daten nicht nutzen, um Einblicke in wirtschaftliche Lage, Vermögenswerte, Produktionsmethoden oder Nutzung des Dritten zu erlangen, die dessen gewerbliche Position untergraben könnten – es sei denn, der Dritte hat dies genehmigt und kann die Genehmigung jederzeit einfach widerrufen.","fundstelle":"Art. 5 Abs. 6 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Nutzungsrichtlinie erweitern.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":22,"laenge":30,"begriff":"Ohne Weiteres verfügbare Daten"}]},{"req_id":"DA-II-027","kurztitel":"Personenbezogene Daten an Dritte nur mit Rechtsgrundlage","beschreibung":"Ist der Nutzer nicht die betroffene Person, dürfen personenbezogene Daten dem Dritten nur bei Rechtsgrundlage nach Art. 6 DSGVO und ggf. Erfüllung von Art. 9 DSGVO und Art. 5 Abs. 3 RL 2002/58/EG bereitgestellt werden.","fundstelle":"Art. 5 Abs. 7 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Datenschutzprüfung vor Weitergabe.","beschreibung_begriffe":[{"start":8,"laenge":6,"begriff":"Nutzer"},{"start":25,"laenge":17,"begriff":"Betroffene Person"},{"start":51,"laenge":22,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}]},{"req_id":"DA-II-028","kurztitel":"Art. 5 Abs. 8 – Unterlassungspflicht (Dateninhaber)","beschreibung":"Die Ausübung der Rechte betroffener Personen nach der DSGVO, insb. der Datenübertragbarkeit (Art. 20 DSGVO), darf durch Versäumnisse des Dateninhabers oder Dritten bei Übermittlungsvorkehrungen nicht behindert werden.","fundstelle":"Art. 5 Abs. 8 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":24,"laenge":20,"begriff":"Betroffene Person"},{"start":137,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-029","kurztitel":"Geschäftsgeheimnisse gegenüber Dritten","beschreibung":"Geschäftsgeheimnisse werden Dritten nur offengelegt, soweit dies für den mit dem Nutzer vereinbarten Zweck unbedingt erforderlich ist. Der Dateninhaber/Geschäftsgeheimnisinhaber ermittelt die geschützten Daten (auch in Metadaten) und vereinbart mit dem Dritten alle angemessenen technischen und organisatorischen Schutzmaßnahmen.","fundstelle":"Art. 5 Abs. 9 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Schutzmaßnahmen mit dem Dritten vereinbaren; Offenlegung auf das Nötige begrenzen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":81,"laenge":6,"begriff":"Nutzer"},{"start":139,"laenge":12,"begriff":"Dateninhaber"},{"start":204,"laenge":5,"begriff":"Daten"},{"start":219,"laenge":9,"begriff":"Metadaten"}]},{"req_id":"DA-II-030","kurztitel":"Aussetzung gegenüber Drittem","beschreibung":"Bei fehlender Einigung, Nichtumsetzung der Maßnahmen durch den Dritten oder Vertraulichkeitsverletzung kann der Dateninhaber die Weitergabe der Geschäftsgeheimnisdaten verweigern/aussetzen; begründete schriftliche Mitteilung an den Dritten unverzüglich; Unterrichtung der zuständigen Behörde mit Angabe der Maßnahmen und betroffenen Geschäftsgeheimnisse.","fundstelle":"Art. 5 Abs. 10 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Begründungs- und Meldevorlage.","beschreibung_begriffe":[{"start":112,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-031","kurztitel":"Ablehnung gegenüber Drittem bei schwerem Schaden","beschreibung":"Unter außergewöhnlichen Umständen kann der Dateninhaber das Drittzugangsverlangen im Einzelfall ablehnen, wenn er einen mit hoher Wahrscheinlichkeit drohenden schweren wirtschaftlichen Schaden auf Basis objektiver Fakten nachweist; schriftliche Begründung gegenüber dem Dritten und Mitteilung an die zuständige Behörde.","fundstelle":"Art. 5 Abs. 11 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Nur Ausnahmefall; Nachweis und Meldung. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":43,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-032","kurztitel":"Art. 5 Abs. 12 – Recht (Dritter)","beschreibung":"Der Dritte kann Entscheidungen nach Abs. 10 und 11 durch Beschwerde bei der zuständigen Behörde oder einvernehmliche Anrufung einer Streitbeilegungsstelle anfechten – unbeschadet des Rechtswegs.","fundstelle":"Art. 5 Abs. 12 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen."},{"req_id":"DA-II-033","kurztitel":"Art. 5 Abs. 13 – Ausnahme (Dateninhaber)","beschreibung":"Das Weitergaberecht nach Abs. 1 darf die Rechte betroffener Personen nach Datenschutzrecht nicht beeinträchtigen.","fundstelle":"Art. 5 Abs. 13 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":48,"laenge":20,"begriff":"Betroffene Person"}]},{"req_id":"DA-II-034","kurztitel":"Zweckbindung beim Datenempfang","beschreibung":"Der Dritte verarbeitet die nach Art. 5 erhaltenen Daten nur zu den mit dem Nutzer vereinbarten Zwecken und Bedingungen und im Einklang mit dem Datenschutzrecht.","fundstelle":"Art. 6 Abs. 1 Satz 1 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Vertrag mit dem Nutzer über Zwecke und Bedingungen schließen.","beschreibung_begriffe":[{"start":50,"laenge":5,"begriff":"Daten"},{"start":75,"laenge":6,"begriff":"Nutzer"}],"naechste_schritte_begriffe":[{"start":16,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-II-035","kurztitel":"Löschung nach Zweckerreichung","beschreibung":"Der Dritte löscht die Daten, sobald sie für den vereinbarten Zweck nicht mehr benötigt werden, sofern für nicht-personenbezogene Daten mit dem Nutzer nichts anderes vereinbart wurde.","fundstelle":"Art. 6 Abs. 1 Satz 2 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Löschkonzept mit Fristen implementieren.","beschreibung_begriffe":[{"start":22,"laenge":5,"begriff":"Daten"},{"start":106,"laenge":28,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":143,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-II-036","kurztitel":"Keine Manipulation der Nutzer","beschreibung":"Der Dritte darf die Ausübung der Nutzerrechte nach Art. 5 und 6 nicht übermäßig erschweren, Nutzer nicht zwingen, täuschen oder manipulieren oder deren Autonomie über die Benutzerschnittstelle untergraben.","fundstelle":"Art. 6 Abs. 2 Buchst. a (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Neutrale Einwilligungs- und Wahldialoge.","beschreibung_begriffe":[{"start":92,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-II-037","kurztitel":"Kein Profiling","beschreibung":"Der Dritte darf die erhaltenen Daten nicht für Profiling nutzen, es sei denn, dies ist zur Erbringung des vom Nutzer gewünschten Dienstes erforderlich (unbeschadet Art. 22 Abs. 2 Buchst. a und c DSGVO).","fundstelle":"Art. 6 Abs. 2 Buchst. b (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Profiling nur, wenn für den bestellten Dienst nötig; dokumentieren.","beschreibung_begriffe":[{"start":31,"laenge":5,"begriff":"Daten"},{"start":47,"laenge":9,"begriff":"Profiling"},{"start":110,"laenge":6,"begriff":"Nutzer"}],"naechste_schritte_begriffe":[{"start":0,"laenge":9,"begriff":"Profiling"}]},{"req_id":"DA-II-038","kurztitel":"Weitergabe nur mit Nutzervertrag","beschreibung":"Der Dritte darf die Daten keinem anderen Dritten bereitstellen, es sei denn auf Grundlage eines Vertrags mit dem Nutzer und unter Übernahme aller mit dem Dateninhaber vereinbarten Geschäftsgeheimnisschutzmaßnahmen durch den anderen Dritten.","fundstelle":"Art. 6 Abs. 2 Buchst. c (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Vertragliche Zustimmung des Nutzers und Schutzmaßnahmen beim Empfänger sicherstellen.","beschreibung_begriffe":[{"start":20,"laenge":5,"begriff":"Daten"},{"start":113,"laenge":6,"begriff":"Nutzer"},{"start":154,"laenge":12,"begriff":"Dateninhaber"}],"naechste_schritte_begriffe":[{"start":28,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-II-039","kurztitel":"Keine Weitergabe an Torwächter","beschreibung":"Der Dritte darf die erhaltenen Daten keinem DMA-Torwächter bereitstellen.","fundstelle":"Art. 6 Abs. 2 Buchst. d (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Empfängerliste gegen DMA-Torwächter prüfen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":31,"laenge":5,"begriff":"Daten"},{"start":48,"laenge":10,"begriff":"Torwächter"}],"naechste_schritte_begriffe":[{"start":25,"laenge":10,"begriff":"Torwächter"}]},{"req_id":"DA-II-040","kurztitel":"Kein Konkurrenzprodukt aus fremden Daten","beschreibung":"Der Dritte darf die Daten nicht zur Entwicklung eines konkurrierenden vernetzten Produkts nutzen oder dafür weitergeben und darf nicht-personenbezogene Produkt-/Dienstdaten nicht nutzen, um Einblicke in wirtschaftliche Lage, Vermögenswerte, Produktionsmethoden oder Nutzung des Dateninhabers zu gewinnen.","fundstelle":"Art. 6 Abs. 2 Buchst. e (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Nutzungsrichtlinie; Produktentwicklung von Datenempfang trennen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":20,"laenge":5,"begriff":"Daten"},{"start":70,"laenge":19,"begriff":"Vernetztes Produkt"},{"start":278,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-II-041","kurztitel":"Art. 6 Abs. 2 Buchst. f – Unterlassungspflicht (Dritter)","beschreibung":"Der Dritte darf die Daten nicht in einer Weise verwenden, die die Sicherheit des vernetzten Produkts oder verbundenen Dienstes beeinträchtigt.","fundstelle":"Art. 6 Abs. 2 Buchst. f (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":20,"laenge":5,"begriff":"Daten"},{"start":81,"laenge":19,"begriff":"Vernetztes Produkt"},{"start":106,"laenge":20,"begriff":"Verbundener Dienst"}]},{"req_id":"DA-II-042","kurztitel":"Art. 6 Abs. 2 Buchst. g – Unterlassungspflicht (Dritter)","beschreibung":"Der Dritte darf die nach Art. 5 Abs. 9 vereinbarten Maßnahmen nicht missachten und die Vertraulichkeit von Geschäftsgeheimnissen nicht untergraben.","fundstelle":"Art. 6 Abs. 2 Buchst. g (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren."},{"req_id":"DA-II-043","kurztitel":"Art. 6 Abs. 2 Buchst. h – Unterlassungspflicht (Dritter)","beschreibung":"Der Dritte darf einen Verbraucher-Nutzer nicht – auch nicht vertraglich – daran hindern, die erhaltenen Daten anderen Parteien bereitzustellen.","fundstelle":"Art. 6 Abs. 2 Buchst. h (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":22,"laenge":11,"begriff":"Verbraucher"},{"start":34,"laenge":6,"begriff":"Nutzer"},{"start":104,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-II-044","kurztitel":"KMU-Ausnahme","beschreibung":"Die Pflichten nach Kapitel II gelten nicht für Daten aus vernetzten Produkten/verbundenen Diensten, die von Kleinst- oder Kleinunternehmen hergestellt, konzipiert oder erbracht werden – sofern kein Partner-/verbundenes Unternehmen existiert, das nicht Kleinst-/Kleinunternehmen ist, und keine Unterauftragnehmerstellung vorliegt.","fundstelle":"Art. 7 Abs. 1 UAbs. 1 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Eigenständigkeit (keine größeren Partner-/verbundenen Unternehmen, kein Unterauftrag) dokumentieren; jährlich prüfen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":47,"laenge":5,"begriff":"Daten"},{"start":57,"laenge":20,"begriff":"Vernetztes Produkt"},{"start":78,"laenge":20,"begriff":"Verbundener Dienst"},{"start":122,"laenge":16,"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)"},{"start":219,"laenge":11,"begriff":"Unternehmen"}],"naechste_schritte_begriffe":[{"start":54,"laenge":11,"begriff":"Unternehmen"}]},{"req_id":"DA-II-045","kurztitel":"Schonfrist für mittlere Unternehmen","beschreibung":"Die Pflichten gelten ebenfalls nicht für Daten aus Produkten/Diensten eines Unternehmens, das seit weniger als einem Jahr als mittleres Unternehmen eingestuft ist, sowie für vernetzte Produkte für ein Jahr nach ihrem Inverkehrbringen durch ein mittleres Unternehmen.","fundstelle":"Art. 7 Abs. 1 UAbs. 2 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Ablaufdatum der Schonfrist je Produkt/Unternehmen notieren; Umsetzung bis dahin vorbereiten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":41,"laenge":5,"begriff":"Daten"},{"start":76,"laenge":12,"begriff":"Unternehmen"},{"start":174,"laenge":18,"begriff":"Vernetztes Produkt"},{"start":217,"laenge":16,"begriff":"Bereitstellung auf dem Markt / Inverkehrbringen"}],"naechste_schritte_begriffe":[{"start":38,"laenge":11,"begriff":"Unternehmen"}]},{"req_id":"DA-II-046","kurztitel":"Nutzerrechte nicht abdingbar","beschreibung":"Vertragsklauseln, die die Nutzerrechte nach Kapitel II zum Nachteil des Nutzers ausschließen, davon abweichen oder ihre Wirkung abändern, sind für den Nutzer nicht bindend.","fundstelle":"Art. 7 Abs. 2 (Kapitel II)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"AGB/Verträge auf Klauseln prüfen, die Nutzerrechte beschränken.","beschreibung_begriffe":[{"start":72,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-III-001","kurztitel":"Anwendungsbereich Kapitel III","beschreibung":"Kapitel III gilt, wenn ein Dateninhaber im B2B-Verhältnis nach Art. 5 oder nach anderem Unionsrecht bzw. unionsrechtskonformem nationalem Recht verpflichtet ist, einem Datenempfänger Daten bereitzustellen.","fundstelle":"Art. 12 Abs. 1 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Inventar gesetzlicher Bereitstellungspflichten führen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":27,"laenge":12,"begriff":"Dateninhaber"},{"start":168,"laenge":14,"begriff":"Datenempfänger"},{"start":183,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-III-002","kurztitel":"FRAND-Bedingungen","beschreibung":"Der Dateninhaber vereinbart mit dem Datenempfänger die Ausgestaltung der Bereitstellung und stellt die Daten zu fairen, angemessenen und nichtdiskriminierenden Bedingungen (FRAND) und in transparenter Weise im Einklang mit Kapitel III und IV bereit.","fundstelle":"Art. 8 Abs. 1 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Standard-Datenbereitstellungsvertrag mit fairen, angemessenen, nicht diskriminierenden und transparenten Bedingungen erstellen (Mustervertragsklauseln der Kommission nutzen). Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":36,"laenge":14,"begriff":"Datenempfänger"},{"start":103,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-III-003","kurztitel":"Art. 8 Abs. 2 – Ausnahme (Dateninhaber)","beschreibung":"Vertragsklauseln über Datenzugang/-nutzung oder Haftung/Rechtsbehelfe sind nicht bindend, wenn sie missbräuchlich i. S. d. Art. 13 sind oder die Nutzerrechte nach Kapitel II zum Nachteil des Nutzers beschränken.","fundstelle":"Art. 8 Abs. 2 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":191,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-III-004","kurztitel":"Keine Diskriminierung zwischen Empfängern","beschreibung":"Der Dateninhaber darf bei den Bereitstellungsmodalitäten nicht zwischen vergleichbaren Kategorien von Datenempfängern – einschließlich Partner- oder verbundenen Unternehmen – diskriminieren.","fundstelle":"Art. 8 Abs. 3 Satz 1 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Einheitliche Konditionen; Abweichungen objektiv begründen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":102,"laenge":15,"begriff":"Datenempfänger"},{"start":161,"laenge":11,"begriff":"Unternehmen"}]},{"req_id":"DA-III-005","kurztitel":"Nachweis der Nichtdiskriminierung","beschreibung":"Auf begründetes Ersuchen eines Datenempfängers, der Diskriminierung vermutet, stellt der Dateninhaber unverzüglich Informationen bereit, die belegen, dass keine Diskriminierung vorliegt.","fundstelle":"Art. 8 Abs. 3 Satz 2 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Dokumentation der Konditionen vorhalten, um Anfragen kurzfristig beantworten zu können.","beschreibung_begriffe":[{"start":31,"laenge":15,"begriff":"Datenempfänger"},{"start":89,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-III-006","kurztitel":"Art. 8 Abs. 4 – Unterlassungspflicht (Dateninhaber)","beschreibung":"Daten dürfen einem Datenempfänger – auch exklusiv – nur bereitgestellt werden, wenn der Nutzer dies nach Kapitel II verlangt hat.","fundstelle":"Art. 8 Abs. 4 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":0,"laenge":5,"begriff":"Daten"},{"start":19,"laenge":14,"begriff":"Datenempfänger"},{"start":88,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-III-007","kurztitel":"Art. 8 Abs. 5 – Recht (Dateninhaber)","beschreibung":"Beide Parteien müssen keine Informationen herausgeben, die über das zur Überprüfung der Einhaltung vereinbarter Mustervertragsklauseln oder gesetzlicher Pflichten Erforderliche hinausgehen.","fundstelle":"Art. 8 Abs. 5 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen."},{"req_id":"DA-III-008","kurztitel":"Art. 8 Abs. 6 – Ausnahme (Dateninhaber)","beschreibung":"Eine Bereitstellungspflicht verpflichtet nicht zur Offenlegung von Geschäftsgeheimnissen, sofern nicht Unionsrecht (inkl. Art. 4 Abs. 6, Art. 5 Abs. 9) oder nationales Recht etwas anderes vorsieht.","fundstelle":"Art. 8 Abs. 6 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-III-009","kurztitel":"Angemessene Gegenleistung","beschreibung":"Eine vereinbarte Gegenleistung für die B2B-Datenbereitstellung muss diskriminierungsfrei und angemessen sein; sie darf eine Marge enthalten.","fundstelle":"Art. 9 Abs. 1 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Preismodell mit Kostenbasis und ggf. Marge definieren. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-III-010","kurztitel":"Art. 9 Abs. 2, 3 – Handlungspflicht (Dateninhaber)","beschreibung":"Bei der Einigung sind insbesondere zu berücksichtigen: (a) Kosten der Bereitstellung (Formatierung, elektronische Verbreitung, Speicherung), (b) Investitionen in Erhebung/Generierung unter Berücksichtigung von Beiträgen anderer Parteien; die Gegenleistung kann zudem von Umfang, Format und Art der Daten abhängen.","fundstelle":"Art. 9 Abs. 2, 3 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":298,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-III-011","kurztitel":"Kostendeckel für KMU und Forschung","beschreibung":"Ist der Datenempfänger ein KMU oder eine gemeinnützige Forschungseinrichtung ohne nicht-KMU-Partner-/verbundene Unternehmen, darf die Gegenleistung die Bereitstellungskosten nach Abs. 2 Buchst. a nicht übersteigen (keine Marge).","fundstelle":"Art. 9 Abs. 4 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"KMU-Status des Empfängers abfragen; Preis auf Bereitstellungskosten begrenzen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":8,"laenge":14,"begriff":"Datenempfänger"},{"start":112,"laenge":11,"begriff":"Unternehmen"}]},{"req_id":"DA-III-012","kurztitel":"Transparenz der Preisberechnung","beschreibung":"Der Dateninhaber legt dem Datenempfänger die Berechnungsgrundlage der Gegenleistung so detailliert dar, dass dieser die Einhaltung von Abs. 1–4 beurteilen kann.","fundstelle":"Art. 9 Abs. 7 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Kalkulationsblatt offenlegen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":26,"laenge":14,"begriff":"Datenempfänger"}]},{"req_id":"DA-III-013","kurztitel":"Art. 10 Abs. 1 – Recht (Nutzer)","beschreibung":"Zugang zu einer zertifizierten Streitbeilegungsstelle für Streitigkeiten nach Art. 4 Abs. 3 und 9, Art. 5 Abs. 12 sowie über FRAND-Bedingungen und transparente Bereitstellung nach Kapitel III und IV.","fundstelle":"Art. 10 Abs. 1 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen."},{"req_id":"DA-III-015","kurztitel":"Art. 10 Abs. 3 – Handlungspflicht (Dateninhaber)","beschreibung":"Entscheidet die Streitbeilegungsstelle zugunsten des Nutzers/Datenempfängers, trägt der Dateninhaber alle Gebühren und erstattet angemessene Ausgaben; bei Entscheidung zugunsten des Dateninhabers muss der Nutzer/Datenempfänger dessen Kosten nicht erstatten, außer bei offensichtlicher Bösgläubigkeit.","fundstelle":"Art. 10 Abs. 3 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":53,"laenge":7,"begriff":"Nutzer"},{"start":61,"laenge":15,"begriff":"Datenempfänger"},{"start":88,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-III-016","kurztitel":"Art. 10 Abs. 4 – Recht (Kunden)","beschreibung":"Kunden und Anbieter von Datenverarbeitungsdiensten haben Zugang zu einer zugelassenen Streitbeilegungsstelle für Streitigkeiten über Verletzungen der Kundenrechte und Anbieterpflichten nach Art. 23–31.","fundstelle":"Art. 10 Abs. 4 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen.","beschreibung_begriffe":[{"start":0,"laenge":6,"begriff":"Kunde"},{"start":24,"laenge":26,"begriff":"Datenverarbeitungsdienst"}]},{"req_id":"DA-III-018","kurztitel":"Art. 10 Abs. 12, 13 – Recht (Alle Parteien eines Streitbeilegungsverf)","beschreibung":"Entscheidungen sind nur bindend, wenn die Parteien dem vorab ausdrücklich zugestimmt haben; das Recht auf wirksamen gerichtlichen Rechtsbehelf bleibt unberührt.","fundstelle":"Art. 10 Abs. 12, 13 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen."},{"req_id":"DA-III-019","kurztitel":"Technische Schutzmaßnahmen zulässig","beschreibung":"Der Dateninhaber kann geeignete technische Schutzmaßnahmen (inkl. intelligente Verträge, Verschlüsselung) anwenden, um unbefugten Datenzugang zu verhindern und die Einhaltung der Art. 5, 6, 8, 9 sowie vereinbarter Mustervertragsklauseln sicherzustellen.","fundstelle":"Art. 11 Abs. 1 Satz 1 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Schutzmaßnahmen so gestalten, dass sie Nutzer-/Empfängerrechte nicht behindern.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"}],"naechste_schritte_begriffe":[{"start":39,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-III-020","kurztitel":"Art. 11 Abs. 1 Satz 2 – Unterlassungspflicht (Dateninhaber)","beschreibung":"Technische Schutzmaßnahmen dürfen Datenempfänger nicht unterschiedlich behandeln und Nutzer nicht an Kopie, Abruf, Nutzung, Zugang oder Weitergabe an Dritte nach Art. 5 hindern; ebenso nicht Dritte an ihren Rechten nach Unions-/nationalem Recht.","fundstelle":"Art. 11 Abs. 1 Satz 2 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":34,"laenge":14,"begriff":"Datenempfänger"},{"start":85,"laenge":6,"begriff":"Nutzer"}]},{"req_id":"DA-III-021","kurztitel":"Art. 11 Abs. 1 Satz 3 – Unterlassungspflicht (Nutzer)","beschreibung":"Nutzer, Dritte und Datenempfänger dürfen technische Schutzmaßnahmen nur mit Zustimmung des Dateninhabers ändern oder aufheben.","fundstelle":"Art. 11 Abs. 1 Satz 3 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":0,"laenge":6,"begriff":"Nutzer"},{"start":19,"laenge":14,"begriff":"Datenempfänger"},{"start":91,"laenge":13,"begriff":"Dateninhaber"}]},{"req_id":"DA-III-022","kurztitel":"Rechtsfolgen bei Datenmissbrauch","beschreibung":"Bei missbräuchlichem Verhalten (Abs. 3: Täuschung/Zwang/Ausnutzen von Sicherheitslücken, Nutzung zu nicht genehmigten Zwecken inkl. Konkurrenzproduktentwicklung, unrechtmäßige Weitergabe, Nichtaufrechterhaltung der Schutzmaßnahmen nach Art. 5 Abs. 9, unbefugte Änderung technischer Schutzmaßnahmen) hat der Dritte/Datenempfänger auf Aufforderung des Dateninhabers, Geschäftsgeheimnisinhabers oder Nutzers unverzüglich: (a) Daten und Kopien zu löschen, (b) Herstellung/Angebot/Nutzung darauf beruhender Waren, abgeleiteter Daten oder Dienste einzustellen und rechtsverletzende Waren zu vernichten (bei ernsthafter Gefahr erheblichen Schadens und Verhältnismäßigkeit), (c) den Nutzer über die unbefugte Nutzung und Gegenmaßnahmen zu unterrichten, (d) die geschädigte Partei zu entschädigen.","fundstelle":"Art. 11 Abs. 2 i. V. m. Abs. 3 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Incident-Prozess: Löschung, Einstellung, Information, Entschädigung. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":314,"laenge":14,"begriff":"Datenempfänger"},{"start":350,"laenge":13,"begriff":"Dateninhaber"},{"start":397,"laenge":7,"begriff":"Nutzer"},{"start":423,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-III-023","kurztitel":"Art. 11 Abs. 4 – Handlungspflicht (Nutzer)","beschreibung":"Die Rechtsfolgen nach Abs. 2 gelten auch für Nutzer, die technische Schutzmaßnahmen ändern/aufheben oder vereinbarte Geschäftsgeheimnisschutzmaßnahmen nicht aufrechterhalten, sowie für jede Partei, die Daten vom Nutzer unter Verstoß gegen die Verordnung erhält.","fundstelle":"Art. 11 Abs. 4 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":45,"laenge":6,"begriff":"Nutzer"},{"start":202,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-III-024","kurztitel":"Art. 11 Abs. 5 – Recht (Nutzer)","beschreibung":"Bei Verstoß des Datenempfängers gegen Art. 6 Abs. 2 Buchst. a oder b hat der Nutzer dieselben Rechte wie der Dateninhaber nach Abs. 2.","fundstelle":"Art. 11 Abs. 5 (Kapitel III)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":16,"laenge":15,"begriff":"Datenempfänger"},{"start":77,"laenge":6,"begriff":"Nutzer"},{"start":109,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-III-025","kurztitel":"Art. 12 Abs. 2 – Ausnahme (Dateninhaber)","beschreibung":"Klauseln einer Datenweitergabevereinbarung, die die Anwendung von Kapitel III zum Nachteil einer Partei oder des Nutzers ausschließen, davon abweichen oder abändern, sind für diese Partei nicht bindend.","fundstelle":"Art. 12 Abs. 2 (Kapitel III)","ab_wann":"12.09.2025; Kapitel III gilt nur für Datenbereitstellungspflichten nach Unions-/nationalem Recht, die nach dem 12.09.2025 in Kraft treten (Art. 50 UAbs. 4)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":113,"laenge":7,"begriff":"Nutzer"}]},{"req_id":"DA-IV-001","kurztitel":"Missbräuchliche Klauseln unwirksam","beschreibung":"Einseitig auferlegte Vertragsklauseln über Datenzugang/-nutzung oder Haftung/Rechtsbehelfe bei datenbezogenen Pflichten sind für das andere Unternehmen nicht bindend, wenn sie missbräuchlich sind.","fundstelle":"Art. 13 Abs. 1 (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Datenklauseln in AGB/Standardverträgen gegen schwarze/graue Liste prüfen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":140,"laenge":11,"begriff":"Unternehmen"}]},{"req_id":"DA-IV-002","kurztitel":"Art. 13 Abs. 2 – Ausnahme (Verwender von Vertragsklauseln)","beschreibung":"Klauseln, die zwingenden Bestimmungen des Unionsrechts entsprechen oder die bei Fehlen einer Klausel geltenden Unionsrechtsbestimmungen wiedergeben, gelten nicht als missbräuchlich.","fundstelle":"Art. 13 Abs. 2 (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-IV-003","kurztitel":"Art. 13 Abs. 3 – Ausnahme (Verwender von Vertragsklauseln)","beschreibung":"Generalklausel: Eine Klausel ist missbräuchlich, wenn ihre Anwendung eine grobe Abweichung von der guten Geschäftspraxis bei Datenzugang/-nutzung darstellt oder gegen Treu und Glauben verstößt.","fundstelle":"Art. 13 Abs. 3 (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-IV-004","kurztitel":"Art. 13 Abs. 4 Buchst. a – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Stets missbräuchlich (schwarze Liste): Ausschluss oder Beschränkung der Haftung des Klauselverwenders für Vorsatz oder grobe Fahrlässigkeit.","fundstelle":"Art. 13 Abs. 4 Buchst. a (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren."},{"req_id":"DA-IV-005","kurztitel":"Art. 13 Abs. 4 Buchst. b – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Stets missbräuchlich: Ausschluss der Rechtsbehelfe der anderen Partei bei Nichterfüllung oder Ausschluss der Haftung des Verwenders bei Verletzung von Vertragspflichten.","fundstelle":"Art. 13 Abs. 4 Buchst. b (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren."},{"req_id":"DA-IV-006","kurztitel":"Art. 13 Abs. 4 Buchst. c – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Stets missbräuchlich: ausschließliches Recht des Verwenders, über die Vertragsgemäßheit der gelieferten Daten zu bestimmen oder Vertragsklauseln auszulegen.","fundstelle":"Art. 13 Abs. 4 Buchst. c (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":104,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-IV-007","kurztitel":"Art. 13 Abs. 5 Buchst. a – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Vermutet missbräuchlich (graue Liste): unangemessene Beschränkung von Rechtsmitteln/Haftung bei Pflichtverletzung oder Erweiterung der Haftung der anderen Partei.","fundstelle":"Art. 13 Abs. 5 Buchst. a (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren."},{"req_id":"DA-IV-008","kurztitel":"Art. 13 Abs. 5 Buchst. b – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Vermutet missbräuchlich: Zugangs-/Nutzungsrecht des Verwenders an Daten der anderen Partei, das deren berechtigte Interessen erheblich schädigt, insb. bei sensiblen Geschäftsdaten, Geschäftsgeheimnissen oder IP-geschützten Daten.","fundstelle":"Art. 13 Abs. 5 Buchst. b (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":66,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-IV-009","kurztitel":"Art. 13 Abs. 5 Buchst. c – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Vermutet missbräuchlich: Hinderung der anderen Partei, die von ihr bereitgestellten oder generierten Daten angemessen zu nutzen, zu erfassen, darauf zuzugreifen, sie zu kontrollieren oder zu verwerten.","fundstelle":"Art. 13 Abs. 5 Buchst. c (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":101,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-IV-010","kurztitel":"Art. 13 Abs. 5 Buchst. d – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Vermutet missbräuchlich: Hinderung der anderen Partei, die Vereinbarung innerhalb einer angemessenen Frist zu kündigen.","fundstelle":"Art. 13 Abs. 5 Buchst. d (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren."},{"req_id":"DA-IV-011","kurztitel":"Art. 13 Abs. 5 Buchst. e – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Vermutet missbräuchlich: Hinderung der anderen Partei, während der Laufzeit oder in angemessener Frist nach Kündigung eine Kopie der von ihr bereitgestellten/generierten Daten zu erhalten.","fundstelle":"Art. 13 Abs. 5 Buchst. e (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":170,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-IV-012","kurztitel":"Art. 13 Abs. 5 Buchst. f – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Vermutet missbräuchlich: Kündigungsrecht des Verwenders mit unangemessen kurzer Frist – unter Berücksichtigung realistischer Wechselmöglichkeiten der anderen Partei und finanzieller Nachteile – außer bei schwerwiegenden Gründen.","fundstelle":"Art. 13 Abs. 5 Buchst. f (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren."},{"req_id":"DA-IV-013","kurztitel":"Art. 13 Abs. 5 Buchst. g – Unterlassungspflicht (Verwender von Vertragsklauseln)","beschreibung":"Vermutet missbräuchlich: einseitige wesentliche Änderung von Preis oder wesentlichen Bedingungen (Art, Format, Qualität, Menge der Daten) ohne im Vertrag spezifizierte stichhaltige Begründung und ohne Kündigungsrecht der anderen Partei.","fundstelle":"Art. 13 Abs. 5 Buchst. g (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":131,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-IV-014","kurztitel":"Beweislast des Verwenders","beschreibung":"Klauseln gelten als einseitig auferlegt, wenn die andere Partei ihren Inhalt trotz Verhandlungsversuchs nicht beeinflussen konnte; der Verwender trägt die Beweislast für das Gegenteil und kann sich nicht selbst auf die Missbräuchlichkeit berufen.","fundstelle":"Art. 13 Abs. 6 (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Verhandlungsprozesse dokumentieren. Auslegungsunsicherheit: juristische Prüfung empfohlen."},{"req_id":"DA-IV-015","kurztitel":"Art. 13 Abs. 7 – Ausnahme (Vertragsparteien)","beschreibung":"Ist die missbräuchliche Klausel abtrennbar, bleiben die übrigen Vertragsklauseln bindend.","fundstelle":"Art. 13 Abs. 7 (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-IV-016","kurztitel":"Art. 13 Abs. 8 – Ausnahme (Vertragsparteien)","beschreibung":"Art. 13 gilt weder für Klauseln über den Hauptgegenstand des Vertrags noch für die Angemessenheit des Preises der Gegenleistung für die Daten.","fundstelle":"Art. 13 Abs. 8 (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":136,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-IV-017","kurztitel":"Art. 13 Abs. 9 – Unterlassungspflicht (Vertragsparteien)","beschreibung":"Die Parteien dürfen die Anwendung von Art. 13 nicht ausschließen, davon abweichen oder seine Wirkungen abändern.","fundstelle":"Art. 13 Abs. 9 (Kapitel IV)","ab_wann":"Verträge, die nach dem 12.09.2025 geschlossen wurden: ab 12.09.2025; Altverträge (am/vor 12.09.2025 geschlossen), die unbefristet sind oder frühestens 10 Jahre nach 11.01.2024 enden: ab 12.09.2027 (Art. 50 UAbs. 5, 6)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren."},{"req_id":"DA-V-001","kurztitel":"Datenbereitstellung an Behörden bei außergewöhnlicher Notwendigkeit","beschreibung":"Weist eine öffentliche Stelle, die Kommission, die EZB oder eine Einrichtung der Union eine außergewöhnliche Notwendigkeit i. S. d. Art. 15 nach, stellt der Dateninhaber die verlangten Daten inkl. erforderlicher Metadaten auf ordnungsgemäß begründeten Antrag bereit.","fundstelle":"Art. 14 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen und Prüfprozess für Behördenverlangen benennen. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":11,"laenge":18,"begriff":"Einrichtungen der Union / öffentliche Stelle"},{"start":157,"laenge":12,"begriff":"Dateninhaber"},{"start":185,"laenge":5,"begriff":"Daten"},{"start":212,"laenge":9,"begriff":"Metadaten"}]},{"req_id":"DA-V-002","kurztitel":"Art. 15 Abs. 1 Buchst. a – Ausnahme (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Außergewöhnliche Notwendigkeit liegt vor, wenn die Daten zur Bewältigung eines öffentlichen Notstands erforderlich sind und nicht rechtzeitig, wirksam und unter gleichwertigen Bedingungen anders beschafft werden können; sie ist zeitlich und im Umfang begrenzt.","fundstelle":"Art. 15 Abs. 1 Buchst. a (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten.","beschreibung_begriffe":[{"start":51,"laenge":5,"begriff":"Daten"},{"start":79,"laenge":22,"begriff":"Öffentlicher Notstand"}]},{"req_id":"DA-V-003","kurztitel":"Art. 15 Abs. 1 Buchst. b – Ausnahme (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Außerhalb eines Notstands nur für nicht-personenbezogene Daten, wenn (i) die Stelle spezifische Daten ermittelt hat, deren Fehlen sie an einer gesetzlich ausdrücklich vorgesehenen Aufgabe im öffentlichen Interesse hindert (z. B. amtliche Statistik), und (ii) alle anderen Mittel ausgeschöpft sind (Kauf zu Marktpreisen, bestehende Pflichten, neue Rechtsvorschriften).","fundstelle":"Art. 15 Abs. 1 Buchst. b (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten. Auslegungsunsicherheit: juristische Prüfung empfohlen.","beschreibung_begriffe":[{"start":34,"laenge":28,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"},{"start":96,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-V-004","kurztitel":"Schutz für Kleinst-/Kleinunternehmen","beschreibung":"Verlangen nach Art. 15 Abs. 1 Buchst. b (außergewöhnliche Notwendigkeit ohne Notstand) können nicht an Kleinst- und Kleinunternehmen gerichtet werden.","fundstelle":"Art. 15 Abs. 2 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verlangen außerhalb eines Notstands zurückweisen.","beschreibung_begriffe":[{"start":116,"laenge":16,"begriff":"Kleinunternehmen / Kleinstunternehmen (und mittlere Unternehmen, KMU)"}]},{"req_id":"DA-V-005","kurztitel":"Art. 16 Abs. 1, 2 – Ausnahme (Dateninhaber)","beschreibung":"Kapitel V lässt Berichts-, Informationszugangs- und Compliance-Nachweispflichten nach Unions-/nationalem Recht unberührt und gilt nicht für Stellen bei Strafverfolgung, Ordnungswidrigkeiten, Strafvollstreckung, Zoll- oder Steuerverwaltung.","fundstelle":"Art. 16 Abs. 1, 2 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Voraussetzungen dokumentieren; bei Änderungen neu bewerten."},{"req_id":"DA-V-006","kurztitel":"Art. 17 Abs. 1 – Handlungspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Ein Datenverlangen muss: (a) benötigte Daten und Metadaten angeben, (b) außergewöhnliche Notwendigkeit nachweisen, (c) Zweck, Nutzung (auch durch Dritte) und Dauer erläutern, (d) voraussichtlichen Löschzeitpunkt angeben, (e) Wahl des Dateninhabers begründen, (f) weitere Empfänger benennen, (g) bei personenbezogenen Daten Schutzmaßnahmen (z. B. Pseudonymisierung) und Anonymisierungsmöglichkeit angeben, (h) Rechtsgrundlage der Aufgabe angeben, (i) Bereitstellungsfrist und Ablehnungsfrist nach Art. 18 Abs. 2 nennen, (j) Haftungsrisiken des Dateninhabers nach Kräften vermeiden.","fundstelle":"Art. 17 Abs. 1 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":39,"laenge":5,"begriff":"Daten"},{"start":49,"laenge":9,"begriff":"Metadaten"},{"start":234,"laenge":13,"begriff":"Dateninhaber"},{"start":299,"laenge":23,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}]},{"req_id":"DA-V-007","kurztitel":"Art. 17 Abs. 2 – Handlungspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Das Verlangen muss schriftlich, klar und verständlich sein, sich auf Daten unter Kontrolle des Dateninhabers beziehen, verhältnismäßig und begründet sein, Geschäftsgeheimnisse achten (Art. 19 Abs. 3) und Kosten/Aufwand berücksichtigen, primär nicht-personenbezogene Daten betreffen (personenbezogene nur pseudonymisiert bei Notstand), über Sanktionen nach Art. 40 aufklären, dem Datenkoordinator übermittelt bzw. online veröffentlicht werden und bei personenbezogenen Daten der Datenschutzaufsicht gemeldet werden.","fundstelle":"Art. 17 Abs. 2 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Verantwortlichen benennen, Prozess/Umsetzung dokumentieren.","beschreibung_begriffe":[{"start":69,"laenge":5,"begriff":"Daten"},{"start":95,"laenge":13,"begriff":"Dateninhaber"},{"start":243,"laenge":28,"begriff":"Personenbezogene Daten / nicht-personenbezogene Daten"}]},{"req_id":"DA-V-008","kurztitel":"Art. 17 Abs. 3 – Unterlassungspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Nach Kapitel V erlangte Daten dürfen nicht zur Weiterverwendung i. S. d. DGA bzw. der Open-Data-RL bereitgestellt werden; diese Rechtsakte finden auf solche Daten keine Anwendung.","fundstelle":"Art. 17 Abs. 3 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Interne Richtlinie und Kontrolle etablieren.","beschreibung_begriffe":[{"start":24,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-V-009","kurztitel":"Art. 17 Abs. 4 – Informationspflicht (Öffentliche Stelle, Kommission, EZB, Ein)","beschreibung":"Bei Austausch der Daten mit anderen Stellen oder Weitergabe an beauftragte Dritte (öffentlich verfügbare Vereinbarung) gelten die Pflichten nach Art. 19 auch für diese Dritten; der Dateninhaber ist unverzüglich zu unterrichten.","fundstelle":"Art. 17 Abs. 4 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Informationstext erstellen und im richtigen Kanal bereitstellen.","beschreibung_begriffe":[{"start":18,"laenge":5,"begriff":"Daten"},{"start":181,"laenge":12,"begriff":"Dateninhaber"}]},{"req_id":"DA-V-010","kurztitel":"Art. 17 Abs. 5 – Recht (Dateninhaber)","beschreibung":"Hält der Dateninhaber seine Rechte durch Übermittlung/Bereitstellung der Daten für verletzt, kann er bei der zuständigen Behörde seines Niederlassungsmitgliedstaats Beschwerde einlegen.","fundstelle":"Art. 17 Abs. 5 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Recht kennen und im Bedarfsfall geltend machen.","beschreibung_begriffe":[{"start":9,"laenge":12,"begriff":"Dateninhaber"},{"start":73,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-V-011","kurztitel":"Unverzügliche Bereitstellung","beschreibung":"Der Dateninhaber stellt die Daten der anfragenden Stelle unverzüglich bereit, unter Berücksichtigung der erforderlichen technischen, organisatorischen und rechtlichen Maßnahmen.","fundstelle":"Art. 18 Abs. 1 (Kapitel V)","ab_wann":"12.09.2025 (Art. 50 UAbs. 2)","naechste_schritte":"Technischen Übergabeweg und Verantwortlichkeiten festlegen.","beschreibung_begriffe":[{"start":4,"laenge":12,"begriff":"Dateninhaber"},{"start":28,"laenge":5,"begriff":"Daten"}]},{"req_id":"DA-V-012","kurztitel":"Ablehnung oder Änderungsantrag fristgebunden","beschreibung":"Der Dateninhaber kann das Verlangen ablehnen oder Änderung beantragen – bei Notstand unverzüglich, spätestens 5 Arbeitstage, sonst spätestens 30 Arbeitstage nach Eingang – wenn (a) er keine Kontrolle über die Da
