<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU Data Act — Ableitung von Rechtsfolgen</title>
<meta name="description" content="Bewertungsgegenstand + Anknüpfungspunkt + Sachverhalt = Rechtsfolge. Läuft vollständig offline.">
<style>

:root {
  --tinte:   #14181C;
  --grau:    #5B6369;
  --linie:   #D8DBDE;
  --ast:     #A7AEB5;   /* die gezeichneten Äste - dunkler als eine Trennlinie */
  --flaeche: #F5F6F7;
  --papier:  #FFFFFF;
  --akzent:  #0F6152;
  --warn:    #8A5A12;

  --schrift: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --tabellar: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
              "Liberation Mono", monospace;

  --a1: .25rem; --a2: .5rem; --a3: .75rem; --a4: 1rem;
  --a5: 1.5rem; --a6: 2rem;

  --t-mini:  .6875rem;
  --t-meta:  .75rem;
  --t-klein: .8125rem;
  --t-text:  .9375rem;
  --t-gross: 1.375rem;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papier); color: var(--tinte);
  font-family: var(--schrift); font-size: var(--t-text); line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.25; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
.verborgen {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

.seite { max-width: 76rem; margin: 0 auto; padding: var(--a5) var(--a5) var(--a6); }

/* --------------------------------------------------------------- Kopf */
.kopf { border-bottom: 2px solid var(--tinte); padding-bottom: var(--a3);
        margin-bottom: var(--a4); }
.kopf h1 { font-size: var(--t-gross); letter-spacing: -.012em; }
.kopf__zeile { font-size: var(--t-klein); color: var(--grau); margin-top: var(--a1); }
.kopf__hinweis { font-size: var(--t-mini); color: var(--grau); margin-top: var(--a2); }

/* ======================================================= Steuerung */
.steuer { display: flex; flex-wrap: wrap; gap: var(--a2); align-items: center;
          margin-bottom: var(--a5); }
.steuer__hinweis { font-size: var(--t-meta); color: var(--grau); margin-left: auto; }
.tat {
  border: 1px solid var(--linie); background: var(--papier); color: var(--tinte);
  border-radius: 4px; padding: var(--a2) var(--a3); font-size: var(--t-klein);
  cursor: pointer;
}
.tat:hover { background: var(--flaeche); border-color: var(--grau); }

/* ============================================================ Ein Baum */
/* Senkrecht von oben nach unten: Wurzel, Gabelfrage, zwei Aeste, je Ast
   seine Sachverhalte an einem Strang. Gezeichnet wird mit Rahmenkanten auf
   Pseudo-Elementen - kein SVG, kein Skript fuer das Bild. */
.baum { margin: 0 0 var(--a6); padding-bottom: var(--a5);
        border-bottom: 1px solid var(--linie); }
.baum:last-of-type { border-bottom: 0; }

/* -------------------------------------------------------------- Wurzel */
.wurzel {
  max-width: 32rem; margin: 0 auto; text-align: center;
  border: 2px solid var(--tinte); border-radius: 6px;
  padding: var(--a3) var(--a4); background: var(--papier);
}
.wurzel__marke {
  display: block; font-size: var(--t-mini); letter-spacing: .09em;
  text-transform: uppercase; color: var(--grau);
}
.wurzel h2 { font-size: 1.125rem; margin-top: var(--a1); }
.wurzel__kurz { margin: var(--a1) 0 0; font-size: var(--t-klein); color: var(--grau); }
.wurzel__vor {
  margin: var(--a2) 0 0; font-size: var(--t-meta); color: var(--grau);
  border-top: 1px dashed var(--linie); padding-top: var(--a2);
}
.wurzel__marke--firma {
  display: inline-block; margin-top: var(--a2); border-radius: 999px;
  padding: 1px var(--a2); font-size: var(--t-mini);
  background: var(--flaeche); color: var(--grau); text-transform: none;
  letter-spacing: 0;
}
.wurzel__marke--ja   { background: #E6F0ED; color: var(--akzent); }
.wurzel__marke--offen{ background: #F6EEDF; color: var(--warn); }

/* --------------------------------------------------- Gabelfrage (Ast 1) */
.gabel {
  position: relative; max-width: 44rem; margin: 0 auto; text-align: center;
  margin-top: var(--a5); padding: var(--a3) var(--a4);
  border: 1px solid var(--ast); border-radius: 6px; background: var(--flaeche);
}
.gabel::before {                       /* Linie von der Wurzel herunter */
  content: ""; position: absolute; left: 50%; top: calc(-1 * var(--a5));
  height: var(--a5); border-left: 2px solid var(--ast);
}
.gabel__id {
  font-family: var(--tabellar); font-size: var(--t-mini); color: var(--grau);
  letter-spacing: .04em;
}
.gabel__text { display: block; margin-top: var(--a1); font-size: var(--t-klein); }

/* ------------------------------------------------------- Die Verzweigung */
/* Kein Abstand zwischen den Aesten: der waagerechte Balken laeuft ueber beide
   hinweg, eine Flex-Luecke risse ihn genau in der Mitte auf. Getrennt werden
   die Aeste durch ihr eigenes seitliches Polster. */
.aeste {
  position: relative; display: flex; justify-content: center;
  align-items: stretch; gap: 0; padding-top: var(--a5);
}
.aeste::before {                       /* Linie von der Gabelfrage herunter */
  content: ""; position: absolute; left: 50%; top: 0;
  height: var(--a5); border-left: 2px solid var(--ast);
}
.ast { position: relative; flex: 1 1 0; min-width: 0;
       padding: var(--a5) var(--a2) 0; }
/* Waagerechter Balken und der Abgang in den Knoten: die linke Haelfte traegt
   ::before, die rechte ::after. Am ersten Ast faellt die linke Haelfte weg, am
   letzten die rechte - der Abgang kommt dort vom jeweils anderen Rand. */
.ast::before, .ast::after {
  content: ""; position: absolute; top: 0; right: 50%; width: 50%;
  height: var(--a5); border-top: 2px solid var(--ast);
}
.ast::after { right: auto; left: 50%; border-left: 2px solid var(--ast); }
.ast:first-child::before { border: 0; }
.ast:last-child::after   { border: 0; }
.ast:first-child::after  { border-top-left-radius: 6px; }
.ast:last-child::before  { border-right: 2px solid var(--ast);
                           border-top-right-radius: 6px; }
.ast:only-child::before { display: none; }
.ast:only-child::after  { border-top: 0; border-left: 2px solid var(--ast); }

/* ------------------------------------------------- Anknuepfungspunkt */
.anker {
  border: 2px solid var(--tinte); border-radius: 6px; background: var(--papier);
  padding: var(--a3);
}
.anker__zeile { display: flex; align-items: baseline; gap: var(--a2); }
.anker__taste {
  flex: 0 0 auto; font-family: var(--tabellar); font-size: var(--t-meta);
  background: var(--tinte); color: var(--papier); border-radius: 3px;
  padding: 1px 6px;
}
.anker__name { font-weight: 600; }
.anker__opt {
  display: block; margin-top: var(--a2); font-size: var(--t-meta);
  color: var(--grau); font-style: italic;
}
.anker__hinweis {
  display: block; margin-top: var(--a2); padding-top: var(--a2);
  border-top: 1px solid var(--ast); font-size: var(--t-meta);
  color: var(--grau);
}
.anker--anspruch { border-color: var(--warn); }
.anker--anspruch .anker__taste { background: var(--warn); }

/* -------------------------------------------- Sachverhalte am Strang */
.blaetter { position: relative; padding-top: var(--a4); }
.blaetter::before {                    /* aus dem Knoten heraus nach unten */
  content: ""; position: absolute; left: 15px; top: 0; height: var(--a4);
  border-left: 2px solid var(--ast);
}
.blatt { position: relative; padding-left: 32px; margin-top: var(--a3); }
.blatt:first-child { margin-top: 0; }
.blatt::before {                       /* der Ellenbogen in den Sachverhalt */
  content: ""; position: absolute; left: 15px; top: 0; width: 15px; height: 20px;
  border-left: 2px solid var(--ast); border-bottom: 2px solid var(--ast);
  border-bottom-left-radius: 6px;
}
.blatt:not(:last-child)::after {       /* der Strang laeuft weiter */
  content: ""; position: absolute; left: 15px; top: 0;
  bottom: calc(-1 * var(--a3)); border-left: 2px solid var(--ast);
}

/* --------------------------------------------------- Frage am Sachverhalt */
.blatt__frage {
  font-size: var(--t-meta); color: var(--grau); margin-bottom: var(--a1);
  padding-left: var(--a1);
}
.blatt__fid { font-family: var(--tabellar); letter-spacing: .04em; }
.blatt__antwort {
  display: inline-block; border: 1px solid var(--akzent); color: var(--akzent);
  border-radius: 999px; padding: 0 6px; font-size: var(--t-mini);
  white-space: nowrap;
}
.blatt__warn { display: block; color: var(--warn); margin-top: 2px; }

/* ------------------------------------------------- Sachverhalt + Folge */
.knoten {
  display: block; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid var(--linie); border-left: 4px solid var(--akzent);
  border-radius: 4px; background: var(--papier); padding: var(--a2) var(--a3);
}
.knoten:hover { background: var(--flaeche); }
.knoten--auf { background: var(--flaeche); }
.knoten--anspruch { border-left-color: var(--warn); }
.knoten__zeile { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--a2); }
.knoten__name { font-weight: 600; font-size: var(--t-klein); }
.knoten__erg { color: var(--grau); font-weight: 400; }
.knoten__kap {
  font-weight: 600; font-size: var(--t-meta); color: var(--akzent);
  white-space: nowrap;
}
.knoten--anspruch .knoten__kap { color: var(--warn); }
.knoten__pfeil { margin-left: auto; color: var(--grau); font-size: var(--t-meta); }
.knoten__zahl { display: block; margin-top: 2px; font-size: var(--t-meta); color: var(--grau); }
.knoten__art {
  font-family: var(--tabellar); font-size: var(--t-mini); color: var(--grau);
}

/* ------------------------------------------------- Anforderungsliste */
.liste { margin-top: var(--a2); border: 1px solid var(--linie); border-radius: 4px; }
.req {
  display: grid; grid-template-columns: 6rem 8.5rem minmax(0, 1fr) 9rem 5rem;
  gap: var(--a2); padding: var(--a2) var(--a3);
  border-top: 1px solid var(--linie); font-size: var(--t-meta);
}
.req:first-child { border-top: 0; }
.req--fremd { background: var(--flaeche); }
.req--anspruch { background: #FBF6EC; }
.req__id, .req__stelle { font-family: var(--tabellar); font-size: var(--t-mini);
                         color: var(--grau); }
.req__titel { color: var(--tinte); }
.req__adressat { color: var(--grau); font-style: italic; }
.req__typ { color: var(--grau); text-align: right; }

/* ---------------------------------------------------------------- Fuss */
.fuss { margin-top: var(--a6); padding-top: var(--a4);
        border-top: 2px solid var(--tinte); font-size: var(--t-meta);
        color: var(--grau); display: grid; gap: var(--a2); }
.fuss__luecke { border-left: 3px solid var(--warn); padding-left: var(--a3);
                color: var(--tinte); }
.fuss__stand { }

/* --------------------------- Senkrechte Verzweigung: schmal und im Druck */
/* Statt Balken und Abgang traegt jeder Ast denselben Ellenbogen wie ein
   Sachverhalt. Schmal, weil zwei Spalten nicht nebeneinanderpassen; im Druck,
   weil die Anforderungszeile auf halber Seitenbreite ineinanderlaeuft. */
@media (max-width: 62rem), print {
  .aeste { display: block; padding-top: var(--a4); padding-left: 32px; }
  .aeste::before { left: 15px; height: var(--a4); }
  .ast { padding: 0 0 0 0; margin-top: var(--a4); }
  .ast:first-child { margin-top: 0; }
  .ast::before {
    top: 0; left: -17px; right: auto; width: 15px; height: 20px;
    border-top: 0; border-left: 2px solid var(--ast);
    border-bottom: 2px solid var(--ast); border-right: 0;
    border-radius: 0 0 0 6px;
  }
  .ast::after { display: none; }
}

/* ------------------------------------------------------- Schmale Sicht */
@media (max-width: 62rem) {
  .seite { padding: var(--a4) var(--a3) var(--a6); }
  /* Schmal wird aus der Zeile ein kleiner Absatz: Kennung und Fundstelle
     nebeneinander, darunter Titel, Adressat und Typ je auf voller Breite.
     Sonst quetscht sich der Titel in die 5,5rem der ersten Spalte. */
  .req { grid-template-columns: 5.5rem minmax(0, 1fr); gap: 2px var(--a2); }
  .req__id       { grid-column: 1; grid-row: 1; }
  .req__stelle   { grid-column: 2; grid-row: 1; }
  .req__titel    { grid-column: 1 / -1; grid-row: 2; }
  .req__adressat { grid-column: 1 / -1; grid-row: 3; }
  .req__typ      { grid-column: 1 / -1; grid-row: 4; text-align: left; }
}

/* --------------------------------------------------------------- Druck */
@media print {
  .tat, .steuer { display: none !important; }
  body { font-size: 9pt; color: #000; }
  .seite { max-width: none; padding: 0; }
  .baum { break-before: page; }
  .baum:first-of-type { break-before: auto; }
  .blatt, .wurzel, .gabel, .anker, .req { break-inside: avoid; }
  .knoten__pfeil { display: none; }
  @page { margin: 12mm; size: A4 portrait; }
}

</style>

<script>(function () {

/* Drei senkrechte Entscheidungsbäume nach dem Ordnungsrahmen der Folie.

   Bewertungsgegenstand -> Anknüpfungspunkt -> Sachverhalt -> Rechtsfolge.

   Alle drei Bäume stehen vollständig auf der Seite: Wurzel, Gabelfrage, beide
   Äste, jeder Sachverhalt an seinem Strang. Nichts klappt zu - man soll die
   Verzweigung sehen, nicht sich durch sie hindurchklicken. Beweglich ist nur
   die Anforderungsliste am einzelnen Sachverhalt, und die auch nur, weil 128
   Zeilen auf einmal die Bäume unlesbar machen würden.

   aufgelöst, den Adressaten je Anforderung mit der Rolle des Anknüpfungspunkts
   abgeglichen und die Fragetexte wortgetreu aus dem Blatt "Fragen" eingesetzt. */

var TYP_KURZ = {
  "Handlungspflicht": "Handlung", "Informationspflicht": "Information",
  "Unterlassungspflicht": "Unterlassung", "Recht": "Recht", "Ausnahme": "Ausnahme"
};

/* ------------------------------------------------------------- Bausteine */
function el(tag, attrs, kinder) {
  var k = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (a) {
    var w = attrs[a];
    if (w === null || w === undefined || w === false) return;
    if (a === "text") k.textContent = w;
    else if (a === "class") k.className = w;
    else if (a.slice(0, 2) === "on") k.addEventListener(a.slice(2), w);
    else k.setAttribute(a, w === true ? "" : String(w));
  });
  (kinder || []).forEach(function (kind) {
    if (kind === null || kind === undefined || kind === false) return;
    k.appendChild(typeof kind === "string" ? document.createTextNode(kind) : kind);
  });
  return k;
}

function sage(t) { document.getElementById("live").textContent = t; }
function kapText(l) { return "Kap. " + (l || []).join(" + "); }
function pfad(b, p, s) { return b.id + "/" + p.id + "/" + s.id; }

function alleBlaetter() {
  var aus = [];
  D.baeume.forEach(function (b) {
    b.anknuepfungspunkte.forEach(function (p) {
      p.sachverhalte.forEach(function (s) { aus.push([b, p, s]); });
    });
  });
  return aus;
}

/* Die Rechtsfolge in Worten - je nachdem, ob der Anknüpfungspunkt die
   Anforderung selbst trifft, sie gegen die Gegenseite gibt oder keines. */
function folgeText(p, s) {
  var n = s.zahl, teile = [];
  if (n.pflicht) teile.push(n.pflicht + (n.pflicht === 1 ? " Pflicht" : " Pflichten"));
  if (n.anspruch) teile.push(n.anspruch + (n.anspruch === 1 ? " Anspruch" : " Ansprüche")

  if (n.recht) teile.push(n.recht + (n.recht === 1 ? " Recht" : " Rechte"));
  if (n.ausnahme) teile.push(n.ausnahme + (n.ausnahme === 1 ? " Ausnahme" : " Ausnahmen"));
  if (n.gegenseite) teile.push(n.gegenseite
    + (n.gegenseite === 1 ? " Pflicht der Gegenseite" : " Pflichten der Gegenseite"));
  return teile.join(" · ");
}
function kurzRolle(r) {
  return r.replace(/^Anbieter von Datenverarbeitungsdienst.*$/, "Anbieter");
}

  try { localStorage.setItem(SCHLUESSEL, JSON.stringify(OFFEN)); } catch (e) {}

    var gueltig = {};
    alleBlaetter().forEach(function (t) {
      var k = pfad(t[0], t[1], t[2]);
      if (w[k]) gueltig[k] = true;
    });
    OFFEN = gueltig;
  } catch (e) {}
}

function schalte(b, p, s) {
  var k = pfad(b, p, s);
  if (OFFEN[k]) delete OFFEN[k]; else OFFEN[k] = true;
  speichere();
  zeichne();
  sage(s.name + (OFFEN[k] ? ": " + s.zahl.gesamt + " Anforderungen eingeblendet"
                          : ": Liste zugeklappt"));
}

/* ------------------------------------------------------------- Ein Blatt */
function zeichneBlatt(b, p, s) {
  var auf = !!OFFEN[pfad(b, p, s)];
  var anspruch = !!s.zahl.anspruch && !s.zahl.pflicht;

  var frage = el("div", { class: "blatt__frage" }, [
    el("span", { class: "blatt__fid", text: "Frage " + s.frage.id + " · " }),
    s.frage.text + " ",
    el("span", { class: "blatt__antwort", text: s.frage.antwort.schluessel === s.frage.antwort.text
        ? s.frage.antwort.text
        : s.frage.antwort.schluessel + " — " + s.frage.antwort.text }),
    s.frage_hinweis ? el("span", { class: "blatt__warn", text: s.frage_hinweis }) : null
  ]);

  var knopf = el("button", {
    class: "knoten" + (auf ? " knoten--auf" : "") + (anspruch ? " knoten--anspruch" : ""),
    type: "button", "aria-expanded": auf ? "true" : "false",
    onclick: function () { schalte(b, p, s); }
  }, [
    el("span", { class: "knoten__zeile" }, [
      el("span", { class: "knoten__name" }, [
        s.name,
        s.ergaenzt ? el("span", { class: "knoten__erg", text: " ⊕",
          title: "über die Fundstelle ergänzt, nicht auf der Folie" }) : null
      ]),
      el("span", { class: "knoten__kap", text: "→ " + kapText(s.kapitel) }),
      el("span", { class: "knoten__pfeil", text: auf ? "▾ zuklappen" : "▸ Anforderungen" })
    ]),
    el("span", { class: "knoten__zahl" }, [
      folgeText(p, s) + " · ",
      el("span", { class: "knoten__art", text: (s.fundstellen || []).join(", ") })
    ])
  ]);

  var blatt = el("div", { class: "blatt" }, [frage, knopf]);
  if (auf) blatt.appendChild(zeichneListe(s));
  return blatt;
}

function zeichneListe(s) {
  var liste = el("div", { class: "liste" });
  s.anforderungen.forEach(function (e) {
    liste.appendChild(el("div", { class: "req"
      + (e.eigen ? "" : (e.anspruch ? " req--anspruch" : " req--fremd")) }, [
      el("span", { class: "req__id", text: e.id }),
      el("span", { class: "req__stelle", text: e.fundstelle }),
      el("span", { class: "req__titel", text: e.titel }),
      el("span", { class: "req__adressat", text: e.adressat }),
      el("span", { class: "req__typ", text: TYP_KURZ[e.typ] || e.typ })
    ]));
  });
  return liste;
}

/* --------------------------------------------------------------- Ein Ast */
function zeichneAst(b, p) {
  var anspruch = !p.rolle && !!p.anspruch_gegen;
  var anker = el("div", { class: "anker" + (anspruch ? " anker--anspruch" : "") }, [
    el("span", { class: "anker__zeile" }, [
      p.antwort ? el("span", { class: "anker__taste", text: p.antwort.schluessel }) : null,
      el("span", { class: "anker__name", text: p.name })
    ]),
    p.antwort ? el("span", { class: "anker__opt", text: "„" + p.antwort.text + "“" }) : null,
    p.hinweis ? el("span", { class: "anker__hinweis", text: p.hinweis }) : null
  ]);

  var blaetter = el("div", { class: "blaetter" });
  p.sachverhalte.forEach(function (s) { blaetter.appendChild(zeichneBlatt(b, p, s)); });

  return el("div", { class: "ast" }, [anker, blaetter]);
}

/* -------------------------------------------------------------- Ein Baum */
function zeichneBaum(b, nr) {
  var wurzel = el("div", { class: "wurzel" }, [
    el("span", { class: "wurzel__marke",
                 text: D.formel[0] + " " + nr + " von " + D.baeume.length }),
    el("h2", { text: b.gegenstand }),
    b.kurz ? el("p", { class: "wurzel__kurz", text: b.kurz }) : null,
    b.marke ? el("span", { class: "wurzel__marke--firma wurzel__marke--" + b.marke,
                           title: b.grund || null,
                           text: D.unternehmen.name + ": " + (D.marken[b.marke] || b.marke) }) : null,
    b.voraussetzung ? el("p", { class: "wurzel__vor",
      text: "Voraussetzung — Frage " + b.voraussetzung.id + ": "
            + b.voraussetzung.text + " → " + b.voraussetzung.antwort.text }) : null
  ]);

  var gabel = b.gabel ? el("div", { class: "gabel" }, [
    el("span", { class: "gabel__id", text: "Frage " + b.gabel.id }),
    el("span", { class: "gabel__text", text: b.gabel.text })
  ]) : null;

  var aeste = el("div", { class: "aeste" });
  b.anknuepfungspunkte.forEach(function (p) { aeste.appendChild(zeichneAst(b, p)); });

  return el("section", { class: "baum", "aria-label": D.formel[0] + ": " + b.gegenstand },
            [wurzel, gabel, aeste]);
}

/* ---------------------------------------------------------------- Seite */
function kopf() {
  return el("header", { class: "kopf" }, [
    el("h1", { text: D.titel }),
    el("div", { class: "kopf__zeile",
                text: D.unternehmen.name + " · " + D.unternehmen.kurz }),
    el("div", { class: "kopf__hinweis",
                text: D.formel.join(" + ").replace(/ \+ ([^+]*)$/, " = $1")
                      + " · Strukturierte Orientierung nach VO (EU) 2023/2854 · "
                      + "keine Rechtsberatung · Rechtsstand 18.09.2026" })
  ]);
}

function steuer() {
  var alle = alleBlaetter();
  var offenZahl = alle.filter(function (t) { return OFFEN[pfad(t[0], t[1], t[2])]; }).length;
  var alleAuf = offenZahl === alle.length;
  return el("div", { class: "steuer" }, [
    el("button", { class: "tat", type: "button",
      text: alleAuf ? "Alle Anforderungen verbergen" : "Alle Anforderungen zeigen",
      onclick: function () {
        OFFEN = {};
        if (!alleAuf) alle.forEach(function (t) { OFFEN[pfad(t[0], t[1], t[2])] = true; });
        speichere(); zeichne();
        sage(alleAuf ? "alle Listen zugeklappt" : "alle Listen eingeblendet");
      } }),
    el("button", { class: "tat", type: "button", text: "Drucken / PDF",
                   onclick: function () { window.print(); } }),
    el("span", { class: "steuer__hinweis",
      text: D.baeume.length + " Bäume · " + alle.length + " Sachverhalte · "
            + alle.reduce(function (n, t) { return n + t[2].zahl.gesamt; }, 0)
            + " Anforderungszeilen" })
  ]);
}

function fuss() {
  var f = el("footer", { class: "fuss" });
  if (D.nicht_abgedeckt) {
    f.appendChild(el("div", { class: "fuss__luecke" }, [
      el("b", { text: D.nicht_abgedeckt.titel + ": " }),
      D.nicht_abgedeckt.text
    ]));
  }
  f.appendChild(el("span", { text: "Die Fragen stehen wortgetreu im Fragenkatalog. "
    + "Welche Anforderungen ein Sachverhalt auslöst, entscheidet seine Fundstelle "
    + "im Verordnungstext — nicht der Fragebogenpfad." }));
  f.appendChild(el("span", { class: "fuss__stand", text: RECHTSSTAND }));
  f.appendChild(el("span", { text: "Läuft vollständig lokal: kein Netzwerkaufruf, "
                                 + "kein Tracking." }));
  return f;
}

function zeichne() {
  var seite = document.getElementById("seite");
  var scroll = window.scrollY;
  leere(seite);
  seite.appendChild(kopf());
  seite.appendChild(steuer());
  D.baeume.forEach(function (b, i) { seite.appendChild(zeichneBaum(b, i + 1)); });
  seite.appendChild(fuss());
  window.scrollTo(0, scroll);
}

(function start() {
  lade();
  var vorDruck = null;
  window.addEventListener("beforeprint", function () {
    /* Auf Papier gibt es kein Aufklappen - dort steht alles. */
    vorDruck = OFFEN;
    OFFEN = {};
    alleBlaetter().forEach(function (t) { OFFEN[pfad(t[0], t[1], t[2])] = true; });
    zeichne();
  });
  window.addEventListener("afterprint", function () {
    if (vorDruck) { OFFEN = vorDruck; vorDruck = null; zeichne(); }
  });
  zeichne();
})();

})();
</script>
</body>
</html>
